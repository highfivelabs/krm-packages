apiVersion: compute.azure.hfl.dev/v20250401
kind: VirtualMachine
metadata:
  name: backup-vm
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "backup"
    app.kubernetes.io/name: avm-res-compute-virtualmachine
    app.kubernetes.io/version: "0.6.0"
  annotations:
    hfl.dev/id: "virtual_machine"
spec:
  azureName: "vm"
  location: "eastus2"
  owner:
    armId: "/subscriptions/s/resourceGroups/rg"
  extensionsTimeBudget: "PT1H30M"
  hardwareProfile:
    vmSize: "Standard_D2ds_v5"
  networkProfile:
    networkInterfaces:
      - reference:
          armId: /subscriptions/s/resourceGroups/rg/providers/Microsoft.Network/networkInterfaces/default-ipv4-ipconfig
        primary: true
  osProfile:
    adminUsername: "azureuser"
    allowExtensionOperations: true
    computerName: "vm"
    linuxConfiguration:
      disablePasswordAuthentication: true
      patchSettings:
        assessmentMode: ImageDefault
        patchMode: ImageDefault
      provisionVMAgent: true
      ssh:
        publicKeys:
          - keyData: "ssh-ed25519 AAAA k"
            path: "/home/azureuser/.ssh/authorized_keys"
  priority: Regular
  securityProfile:
    encryptionAtHost: true
  storageProfile:
    imageReference:
      offer: "WindowsServer"
      publisher: "MicrosoftWindowsServer"
      sku: "2022-datacenter-g2"
      version: "latest"
    osDisk:
      caching: ReadWrite
      createOption: FromImage
      deleteOption: Delete
      managedDisk:
        storageAccountType: Premium_LRS
      osType: Linux
      writeAcceleratorEnabled: false
