# Backup turned on in a Recovery Services vault: one entry excluding data
# disks, one including them (exclude wins when both are set, as in the module).
name: vm
location: eastus2
resource_group_name: /subscriptions/s/resourceGroups/rg
zone: null
os_type: Linux
account_credentials: {admin_credentials: {ssh_keys: ["ssh-ed25519 AAAA k"], generate_admin_password_or_ssh_key: false}}
azure_backup_configurations:
  daily:
    recovery_vault_resource_id: /subscriptions/s/resourceGroups/backup/providers/Microsoft.RecoveryServices/vaults/v
    backup_policy_resource_id: /subscriptions/s/resourceGroups/backup/providers/Microsoft.RecoveryServices/vaults/v/backupPolicies/daily
    exclude_disk_luns: [1, 2]
  os-only:
    recovery_vault_resource_id: /subscriptions/s/resourceGroups/backup/providers/Microsoft.RecoveryServices/vaults/v2
    backup_policy_resource_id: /subscriptions/s/resourceGroups/backup/providers/Microsoft.RecoveryServices/vaults/v2/backupPolicies/weekly
    include_disk_luns: [0]
