---
# Source: opensearch/templates/opensearch.yaml
apiVersion: opensearchservice.services.k8s.aws/v1alpha1
kind: Domain
metadata:
  name: vpc-domain
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "vpc"
    app.kubernetes.io/name: opensearch
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "domain"
    services.k8s.aws/region: "us-east-1"
spec:
  advancedSecurityOptions:
    anonymousAuthEnabled: false
    enabled: true
  autoTuneOptions:
    desiredState: ENABLED
  clusterConfig:
    dedicatedMasterCount: 3
    dedicatedMasterEnabled: true
    dedicatedMasterType: c6g.large.search
    instanceCount: 3
    instanceType: r6g.large.search
    zoneAwarenessEnabled: true
  domainEndpointOptions:
    enforceHTTPS: true
    tlsSecurityPolicy: Policy-Min-TLS-1-2-2019-07
  ebsOptions:
    ebsEnabled: true
    volumeSize: 64
    volumeType: gp3
  encryptionAtRestOptions:
    enabled: true
  engineVersion: OpenSearch_2.17
  name: catalog-os-vpc
  nodeToNodeEncryptionOptions:
    enabled: true
  offPeakWindowOptions:
    enabled: true
  softwareUpdateOptions:
    autoSoftwareUpdateEnabled: true
  vpcOptions:
    securityGroupRefs:
    - from:
        name: vpc-sg
    subnetIDs:
    - subnet-0123456789abcdef0
    - subnet-0123456789abcdef1
---
# Source: opensearch/templates/opensearch.yaml
apiVersion: ec2.services.k8s.aws/v1alpha1
kind: SecurityGroup
metadata:
  name: vpc-sg
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "vpc"
    app.kubernetes.io/name: opensearch
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "security-group"
    services.k8s.aws/region: "us-east-1"
spec:
  name: "os-clients"
  description: "Managed by Terraform"
  vpcID: "vpc-0123456789abcdef0"
  ingressRules:
    - ipProtocol: "tcp"
      fromPort: 443
      toPort: 443
      ipRanges:
        - {"cidrIP":"10.0.0.0/8","description":"HTTPS from the VPC"}
    - ipProtocol: "-1"
      fromPort: 0
      toPort: 65535
      userIDGroupPairs:
        - {}
  egressRules:
    - ipProtocol: "-1"
      ipRanges:
        - {"cidrIP":"0.0.0.0/0"}
---
# Source: opensearch/templates/opensearch.yaml
apiVersion: opensearchservice.services.k8s.aws/v1alpha1
kind: VPCEndpoint
metadata:
  name: vpc-vpc-endpoint-other
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "vpc"
    app.kubernetes.io/name: opensearch
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "vpc-endpoint-other"
    services.k8s.aws/region: "us-east-1"
spec:
  domainRef:
    from:
      name: vpc-domain
  vpcOptions:
    securityGroupIDs:
    - sg-0123456789abcdef0
    subnetIDs:
    - subnet-0123456789abcdef2
