    app.kubernetes.io/version: "0.1.0"
    hfl.dev/team: "shop"
  annotations:
    hfl.dev/id: "log-group-index-slow-logs"
    services.k8s.aws/region: "us-east-1"
spec:
  name: "/aws/opensearch/shop-dev-search/INDEX_SLOW_LOGS"
  retentionDays: 60
  tags:
    team: shop
