---
# Source: opensearch/templates/opensearch.yaml
apiVersion: opensearchservice.services.k8s.aws/v1alpha1
kind: Domain
metadata:
  name: names-domain
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "names"
    app.kubernetes.io/name: opensearch
    app.kubernetes.io/version: "0.1.0"
    hfl.dev/team: "shop"
  annotations:
    hfl.dev/id: "domain"
    services.k8s.aws/region: "us-east-1"
spec:
  advancedSecurityOptions:
    anonymousAuthEnabled: false
    enabled: true
  autoTuneOptions:
    desiredState: ENABLED
  clusterConfig:
    dedicatedMasterCount: 3
    dedicatedMasterEnabled: true
    dedicatedMasterType: c6g.large.search
    instanceCount: 3
    instanceType: r6g.large.search
    zoneAwarenessEnabled: true
  domainEndpointOptions:
    enforceHTTPS: true
    tlsSecurityPolicy: Policy-Min-TLS-1-2-2019-07
  ebsOptions:
    ebsEnabled: true
    volumeSize: 64
    volumeType: gp3
  encryptionAtRestOptions:
    enabled: true
  logPublishingOptions:
    INDEX_SLOW_LOGS:
      cloudWatchLogsLogGroupARN: arn:aws:logs:us-east-1:123456789012:log-group:/aws/opensearch/shop-dev-search/INDEX_SLOW_LOGS
      enabled: true
    SEARCH_SLOW_LOGS:
      cloudWatchLogsLogGroupARN: arn:aws:logs:us-east-1:123456789012:log-group:/aws/opensearch/shop-dev-search/SEARCH_SLOW_LOGS
      enabled: true
  name: shop-dev-search
  nodeToNodeEncryptionOptions:
    enabled: true
  offPeakWindowOptions:
    enabled: true
  softwareUpdateOptions:
    autoSoftwareUpdateEnabled: true
  tags:
  - key: team
    value: shop
  vpcOptions:
    securityGroupRefs:
    - from:
        name: names-sg
    subnetIDs:
    - subnet-1
---
# Source: opensearch/templates/opensearch.yaml
