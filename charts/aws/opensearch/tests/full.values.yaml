region: us-east-1
account_id: "123456789012"
domain_name: catalog-os-full
engine_version: OpenSearch_2.17
ip_address_type: dualstack
deletion_policy: ABANDON
advanced_options:
  rest.action.multi.allow_explicit_index: "true"
advanced_security_options:
  enabled: true
  anonymous_auth_enabled: false
  internal_user_database_enabled: true
  master_user_options:
    master_user_name: admin
    master_user_password_secret_ref: {name: os-master, key: password, namespace: default}
  jwt_options:
    enabled: true
    public_key: "-----BEGIN PUBLIC KEY-----"
    roles_key: roles
    subject_key: sub
aiml_options:
  natural_language_query_generation_options:
    desired_state: ENABLED
auto_tune_options:
  desired_state: ENABLED
  rollback_on_disable: NO_ROLLBACK
  use_off_peak_window: true
cluster_config:
  dedicated_master_enabled: true
  dedicated_master_count: 3
  dedicated_master_type: c6g.large.search
  instance_count: 3
  instance_type: r6g.large.search
  multi_az_with_standby_enabled: true
  warm_enabled: true
  warm_count: 2
  warm_type: ultrawarm1.medium.search
  cold_storage_options: {enabled: true}
  zone_awareness_enabled: true
  zone_awareness_config: {availability_zone_count: 3}
cognito_options:
  enabled: true
  identity_pool_id: us-east-1:00000000-0000-0000-0000-000000000000
  role_arn: arn:aws:iam::123456789012:role/CognitoAccessForAmazonOpenSearch
  user_pool_id: us-east-1_AbCdEfGhI
domain_endpoint_options:
  enforce_https: true
  tls_security_policy: Policy-Min-TLS-1-2-PFS-2023-10
  custom_endpoint_enabled: true
  custom_endpoint: search.example.com
  custom_endpoint_certificate_arn: arn:aws:acm:us-east-1:123456789012:certificate/abc
ebs_options:
  ebs_enabled: true
  volume_size: 100
  volume_type: gp3
  iops: 3000
  throughput: 125
encrypt_at_rest:
  enabled: true
  kms_key_id: arn:aws:kms:us-east-1:123456789012:key/abc
node_to_node_encryption: {enabled: true}
off_peak_window_options:
  enabled: true
  off_peak_window:
    window_start_time: {hours: 2, minutes: 30}
software_update_options: {auto_software_update_enabled: true}
log_publishing_options:
  - log_type: INDEX_SLOW_LOGS
    log_group_retention_in_days: 30
    log_group_tags: {kind: index}
  - log_type: SEARCH_SLOW_LOGS
    log_group_skip_destroy: true
  - log_type: ES_APPLICATION_LOGS
    cloudwatch_log_group_arn: arn:aws:logs:us-east-1:123456789012:log-group:/mine
    log_group_name: /aws/opensearch/mine
  - log_type: AUDIT_LOGS
    enabled: false
    cloudwatch_log_group_arn: arn:aws:logs:us-east-1:123456789012:log-group:/audit
create_cloudwatch_log_resource_policy: false
cloudwatch_log_group_kms_key_id: arn:aws:kms:us-east-1:123456789012:key/def
create_saml_options: true
saml_options:
  enabled: true
  idp: {entity_id: https://idp.example.com, metadata_content: "<EntityDescriptor/>"}
  master_backend_role: admins
  master_user_name: root
  roles_key: roles
  session_timeout_minutes: 120
  subject_key: sub
vpc_id: vpc-0123456789abcdef0
vpc_options:
  subnet_ids: [subnet-0123456789abcdef0, subnet-0123456789abcdef1, subnet-0123456789abcdef2]
security_group_rules:
  https: {cidr_ipv4: 10.0.0.0/8}
access_policy_statements:
  read:
    sid: Read
    effect: Allow
    actions: ["es:ESHttpGet"]
    resource_paths: ["*", "logs/*"]
    principals:
      - {type: AWS, identifiers: ["arn:aws:iam::123456789012:root"]}
    conditions:
      - {test: IpAddress, variable: "aws:SourceIp", values: ["10.0.0.0/8"]}
  all:
    actions: ["es:*"]
    resources: ["arn:aws:es:us-east-1:123456789012:domain/catalog-os-full/*"]
    principals: [{type: "*", identifiers: ["*"]}]
vpc_endpoints:
  b: {subnet_ids: [subnet-0123456789abcdef9]}
tags:
  env: prod
security_group_tags: {team: search}
