# Applied to the fake AWS by hack/mock-apply-aws.sh: a public domain with
# fine-grained access control by an IAM master user, an access policy and
# two log groups. The log resource policy is the account's (no kind makes it).
region: us-east-1
account_id: "000000000000"
domain_name: catalog-os
engine_version: OpenSearch_2.17
create_cloudwatch_log_resource_policy: false
cluster_config:
  instance_count: 1
  instance_type: t3.small.search
  dedicated_master_enabled: false
  zone_awareness_enabled: false
ebs_options:
  ebs_enabled: true
  volume_size: 10
  volume_type: gp3
advanced_security_options:
  enabled: true
  internal_user_database_enabled: false
  master_user_options:
    master_user_arn: arn:aws:iam::000000000000:role/os-admin
access_policy_statements:
  admin:
    effect: Allow
    actions: ["es:*"]
    principals:
      - type: AWS
        identifiers: ["arn:aws:iam::000000000000:role/os-admin"]
tags:
  catalog-test: "true"
