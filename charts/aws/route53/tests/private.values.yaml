# A private zone in two VPCs, with routing policies: failover with health
# checks, geolocation, latency, multivalue and CIDR.
name: internal.example.com
vpc:
  one: {vpc_id: vpc-0123456789abcdef0, vpc_region: eu-west-1}
  two: {vpc_id: vpc-0fedcba9876543210, vpc_region: us-east-1}
records:
  db-primary:
    name: db
    type: A
    ttl: 60
    records: [10.0.0.10]
    set_identifier: primary
    health_check_id: 11111111-2222-3333-4444-555555555555
    failover_routing_policy: {type: PRIMARY}
  db-secondary:
    name: db
    type: A
    ttl: 60
    records: [10.1.0.10]
    set_identifier: secondary
    failover_routing_policy: {type: SECONDARY}
  geo:
    type: A
    ttl: 300
    records: [10.0.0.20]
    set_identifier: europe
    geolocation_routing_policy: {continent: EU}
  latency:
    type: A
    ttl: 300
    records: [10.0.0.30]
    set_identifier: euw1
    latency_routing_policy: {region: eu-west-1}
  multi:
    type: A
    ttl: 300
    records: [10.0.0.40, 10.0.0.41]
    set_identifier: m1
    multivalue_answer_routing_policy: true
  cidr:
    type: A
    ttl: 300
    records: [10.0.0.50]
    set_identifier: c1
    cidr_routing_policy: {collection_id: 9ac77ea5-3d5c-4b2e-9a1f-0a1b2c3d4e5f, location_name: office}
