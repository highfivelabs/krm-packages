#
# The namePrefix convention (docs/design.md, "Names, labels and tags"): no
# kind here has a name that can collide.
exempt:
  HostedZone: "a zone's name is its domain, which Route 53 lets two zones share (each gets its own ID)"
  RecordSet: "a record's name is a name in its zone's domain"
nameFields: {}
noCloudNames: "a zone is named by its domain and a record by a name in it; the chart names nothing"
