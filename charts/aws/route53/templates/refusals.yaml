{{- /*
Copyright 2026 High Five Labs
SPDX-License-Identifier: Apache-2.0

The module variables this chart keeps in its values but cannot carry
(upstream.yaml, "refused"): each stops the render, naming the gap, when it
is set to anything but its Terraform default. Renders nothing.
*/ -}}
{{- $v := .Values -}}
{{- include "ack.unchanged" (list $ "create_zone" $v.create_zone "true" "false looks an existing zone up by name, and a render cannot look anything up: the zone is another component's, and its records belong in that component") }}
{{- include "ack.unsupported" (list $ "ignore_vpc" $v.ignore_vpc "ACK's HostedZone owns the zone's VPC associations (spec.vpcs) and removes ones made elsewhere; leaving them alone after creation has no ACK equivalent") }}
{{- include "ack.unsupported" (list $ "private_zone" $v.private_zone "it is used only to look up an existing zone (create_zone: false); a zone with vpc set is private") }}
{{- include "ack.unsupported" (list $ "vpc_id" $v.vpc_id "it is used only to look up an existing zone (create_zone: false); a private zone's VPCs are vpc") }}
{{- include "ack.unsupported" (list $ "force_destroy" $v.force_destroy "ACK's HostedZone has no field to delete records made elsewhere before the zone") }}
{{- include "ack.unsupported" (list $ "enable_accelerated_recovery" $v.enable_accelerated_recovery "ACK's HostedZone (route53-controller v1.8.0) has no field for Route 53 Accelerated Recovery") }}
{{- include "ack.unsupported" (list $ "timeouts" $v.timeouts "Terraform's create, update and delete timeouts: ACK retries until the zone is synced, and Bundt waits for it") }}
{{- include "ack.unsupported" (list $ "vpc_association_authorizations" $v.vpc_association_authorizations "aws_route53_vpc_association_authorization has no ACK or ack-extensions kind") }}
