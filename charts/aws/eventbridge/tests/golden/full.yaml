apiVersion: eventbridge.services.k8s.aws/v1alpha1
kind: Rule
metadata:
  name: full-rule-orders
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "full"
    app.kubernetes.io/name: eventbridge
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "rule-orders"
    services.k8s.aws/region: "eu-west-1"
spec:
  name: "orders-rule"
  eventBusRef:
    from:
      name: full-bus
  description: "Capture all order data"
  eventPattern: "{\"source\":[\"myapp.orders\"]}"
  state: "ENABLED"
  targets:
    - id: "send-orders-to-sqs"
      arn: "arn:aws:sqs:eu-west-1:111122223333:orders.fifo"
      sqsParameters:
        messageGroupID: "orders"
      deadLetterConfig:
        arn: "arn:aws:sqs:eu-west-1:111122223333:orders-dlq"
      retryPolicy:
        maximumEventAgeInSeconds: 300
        maximumRetryAttempts: 5
    - id: "send-orders-to-kinesis"
      arn: "arn:aws:kinesis:eu-west-1:111122223333:stream/orders"
      roleARN: "arn:aws:iam::111122223333:role/eventbridge/orders"
      kinesisParameters:
        partitionKeyPath: "$.detail.id"
    - id: "log-orders"
      arn: "arn:aws:logs:eu-west-1:111122223333:log-group:/orders"
      inputTransformer:
        inputPathsMap: {"order":"$.detail"}
        inputTemplate: "\"<order>\""
  tags:
    - key: "Name"
      value: "orders-rule"
    - key: "team"
      value: "orders"
