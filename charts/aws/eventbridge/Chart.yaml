apiVersion: v2
name: eventbridge
description: >-
  An EventBridge bus with its rules and targets, archives, permissions, log
  delivery, IAM roles and pipes (and, as alpha kinds, connections, API
  destinations, schedule groups, schedules and a schemas discoverer), as AWS
  Controllers for Kubernetes (ACK) objects. A port of terraform-aws-modules'
  eventbridge module.
type: application
version: 0.1.0
# The module release this chart was ported from (UPSTREAM.md).
appVersion: "terraform-aws-eventbridge-v4.3.3"
kubeVersion: ">=1.27.0-0"
keywords: [aws, ack, eventbridge, pipes, scheduler, terraform-aws-modules]
home: https://github.com/highfivelabs/catalog
