# Outpost subnets with Outpost ARN, CoIP pool, and dedicated network ACL.
name: outpost-vpc
cidr: 10.0.0.0/16
azs: [us-west-2a, us-west-2b]
outpost_az: us-west-2a
outpost_arn: arn:aws:outposts:us-west-2:111122223333:outpost/op-0123456789abcdef0
customer_owned_ipv4_pool: ipv4pool-coip-0123456789abcdef0
outpost_subnets: [10.0.10.0/24, 10.0.11.0/24]
outpost_subnet_names: [outpost-a, outpost-b]
outpost_subnet_suffix: outpost-net
outpost_subnet_tags: {Rack: rack-1}
outpost_subnet_enable_resource_name_dns_a_record_on_launch: true
outpost_subnet_private_dns_hostname_type_on_launch: resource-name
outpost_dedicated_network_acl: true
outpost_inbound_acl_rules:
  - {rule_number: 100, rule_action: allow, from_port: 443, to_port: 443, protocol: "6", cidr_block: 10.0.0.0/16}
outpost_outbound_acl_rules:
  - {rule_number: 100, rule_action: allow, from_port: 0, to_port: 0, protocol: "-1", cidr_block: 0.0.0.0/0}
outpost_acl_tags: {Zone: outpost}
