apiVersion: v2
name: autoscaling
description: >-
  An Amazon EC2 Auto Scaling group with its launch template, IAM role and
  instance profile, lifecycle hooks, traffic sources and, as ack-extensions
  kinds, its scaling policies, scheduled actions and warm pool, as AWS
  Controllers for Kubernetes (ACK) objects. A port of terraform-aws-modules'
  autoscaling module (its root).
type: application
version: 0.1.0
# The module release this chart was ported from (UPSTREAM.md).
appVersion: "terraform-aws-autoscaling-v9.3.2"
kubeVersion: ">=1.27.0-0"
keywords: [aws, ack, autoscaling, ec2, launch-template, terraform-aws-modules]
home: https://github.com/highfivelabs/catalog
