# Source: autoscaling/templates/autoscaling-group.yaml
apiVersion: autoscaling.aws.hfl.dev/v1alpha1
kind: AutoScalingGroup
metadata:
  name: full-autoscaling-group
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "full"
    app.kubernetes.io/name: autoscaling
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "autoscaling-group"
spec:
  name: "workers"
  minSize: 0
  maxSize: 10
  desiredCapacityType: "units"
  vpcZoneIdentifier: "subnet-0123456789abcdef0,subnet-0123456789abcdef1"
  availabilityZoneDistribution:
    capacityDistributionStrategy: balanced-best-effort
  capacityRebalance: true
  defaultCooldown: 300
  defaultInstanceWarmup: 120
  healthCheckGracePeriod: 60
  healthCheckType: "ELB"
  lifecycleHookSpecificationList:
    - lifecycleHookName: "drain"
      lifecycleTransition: "autoscaling:EC2_INSTANCE_TERMINATING"
      defaultResult: "CONTINUE"
      heartbeatTimeout: 300
      notificationMetadata: "{\"drain\": true}"
      notificationTargetARN: "arn:aws:sqs:eu-west-1:111122223333:drain"
      roleARN: "arn:aws:iam::111122223333:role/asg-notify"
  instanceLifecyclePolicy:
    retentionTriggers:
      terminateHookAbandon: retain
  instanceMaintenancePolicy:
    maxHealthyPercentage: 120
    minHealthyPercentage: 90
  mixedInstancesPolicy:
    instancesDistribution:
      onDemandBaseCapacity: 1
      onDemandPercentageAboveBaseCapacity: 25
      spotAllocationStrategy: price-capacity-optimized
    launchTemplate:
      launchTemplateSpecification:
        launchTemplateRef:
          from:
            name: full-launch-template
        version: $Latest
      overrides:
      - instanceType: m6i.large
        weightedCapacity: "2"
      - instanceRequirements:
          baselineEBSBandwidthMbps:
            min: 100
          cpuManufacturers:
          - intel
          - amd
          memoryGiBPerVCPU:
            max: 8
            min: 2
          memoryMiB:
            min: 4096
          networkBandwidthGbps:
            min: 1
          vCPUCount:
            max: 8
            min: 2
        launchTemplateSpecification:
          launchTemplateName: workers-arm
          version: $Default
  maxInstanceLifetime: 604800
  newInstancesProtectedFromScaleIn: true
  placementGroup: "workers-spread"
  serviceLinkedRoleARN: "arn:aws:iam::111122223333:role/aws-service-role/autoscaling.amazonaws.com/AWSServiceRoleForAutoScaling"
  terminationPolicies:
    - OldestLaunchTemplate
    - Default
  trafficSources:
    - identifier: "arn:aws:elasticloadbalancing:eu-west-1:111122223333:targetgroup/web/0123456789abcdef"
      type: "elbv2"
  tags:
    - key: "Name"
      value: "worker"
      propagateAtLaunch: true
    - key: "team"
      value: "data"
      propagateAtLaunch: true
    - key: "tier"
      value: "workers"
      propagateAtLaunch: false
