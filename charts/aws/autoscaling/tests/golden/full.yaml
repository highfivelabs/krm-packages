  permissionsBoundary: "arn:aws:iam::111122223333:policy/boundary"
  policies:
    - "arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore"
  tags:
    - key: "role"
      value: "yes"
    - key: "team"
      value: "data"
