# Source: autoscaling/templates/launch-template.yaml
apiVersion: ec2.aws.hfl.dev/v1alpha1
kind: LaunchTemplate
metadata:
  name: full-launch-template
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "full"
    app.kubernetes.io/name: autoscaling
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "launch-template"
spec:
  name: "workers-lt"
  versionDescription: "Workers"
  defaultVersion: 1
  data:
    blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        deleteOnTermination: true
        encrypted: true
        iops: 3000
        kmsKeyID: arn:aws:kms:eu-west-1:111122223333:key/abc
        throughput: 125
        volumeSize: 50
        volumeType: gp3
    - deviceName: /dev/sdb
      noDevice: ""
    capacityReservationSpecification:
      capacityReservationPreference: open
    cpuOptions:
      coreCount: 1
      threadsPerCore: 2
    creditSpecification:
      cpuCredits: standard
    disableAPITermination: false
    ebsOptimized: true
    iamInstanceProfile:
      name: workers
    imageID: ami-0123456789abcdef0
    instanceInitiatedShutdownBehavior: terminate
    instanceMarketOptions:
      marketType: spot
      spotOptions:
        instanceInterruptionBehavior: terminate
        maxPrice: "0.05"
    instanceType: m6i.large
    keyName: ops
    licenseSpecifications:
    - licenseConfigurationARN: arn:aws:license-manager:eu-west-1:111122223333:license-configuration:lic-0123456789abcdef
    maintenanceOptions:
      autoRecovery: default
    metadataOptions:
      httpEndpoint: enabled
      httpProtocolIPv6: disabled
      httpPutResponseHopLimit: 2
      httpTokens: required
      instanceMetadataTags: enabled
    monitoring:
      enabled: true
    networkInterfaces:
    - associatePublicIPAddress: false
      deleteOnTermination: true
      deviceIndex: 0
      groups:
      - sg-0123456789abcdef0
      - sg-0fedcba9876543210
      ipv4PrefixCount: 1
      ipv6Addresses:
      - ipv6Address: 2001:db8::10
    placement:
      hostResourceGroupARN: arn:aws:resource-groups:eu-west-1:111122223333:group/hosts
      partitionNumber: 1
      tenancy: default
    privateDNSNameOptions:
      enableResourceNameDNSAAAARecord: false
      enableResourceNameDNSARecord: true
      hostnameType: resource-name
    tagSpecifications:
    - resourceType: volume
      tags:
      - key: backup
        value: daily
      - key: team
        value: data
    - resourceType: instance
      tags:
      - key: Name
        value: worker
      - key: role
        value: worker
      - key: team
        value: data
    userData: IyEvYmluL2Jhc2gKZWNobyBoZWxsbwo=
  tags:
    - key: "lt"
      value: "yes"
    - key: "team"
      value: "data"
