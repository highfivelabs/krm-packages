# Source: autoscaling/templates/autoscaling-group.yaml
apiVersion: autoscaling.aws.hfl.dev/v1alpha1
kind: ScalingPolicy
metadata:
  name: full-policy-queue
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "full"
    app.kubernetes.io/name: autoscaling
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "scaling-policy-queue"
spec:
  autoScalingGroupName: "workers"
  policyName: "queue-depth"
  policyType: TargetTrackingScaling
  targetTrackingConfiguration:
    customizedMetricSpecification:
      metrics:
      - id: m1
        metricStat:
          metric:
            dimensions:
            - name: QueueName
              value: work
            metricName: ApproximateNumberOfMessagesVisible
            namespace: AWS/SQS
          stat: Sum
        returnData: false
      - expression: m1 / 10
        id: e1
        returnData: true
    disableScaleIn: true
    targetValue: 100
---
