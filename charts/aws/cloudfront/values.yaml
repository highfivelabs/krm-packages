#
# Values mirror the Terraform variables of terraform-aws-modules' cloudfront
# module (v6.7.1): same names, types and defaults, so a module block's
# arguments become a values file one to one. values.schema.json carries the
# types. A variable the chart cannot carry stays here and stops the render
# when set (upstream.yaml lists them; README.md says why).

names: {}
namePrefix: ""
labels: {}
deletion_policy: DELETE

# The module's variables, in its order, with its defaults.
create: true
tags: {}

aliases: null
anycast_ip_list_id: null
cache_tag_config: null
comment: null
connection_function_association_id: null
continuous_deployment_policy_id: null
custom_error_response: null
default_cache_behavior: {}
default_root_object: null
enabled: true
http_version: "http2"
is_ipv6_enabled: true
logging_config: null
ordered_cache_behavior: []
origin_group: null
origin: {}
price_class: null
restrictions:
  geo_restriction:
    restriction_type: "none"
retain_on_delete: null
staging: null
viewer_certificate: {}
viewer_mtls_config: null
wait_for_deployment: null
web_acl_id: null

origin_access_control:
  s3:
    origin_type: "s3"
    signing_behavior: "always"
    signing_protocol: "sigv4"

vpc_origin: null
cache_policies: null
origin_request_policies: null
response_headers_policies: null
cloudfront_functions: null

create_monitoring_subscription: false
realtime_metrics_subscription_status: "Enabled"

create_connection_function: false
connection_function_code: null
connection_function_config: null
connection_function_name: null
connection_function_publish: null

enable_v2_logging: false
v2_logging: null
