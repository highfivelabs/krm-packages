#
# The Bundt Package for this chart (docs/design.md, "Outputs"): the module's
# outputs from the live FileSystem (resources.file-system), the security
# group (resources.security-group), and the mount targets and access points
# by key (resources.mount-target-<key>, resources.access-point-<key>).
# dns_name is built as the Terraform provider builds it,
# <id>.efs.<region>.<DNS suffix>. size_in_bytes is the metered size's value
# (Terraform's output is the whole size object). mount_targets and
# access_points are the one field consumers take from each, its ID, by key
# (outputs are selective; Terraform's outputs are the whole resources). EC2
# reports no ARN for a group, so security_group_arn is built as the provider
# builds it.
apiVersion: hfl.dev/v1
kind: Package
metadata:
  name: aws-efs
spec:
  version: 0.1.0
  engine: helm
  providers: [ack]
  outputs:
    arn: >-
      'file-system' in resources && has(resources['file-system'].status.ackResourceMetadata)
      && has(resources['file-system'].status.ackResourceMetadata.arn)
      ? dyn(resources['file-system'].status.ackResourceMetadata.arn) : null
    id: >-
      'file-system' in resources && has(resources['file-system'].status.fileSystemID)
      ? dyn(resources['file-system'].status.fileSystemID) : null
    dns_name: >-
      'file-system' in resources && has(resources['file-system'].status.fileSystemID)
      && has(resources['file-system'].status.ackResourceMetadata)
      ? dyn(resources['file-system'].status.fileSystemID + '.efs.'
        + resources['file-system'].status.ackResourceMetadata.region
        + (resources['file-system'].status.ackResourceMetadata.region.startsWith('cn-') ? '.amazonaws.com.cn' : '.amazonaws.com'))
      : null
    size_in_bytes: >-
      'file-system' in resources && has(resources['file-system'].status.sizeInBytes)
      && has(resources['file-system'].status.sizeInBytes.value)
      ? dyn(resources['file-system'].status.sizeInBytes.value) : null
    mount_targets: >-
      resources.filter(k, k.startsWith('mount-target-')).transformMapEntry(i, k, {
        k.substring(13): has(resources[k].status.mountTargetID) ? resources[k].status.mountTargetID : ''})
    security_group_id: >-
      'security-group' in resources && has(resources['security-group'].status.id)
      ? dyn(resources['security-group'].status.id) : null
    security_group_arn: >-
      'security-group' in resources && has(resources['security-group'].status.id)
      ? dyn('arn:'
        + (resources['security-group'].status.ackResourceMetadata.region.startsWith('cn-') ? 'aws-cn'
          : (resources['security-group'].status.ackResourceMetadata.region.startsWith('us-gov-') ? 'aws-us-gov' : 'aws'))
        + ':ec2:' + resources['security-group'].status.ackResourceMetadata.region
        + ':' + resources['security-group'].status.ackResourceMetadata.ownerAccountID
        + ':security-group/' + resources['security-group'].status.id)
      : null
    access_points: >-
      resources.filter(k, k.startsWith('access-point-')).transformMapEntry(i, k, {
        k.substring(13): has(resources[k].status.accessPointID) ? resources[k].status.accessPointID : ''})
    replication_configuration_destination_file_system_id: >-
      'file-system' in resources && has(resources['file-system'].status.replicationConfigurationStatus)
      && size(resources['file-system'].status.replicationConfigurationStatus) > 0
      && has(resources['file-system'].status.replicationConfigurationStatus[0].fileSystemID)
      ? dyn(resources['file-system'].status.replicationConfigurationStatus[0].fileSystemID) : null
