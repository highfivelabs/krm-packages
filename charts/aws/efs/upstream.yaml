synced: 2026-11-16
# Module variables the chart keeps in values.yaml (so tfvars convert one to
# one) but refuses when set (to anything but the module's default), or
# accepts only in part. Read by `task coverage`; `task coverage-verify`
# renders the chart to check that each one is refused. kind: gap (no ACK or
# ack-extensions kind or field), not-ported (ACK has it, the chart does not
# map it yet) or by-design (Bundt replaces it). partial: the variable is
# accepted, the reason says what is not carried.
refused:
- variable: bypass_policy_lockout_safety_check
  kind: alpha
  reason: "ACK's FileSystem (efs-controller v1.8.0) has no bypassPolicyLockoutSafetyCheck field; ack-extensions' FileSystem carries it (needs allow_alpha: true)"
  partial: true
  needs_allow_alpha: true
- variable: creation_token
  kind: alpha
  reason: "ACK's FileSystem (efs-controller v1.8.0) has no creationToken field; ack-extensions' FileSystem carries it (needs allow_alpha: true)"
  partial: true
  needs_allow_alpha: true
- variable: deny_nonsecure_transport
  kind: gap
  reason: "the module's NonSecureTransport statement names the file system's own ARN, which holds the ID AWS assigns and is only in the FileSystem's status, and ACK's FileSystem takes its policy as a string with no reference to it; refused when true (the default) with attach_policy: true"
- variable: deny_nonsecure_transport_via_mount_target
  kind: gap
  reason: "the module's NonSecureTransportAccessedViaMountTarget statement names the file system's own ARN (as deny_nonsecure_transport); refused when true (the default) with attach_policy: true"
- variable: mount_targets
  kind: gap
  reason: "accepted, with ip_address_type and ipv6_address via ack-extensions' MountTarget (needs allow_alpha: true); security_groups is refused with create_security_group: true (ACK's MountTarget cannot take group references and IDs together); region is not used, as in the module"
  partial: true
  fields:
  - ip_address_type
  - ipv6_address
- variable: policy_statements
  kind: gap
  reason: "accepted, but each statement needs resources: the module's default is the file system's own ARN, which is only in the FileSystem's status; conditions is not carried, as the module does not carry it"
  partial: true
  fields:
  - resources
- variable: security_group_egress_rules
  kind: gap
  reason: "accepted, but each rule's name and tags are not carried: ACK keeps a group's rules inline in SecurityGroup, which has no per-rule tags; region is not used, as in the module"
  partial: true
  fields:
  - name
  - tags
- variable: security_group_ingress_rules
  kind: gap
  reason: "accepted, but each rule's name and tags are not carried: ACK keeps a group's rules inline in SecurityGroup, which has no per-rule tags; region is not used, as in the module"
  partial: true
  fields:
  - name
  - tags
- variable: security_group_use_name_prefix
  kind: gap
  reason: "accepted: true names the group as given, without Terraform's random suffix, since a render must not change between plans; the namePrefix value keeps two Instances' groups apart"
  partial: true
- variable: security_group_vpc_id
  kind: gap
  reason: "accepted when set; unset with mount targets and create_security_group: true (Terraform's default VPC) is refused: ACK's SecurityGroup needs its VPC's ID"
  partial: true
