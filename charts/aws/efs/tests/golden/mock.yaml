---
# Source: efs/templates/access-points.yaml
apiVersion: efs.services.k8s.aws/v1alpha1
kind: AccessPoint
metadata:
  name: mock-access-point-app
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "mock"
    app.kubernetes.io/name: efs
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "access-point-app"
    services.k8s.aws/region: "us-east-1"
spec:
  fileSystemRef:
    from:
      name: mock-fs
  posixUser:
    gid: 1000
    uid: 1000
  rootDirectory:
    path: "/app"
    creationInfo:
      ownerGID: 1000
      ownerUID: 1000
      permissions: "755"
  tags:
    - key: "Name"
      value: "app"
    - key: "catalog-test"
      value: "true"
---
# Source: efs/templates/file-system.yaml
apiVersion: efs.services.k8s.aws/v1alpha1
kind: FileSystem
metadata:
  name: mock-fs
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "mock"
    app.kubernetes.io/name: efs
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "file-system"
    services.k8s.aws/region: "us-east-1"
spec:
  encrypted: true
  lifecyclePolicies:
    - transitionToIA: "AFTER_30_DAYS"
  policy: "{\"Statement\":[{\"Action\":[\"elasticfilesystem:ClientMount\"],\"Condition\":{\"Bool\":{\"aws:SecureTransport\":[\"true\"]}},\"Effect\":\"Allow\",\"Principal\":{\"AWS\":[\"*\"]},\"Resource\":[\"*\"],\"Sid\":\"mount\"}],\"Version\":\"2012-10-17\"}"
  backupPolicy:
    status: ENABLED
  tags:
    - key: "Name"
      value: "catalog-efs"
    - key: "catalog-test"
      value: "true"
---
# Source: efs/templates/mount-targets.yaml
apiVersion: efs.services.k8s.aws/v1alpha1
kind: MountTarget
metadata:
  name: mock-mount-target-a
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "mock"
    app.kubernetes.io/name: efs
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "mount-target-a"
    services.k8s.aws/region: "us-east-1"
spec:
  fileSystemRef:
    from:
      name: mock-fs
  subnetID: "subnet-set-by-mock-set-yaml"
  securityGroupRefs:
    - from:
        name: mock-sg
---
# Source: efs/templates/mount-targets.yaml
apiVersion: ec2.services.k8s.aws/v1alpha1
kind: SecurityGroup
metadata:
  name: mock-sg
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "mock"
    app.kubernetes.io/name: efs
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "security-group"
    services.k8s.aws/region: "us-east-1"
spec:
  name: "catalog-efs"
  description: "Managed by Terraform"
  vpcID: "vpc-set-by-mock-set-yaml"
  ingressRules:
    - ipProtocol: "tcp"
      fromPort: 2049
      toPort: 2049
      ipRanges:
        - {"cidrIP":"10.60.0.0/16"}
  tags:
    - key: "Name"
      value: "catalog-efs"
    - key: "catalog-test"
      value: "true"
