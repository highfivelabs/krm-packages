#
# Values mirror the Terraform variables of terraform-aws-modules' efs module
# (v2.2.1): same names, types and defaults, so a module block's arguments
# become a values file one to one. values.schema.json carries the types. A
# variable the chart cannot carry stays here and stops the render when set
# (upstream.yaml lists them; README.md says why).

# Names, labels and tags (docs/design.md, "Names, labels and tags"). Not
# Terraform variables, except tags, which is the module's own.
#
# Names in full: {securityGroup}. A name set here takes no namePrefix.
# Unset, the mount targets' security group is named security_group_name,
# else name. AWS assigns the file system's, mount targets' and access
# points' IDs; their Name tags carry the namePrefix.
names: {}
# An optional convenience: "<namePrefix>-" in front of every name the chart
# gives (never one set under names). Empty (the default) changes nothing.
namePrefix: ""
# Kubernetes labels on every object. They stay in Kubernetes: ACK does not
# copy labels to AWS (AWS tags are the module's tags variable).
labels: {}
# No kind here is outside ACK's released controllers; kept for the common
# values (docs/design.md, "Alpha kinds").
allow_alpha: false
# DELETE (default): deleting the component deletes the file system and
# everything with it. ABANDON keeps them (services.k8s.aws/deletion-policy:
# retain).
deletion_policy: DELETE

# The module's variables, in its order, with its defaults.

# Determines whether resources will be created (affects all resources)
create: true
# The name of the file system (its Name tag)
name: ""
# Region where this resource will be managed. Defaults to the Region set in
# the provider configuration (here: the namespace's or ACK's)
region: null
# A map of tags to add to all resources
tags: {}

# File System

# The AWS Availability Zone in which to create the file system. Used to
# create a file system that uses One Zone storage classes
availability_zone_name: null
# A unique name used as reference when creating the Elastic File System to
# ensure idempotent file system creation. By default generated by Terraform
# Not supported (gap): ACK's FileSystem has no creationToken field; the
# controller sets its own.
creation_token: null
# The file system performance mode: generalPurpose or maxIO
performance_mode: null
# If true, the disk will be encrypted
encrypted: true
# The ARN for the KMS encryption key (encrypted must be true)
kms_key_arn: null
# The throughput, in MiB/s, to provision (throughput_mode provisioned)
provisioned_throughput_in_mibps: null
# Throughput mode: bursting, elastic or provisioned
throughput_mode: null
# A file system lifecycle policy object ({transition_to_ia,
# transition_to_archive, transition_to_primary_storage_class})
lifecycle_policy: {}
# File protection ({replication_overwrite})
protection: null

# File System Policy

# Determines whether a policy is attached to the file system
attach_policy: true
# Whether to bypass the file system policy lockout safety check
# Not supported (gap): ACK's FileSystem takes its policy as a string, with no
# such flag.
bypass_policy_lockout_safety_check: null
# IAM policy documents merged into the policy (unique Sids)
source_policy_documents: []
# IAM policy documents merged into the policy, overriding by Sid
override_policy_documents: []
# A map of IAM policy statements for custom permission usage
# In part: each statement needs resources. The module's default is the file
# system's own ARN, which holds the ID AWS assigns and is only in the
# FileSystem's status (ACK's FileSystem takes its policy as a string).
# conditions is not carried, as the module does not carry it (condition is).
policy_statements: null
# Whether aws:SecureTransport is required when connecting to the file system
# Not supported (gap) when true with attach_policy: the statement's resource
# is the file system's own ARN (above). Set it to false, or attach_policy:
# false.
deny_nonsecure_transport: true
# Whether to add the statement allowing every principal through a mount
# target
# Not supported (gap) when true with attach_policy, as
# deny_nonsecure_transport.
deny_nonsecure_transport_via_mount_target: true

# Mount Target(s)

# A map of mount target definitions ({subnet_id, ip_address,
# ip_address_type, ipv6_address, region, security_groups})
# In part: ip_address_type and ipv6_address are refused (ACK's MountTarget
# has no field); region is not used, as in the module (the mount target is
# in the chart's region).
mount_targets: {}

# Security Group

# Determines whether a security group is created (only with mount targets)
create_security_group: true
# Name to assign to the security group (else name)
security_group_name: null
# Security group description. Defaults to Managed by Terraform
security_group_description: null
# Whether security_group_name is used as a prefix
# In part: true names the group as given, without Terraform's random suffix.
security_group_use_name_prefix: false
# The VPC ID where the security group will be created (required with it)
security_group_vpc_id: null
# Map of ingress rules for the security group created
# In part: each rule's name and tags are not carried (ACK keeps the rules
# inline in SecurityGroup, with no per-rule tags); region is not used.
security_group_ingress_rules: {}
# Map of egress rules for the security group created
# In part: as security_group_ingress_rules.
security_group_egress_rules: {}

# Access Point(s)

# A map of access point definitions ({name, tags, posix_user,
# root_directory})
access_points: {}

# Backup Policy

# Determines whether a backup policy is created
create_backup_policy: true
# Determines whether the backup policy is ENABLED or DISABLED
enable_backup_policy: true

# Replication Configuration

# Determines whether a replication configuration is created
create_replication_configuration: false
# The destination ({availability_zone_name, file_system_id, kms_key_id,
# region})
replication_configuration_destination: null
