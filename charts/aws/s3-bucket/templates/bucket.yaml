{{- /*
Copyright 2026 High Five Labs
SPDX-License-Identifier: Apache-2.0

main.tf: the bucket (aws_s3_bucket) and the configurations ACK keeps
inline in s3/Bucket: ownership controls, public access block, canned ACL,
versioning, server-side encryption, CORS, logging, website, acceleration,
request payment, object lock, and the bucket policy (aws_s3_bucket_policy,
from the module's combined policy document). What is not ported is
refused (refusals.yaml).
*/ -}}
{{- include "ack.names" (list $ (list "bucket")) -}}
{{- $v := .Values -}}
{{- if and $v.create_bucket $v.putin_khuylo }}
{{- $set := index ($v.names | default dict) "bucket" }}
{{- if and (not $v.bucket) (not $set) }}
{{- fail "s3-bucket: bucket is required: the module would name it with a random suffix, which would change between renders (or set names.bucket)" }}
{{- end }}
{{- $name := include "ack.resourceName" (list $ "bucket" "bucket" ($v.bucket | default "") 63) }}
{{- $arn := printf "arn:%s:s3:::%s" $v.partition $name }}
{{- $st := include "s3.policyStatements" (list $ $name $arn) | fromJsonArray }}
---
apiVersion: s3.services.k8s.aws/v1alpha1
kind: Bucket
metadata:
{{- include "ack.metadata" (dict "root" $ "name" (include "ack.name" (list .Release.Name "bucket")) "id" "bucket" "region" $v.region) | nindent 2 }}
spec:
  name: {{ $name | quote }}
{{- if and $v.region (ne $v.region "us-east-1") }}
  {{- /* us-east-1 takes no location constraint, as the Terraform provider sends none */}}
  createBucketConfiguration:
    locationConstraint: {{ $v.region | quote }}
{{- end }}
{{- if $v.object_lock_enabled }}
  objectLockEnabledForBucket: true
{{- end }}
{{- if $v.control_object_ownership }}
  ownershipControls:
    rules:
      - objectOwnership: {{ $v.object_ownership | quote }}
{{- end }}
{{- if $v.attach_public_policy }}
  publicAccessBlock:
    blockPublicACLs: {{ $v.block_public_acls }}
    blockPublicPolicy: {{ $v.block_public_policy }}
    ignorePublicACLs: {{ $v.ignore_public_acls }}
    restrictPublicBuckets: {{ $v.restrict_public_buckets }}
{{- end }}
{{- if and $v.acl (ne $v.acl "null") }}
  acl: {{ $v.acl | quote }}
{{- end }}
{{- with $v.versioning }}
{{- $s := "Enabled" }}
{{- if hasKey . "enabled" }}{{ $s = ternary "Enabled" "Suspended" (eq (toString .enabled) "true") }}
{{- else if hasKey . "status" }}
{{- $raw := toString .status }}
{{- if eq $raw "true" }}{{ $s = "Enabled" }}{{ else if eq $raw "false" }}{{ $s = "Suspended" }}{{ else }}{{ $s = title (lower $raw) }}{{ end }}
{{- end }}
{{- if or (hasKey . "mfa") (hasKey . "mfa_delete") }}
{{- fail "s3-bucket: versioning.mfa and versioning.mfa_delete are not supported: Bucket.versioning has only status (docs/aws.md)" }}
{{- end }}
  versioning:
    status: {{ $s | quote }}
{{- end }}
{{- with ($v.server_side_encryption_configuration | default dict).rule }}
{{- if .blocked_encryption_types }}
{{- fail "s3-bucket: server_side_encryption_configuration.rule.blocked_encryption_types is not supported: ACK's encryption rule has no such field (docs/aws.md)" }}
{{- end }}
  encryption:
    rules:
      - {{- if not (kindIs "invalid" .bucket_key_enabled) }}
        bucketKeyEnabled: {{ .bucket_key_enabled }}
        {{- end }}
        {{- with .apply_server_side_encryption_by_default }}
        applyServerSideEncryptionByDefault:
          sseAlgorithm: {{ .sse_algorithm | quote }}
          {{- with .kms_master_key_id }}
          kmsMasterKeyID: {{ . | quote }}
          {{- end }}
        {{- end }}
{{- end }}
{{- with $v.cors_rule }}
  cors:
    corsRules:
{{- range $r := . }}
      - allowedMethods: {{ toJson $r.allowed_methods }}
        allowedOrigins: {{ toJson $r.allowed_origins }}
{{- with $r.allowed_headers }}
        allowedHeaders: {{ toJson . }}
{{- end }}
{{- with $r.expose_headers }}
        exposeHeaders: {{ toJson . }}
{{- end }}
{{- if not (kindIs "invalid" $r.max_age_seconds) }}
        maxAgeSeconds: {{ int64 $r.max_age_seconds }}
{{- end }}
{{- with $r.id }}
        id: {{ . | quote }}
{{- end }}
{{- end }}
{{- end }}
{{- with $v.logging }}
  logging:
    loggingEnabled:
      targetBucket: {{ .target_bucket | quote }}
      targetPrefix: {{ .target_prefix | default "" | quote }}
{{- with .target_object_key_format }}
{{- with .partitioned_prefix }}
      targetObjectKeyFormat:
        partitionedPrefix:
{{- with .partition_date_source }}
          partitionDateSource: {{ . | quote }}
{{- else }}
          {}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- $w := $v.website | default dict }}
{{- if or $w.index_document $w.error_document $w.redirect_all_requests_to $w.routing_rules }}
  website:
{{- with $w.index_document }}
    indexDocument: {suffix: {{ . | quote }}}
{{- end }}
{{- with $w.error_document }}
    errorDocument: {key: {{ . | quote }}}
{{- end }}
{{- with $w.redirect_all_requests_to }}
    redirectAllRequestsTo:
      hostName: {{ .host_name | quote }}
{{- with .protocol }}
      protocol: {{ . | quote }}
{{- end }}
{{- end }}
{{- with $w.routing_rules }}
    routingRules:
{{- range $r := . }}
{{- $o := dict "redirect" dict }}
{{- with $r.condition }}
{{- $c := dict }}
{{- with .http_error_code_returned_equals }}{{ $_ := set $c "httpErrorCodeReturnedEquals" (toString .) }}{{ end }}
{{- with .key_prefix_equals }}{{ $_ := set $c "keyPrefixEquals" . }}{{ end }}
{{- $_ := set $o "condition" $c }}
{{- end }}
{{- with $r.redirect }}
{{- range $k, $f := dict "host_name" "hostName" "http_redirect_code" "httpRedirectCode" "protocol" "protocol" "replace_key_prefix_with" "replaceKeyPrefixWith" "replace_key_with" "replaceKeyWith" }}
{{- with index $r.redirect $k }}{{ $_ := set $o.redirect $f (toString .) }}{{ end }}
{{- end }}
{{- end }}
      - {{ toJson $o }}
{{- end }}
{{- end }}
{{- end }}
{{- with $v.acceleration_status }}
  accelerate:
    status: {{ title (lower .) | quote }}
{{- end }}
{{- with $v.request_payer }}
  requestPayment:
    payer: {{ ternary "Requester" "BucketOwner" (eq (lower .) "requester") | quote }}
{{- end }}
{{- $lock := ($v.object_lock_configuration | default dict) }}
{{- if and $v.object_lock_enabled $lock.rule }}
{{- with $lock.rule.default_retention }}
  objectLockConfiguration:
    rule:
      defaultRetention:
        mode: {{ .mode | quote }}
{{- if not (kindIs "invalid" .days) }}
        days: {{ int64 .days }}
{{- end }}
{{- if not (kindIs "invalid" .years) }}
        years: {{ int64 .years }}
{{- end }}
{{- end }}
{{- end }}
{{- if $st }}
  policy: {{ toJson (dict "Version" "2012-10-17" "Statement" $st) | quote }}
{{- end }}
{{- with $v.lifecycle_rule }}
  lifecycle:
    rules:
{{- range $r := . }}
{{- $status := "Enabled" }}
{{- if not (kindIs "invalid" $r.enabled) }}{{ $status = include "s3.status" $r.enabled }}
{{- else if not (kindIs "invalid" $r.status) }}{{ $status = include "s3.status" $r.status }}{{ end }}
      - status: {{ $status | quote }}
{{- with $r.id }}
        id: {{ . | quote }}
{{- end }}
{{- with $r.prefix }}
        prefix: {{ . | quote }}
{{- end }}
{{- with $r.filter }}
{{- $f := include "s3.filter" . | fromJson }}
{{- if $f }}
        filter: {{ toJson $f }}
{{- end }}
{{- end }}
{{- if not (kindIs "invalid" $r.abort_incomplete_multipart_upload_days) }}
        abortIncompleteMultipartUpload:
          daysAfterInitiation: {{ int64 $r.abort_incomplete_multipart_upload_days }}
{{- end }}
{{- with $r.expiration }}
        expiration:
{{- with .date }}
          date: {{ . | quote }}
{{- end }}
{{- if not (kindIs "invalid" .days) }}
          days: {{ int64 .days }}
{{- end }}
{{- if not (kindIs "invalid" .expired_object_delete_marker) }}
          expiredObjectDeleteMarker: {{ .expired_object_delete_marker }}
{{- end }}
{{- end }}
{{- with $r.transition }}
        transitions:
{{- range $t := . }}
          - storageClass: {{ $t.storage_class | quote }}
{{- with $t.date }}
            date: {{ . | quote }}
{{- end }}
{{- if not (kindIs "invalid" $t.days) }}
            days: {{ int64 $t.days }}
{{- end }}
{{- end }}
{{- end }}
{{- with $r.noncurrent_version_expiration }}
        noncurrentVersionExpiration:
{{- if not (kindIs "invalid" .newer_noncurrent_versions) }}
          newerNoncurrentVersions: {{ int64 .newer_noncurrent_versions }}
{{- end }}
{{- $days := ternary .days .noncurrent_days (not (kindIs "invalid" .days)) }}
{{- if not (kindIs "invalid" $days) }}
          noncurrentDays: {{ int64 $days }}
{{- end }}
{{- end }}
{{- with $r.noncurrent_version_transition }}
        noncurrentVersionTransitions:
{{- range $t := . }}
          - storageClass: {{ $t.storage_class | quote }}
{{- if not (kindIs "invalid" $t.newer_noncurrent_versions) }}
            newerNoncurrentVersions: {{ int64 $t.newer_noncurrent_versions }}
{{- end }}
{{- $days := ternary $t.days $t.noncurrent_days (not (kindIs "invalid" $t.days)) }}
{{- if not (kindIs "invalid" $days) }}
            noncurrentDays: {{ int64 $days }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- with $v.intelligent_tiering }}
  intelligentTiering:
{{- range $k := keys . | sortAlpha }}
{{- $it := index $v.intelligent_tiering $k }}
    - id: {{ $k | quote }}
{{- if not (kindIs "invalid" $it.status) }}
      status: {{ include "s3.status" $it.status | quote }}
{{- end }}
{{- with $it.filter }}
{{- $f := include "s3.filter" . | fromJson }}
{{- if $f }}
      filter: {{ toJson $f }}
{{- end }}
{{- end }}
{{- with $it.tiering }}
      tierings:
{{- range $tk := keys . | sortAlpha }}
{{- $tv := index $it.tiering $tk }}
        - accessTier: {{ $tk | quote }}
          days: {{ int64 $tv.days }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- with $v.metric_configuration }}
  metrics:
{{- range $m := . }}
    - id: {{ $m.name | quote }}
{{- with $m.filter }}
{{- $f := include "s3.filter" . | fromJson }}
{{- if $f }}
      filter: {{ toJson $f }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- with $v.inventory_configuration }}
  inventory:
{{- range $k := keys . | sortAlpha }}
{{- $inv := index $v.inventory_configuration $k }}
    - id: {{ $k | quote }}
      includedObjectVersions: {{ $inv.included_object_versions | quote }}
      isEnabled: {{ $inv.enabled }}
{{- with $inv.optional_fields }}
      optionalFields: {{ toJson . }}
{{- end }}
      schedule:
        frequency: {{ $inv.frequency | quote }}
{{- with $inv.filter }}
      filter:
        prefix: {{ .prefix | quote }}
{{- end }}
{{- with $inv.destination }}
      destination:
        s3BucketDestination:
          bucket: {{ .bucket_arn | default $arn | quote }}
          format: {{ .format | quote }}
{{- with .account_id }}
          accountID: {{ toString . | quote }}
{{- end }}
{{- with .prefix }}
          prefix: {{ . | quote }}
{{- end }}
{{- with .encryption }}
{{- if eq .encryption_type "sse_kms" }}
          encryption:
            sseKMS:
              keyID: {{ .kms_key_id | quote }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- with $v.analytics_configuration }}
  analytics:
{{- range $k := keys . | sortAlpha }}
{{- $ac := index $v.analytics_configuration $k }}
    - id: {{ $k | quote }}
{{- with $ac.filter }}
{{- $f := include "s3.filter" . | fromJson }}
{{- if $f }}
      filter: {{ toJson $f }}
{{- end }}
{{- end }}
{{- with $ac.storage_class_analysis }}
      storageClassAnalysis:
        dataExport:
          outputSchemaVersion: {{ .output_schema_version | quote }}
          destination:
            s3BucketDestination:
              bucket: {{ .destination_bucket_arn | default $arn | quote }}
{{- $acct := .destination_account_id | default $v.account_id }}
{{- if not $acct }}
{{- fail (printf "s3-bucket: analytics_configuration.%s needs destination_account_id or account_id" $k) }}
{{- end }}
              bucketAccountID: {{ toString $acct | quote }}
              format: {{ .export_format | default "CSV" | quote }}
{{- with .export_prefix }}
              prefix: {{ . | quote }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- $rep := $v.replication_configuration | default dict }}
{{- $repRules := $rep.rule | default $rep.rules | default list }}
{{- if $repRules }}
  replication:
    role: {{ $rep.role | quote }}
    rules:
{{- range $r := $repRules }}
{{- $status := ternary "Enabled" (include "s3.status" $r.status) (kindIs "invalid" $r.status) }}
      - status: {{ $status | quote }}
{{- with $r.id }}
        id: {{ . | quote }}
{{- end }}
{{- if not (kindIs "invalid" $r.priority) }}
        priority: {{ int64 $r.priority }}
{{- end }}
{{- with $r.prefix }}
        prefix: {{ . | quote }}
{{- end }}
{{- with $r.filter }}
{{- $f := include "s3.filter" . | fromJson }}
{{- if $f }}
        filter: {{ toJson $f }}
{{- end }}
{{- end }}
{{- $dmr := ternary $r.delete_marker_replication_status $r.delete_marker_replication (not (kindIs "invalid" $r.delete_marker_replication_status)) }}
{{- if not (kindIs "invalid" $dmr) }}
        deleteMarkerReplication:
          status: {{ include "s3.status" $dmr | quote }}
{{- end }}
{{- $eor := ternary $r.existing_object_replication_status $r.existing_object_replication (not (kindIs "invalid" $r.existing_object_replication_status)) }}
{{- if not (kindIs "invalid" $eor) }}
        existingObjectReplication:
          status: {{ include "s3.status" $eor | quote }}
{{- end }}
{{- with $r.destination }}
        destination:
          bucket: {{ .bucket | quote }}
{{- with .storage_class }}
          storageClass: {{ . | quote }}
{{- end }}
{{- $acct := .account_id | default .account }}
{{- with $acct }}
          account: {{ toString . | quote }}
{{- end }}
{{- with .access_control_translation }}
          accessControlTranslation:
            owner: {{ title (lower .owner) | quote }}
{{- end }}
{{- $kms := ((.encryption_configuration | default dict).replica_kms_key_id) | default .replica_kms_key_id }}
{{- with $kms }}
          encryptionConfiguration:
            replicaKMSKeyID: {{ . | quote }}
{{- end }}
{{- with .replication_time }}
          replicationTime:
            status: {{ ternary "Disabled" (include "s3.status" .status) (kindIs "invalid" .status) | quote }}
{{- if not (kindIs "invalid" .minutes) }}
            time:
              minutes: {{ int64 .minutes }}
{{- end }}
{{- end }}
{{- with .metrics }}
          metrics:
            status: {{ ternary "Disabled" (include "s3.status" .status) (kindIs "invalid" .status) | quote }}
{{- if not (kindIs "invalid" .minutes) }}
            eventThreshold:
              minutes: {{ int64 .minutes }}
{{- end }}
{{- end }}
{{- end }}
{{- with $r.source_selection_criteria }}
        sourceSelectionCriteria:
{{- with .replica_modifications }}
{{- $rm := ternary .enabled .status (not (kindIs "invalid" .enabled)) }}
          replicaModifications:
            status: {{ ternary "Disabled" (include "s3.status" $rm) (kindIs "invalid" $rm) | quote }}
{{- end }}
{{- with .sse_kms_encrypted_objects }}
{{- $sk := ternary .enabled .status (not (kindIs "invalid" .enabled)) }}
          sseKMSEncryptedObjects:
            status: {{ ternary "Disabled" (include "s3.status" $sk) (kindIs "invalid" $sk) | quote }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- with include "ack.tags" (list $ $v.tags) | fromJson }}
  tagging:
    tagSet:
{{- include "ack.tagList" (list .) | nindent 6 }}
{{- end }}
{{- end }}
