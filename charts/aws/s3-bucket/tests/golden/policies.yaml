apiVersion: s3.services.k8s.aws/v1alpha1
kind: Bucket
metadata:
  name: policies-bucket
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "policies"
    app.kubernetes.io/name: s3-bucket
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "bucket"
    services.k8s.aws/region: "us-west-2"
spec:
  name: "my-app-logs-bucket"
  createBucketConfiguration:
    locationConstraint: "us-west-2"
  publicAccessBlock:
    blockPublicACLs: true
    blockPublicPolicy: true
    ignorePublicACLs: true
    restrictPublicBuckets: true
  encryption:
    rules:
      -
        applyServerSideEncryptionByDefault:
          sseAlgorithm: "aws:kms"
          kmsMasterKeyID: "arn:aws:kms:us-west-2:111122223333:key/1234"
