l\":{\"Service\":\"delivery.logs.amazonaws.com\"},\"Resource\":[\"arn:aws:s3:::my-app-logs-bucket/AWSLogs/111122223333/*\"],\"Sid\":\"WafLogDeliveryWrite\"},{\"Action\":[\"s3:GetBucketAcl\"],\"Condition\":{\"ArnLike\":{\"aws:SourceArn\":\"arn:aws:logs:*:111122223333:*\"},\"StringEquals\":{\"aws:SourceAccount\":\"111122223333\"}},\"Effect\":\"Allow\",\"Principal\":{\"Service\":\"delivery.logs.amazonaws.com\"},\"Resource\":[\"arn:aws:s3:::my-app-logs-bucket\"],\"Sid\":\"WafLogDeliveryAclCheck\"},{\"Action\":[\"s3:GetBucketAcl\"],\"Effect\":\"Allow\",\"Principal\":{\"Service\":\"cloudtrail.amazonaws.com\"},\"Resource\":[\"arn:aws:s3:::my-app-logs-bucket\"],\"Sid\":\"AWSCloudTrailAclCheck\"},{\"Action\":[\"s3:PutObject\"],\"Condition\":{\"StringEquals\":{\"s3:x-amz-acl\":\"bucket-owner-full-control\"}},\"Effect\":\"Allow\",\"Principal\":{\"Service\":\"cloudtrail.amazonaws.com\"},\"Resource\":[\"arn:aws:s3:::my-app-logs-bucket/AWSLogs/*\"],\"Sid\":\"AWSCloudTrailWrite\"},{\"Action\":[\"s3:PutObject\"],\"Condition\":{\"ArnLike\":{\"aws:SourceArn\":[\"arn:aws:s3:::my-app-logs-bucket\",\"arn:aws:s3:::analytics-source\"]},\"StringEquals\":{\"aws:SourceAccount\":[\"111122223333\",\"444455556666\"],\"s3:x-amz-acl\":\"bucket-owner-full-control\"}},\"Effect\":\"Allow\",\"Principal\":{\"Service\":\"s3.amazonaws.com\"},\"Resource\":[\"arn:aws:s3:::my-app-logs-bucket/*\"],\"Sid\":\"destinationInventoryAndAnalyticsPolicy\"},{\"Action\":[\"s3:PutObject\"],\"Condition\":{\"StringNotEquals\":{\"s3:x-amz-server-side-encryption\":[\"aws:kms\"]}},\"Effect\":\"Deny\",\"Principal\":\"*\",\"Resource\":[\"arn:aws:s3:::my-app-logs-bucket/*\"],\"Sid\":\"denyIncorrectEncryptionHeaders\"},{\"Action\":[\"s3:PutObject\"],\"Condition\":{\"StringNotEquals\":{\"s3:x-amz-server-side-encryption-aws-kms-key-id\":[\"arn:aws:kms:us-west-2:111122223333:key/1234\"]}},\"Effect\":\"Deny\",\"Principal\":\"*\",\"Resource\":[\"arn:aws:s3:::my-app-logs-bucket/*\"],\"Sid\":\"denyIncorrectKmsKeySse\"},{\"Action\":[\