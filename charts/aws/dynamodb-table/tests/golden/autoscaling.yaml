# Source: dynamodb-table/templates/table.yaml
apiVersion: dynamodb.services.k8s.aws/v1alpha1
kind: Table
metadata:
  name: autoscaling-table
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "autoscaling"
    app.kubernetes.io/name: dynamodb-table
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "table"
    services.k8s.aws/region: "us-east-1"
spec:
  tableName: "autoscaled-table"
  billingMode: "PROVISIONED"
  attributeDefinitions:
    - attributeName: "id"
      attributeType: "S"
    - attributeName: "gk"
      attributeType: "S"
  keySchema:
    - attributeName: "id"
      keyType: HASH
  provisionedThroughput:
    readCapacityUnits: 5
    writeCapacityUnits: 5
  globalSecondaryIndexes:
    - indexName: "ByG"
      keySchema:
        - attributeName: "gk"
          keyType: HASH
      projection:
        projectionType: "ALL"
      provisionedThroughput:
        readCapacityUnits: 5
        writeCapacityUnits: 5
  tags:
    - key: "Name"
      value: "autoscaled-table"
