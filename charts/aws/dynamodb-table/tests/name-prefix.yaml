#
# The namePrefix convention (docs/design.md, "Names, labels and tags"): the
# table's name, unique in its account and region, carries the namePrefix.
# Its name is spec.tableName.
exempt:
  ScalableTarget: "a scalable target is named by its table (resourceID table/<table>), which carries the namePrefix"
  ScalingPolicy: "a scaling policy's name is unique only within its scalable target"
nameFields:
  Table: tableName
