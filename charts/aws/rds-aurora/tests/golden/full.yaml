apiVersion: rds.services.k8s.aws/v1alpha1
kind: DBCluster
metadata:
  name: full-cluster
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "full"
    app.kubernetes.io/name: rds-aurora
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "cluster"
    services.k8s.aws/region: "eu-west-1"
    rds.services.k8s.aws/delete-automated-backups: "false"
    rds.services.k8s.aws/final-db-snapshot-identifier: "orders-final"
    rds.services.k8s.aws/skip-final-snapshot: "false"
spec:
  dbClusterIdentifier: "orders"
  engine: "aurora-mysql"
  backtrackWindow: 3600
  engineMode: "provisioned"
  engineVersion: "8.0.mysql_aurora.3.08.0"
  availabilityZones:
    - "eu-west-1a"
    - "eu-west-1b"
    - "eu-west-1c"
  backupRetentionPeriod: 7
  copyTagsToSnapshot: true
  databaseInsightsMode: "standard"
  databaseName: "orders"
  dbClusterParameterGroupRef:
    from:
      name: full-cluster-parameter-group
  dbSubnetGroupRef:
    from:
      name: full-subnet-group
  deletionProtection: true
  enableCloudwatchLogsExports:
    - "audit"
    - "error"
    - "slowquery"
  enableIAMDatabaseAuthentication: true
  enablePerformanceInsights: true
  performanceInsightsRetentionPeriod: 7
  kmsKeyID: "arn:aws:kms:eu-west-1:111122223333:key/1234abcd-12ab-34cd-56ef-1234567890ab"
  masterUserPassword:
    name: "orders-db"
    key: "password"
  masterUsername: "admin"
  monitoringInterval: 60
  monitoringRoleRef:
    from:
      name: full-monitoring-role
  networkType: "IPV4"
  port: 3307
  preferredBackupWindow: "02:00-03:00"
  preferredMaintenanceWindow: "sun:05:00-sun:06:00"
  serverlessV2ScalingConfiguration:
    maxCapacity: 4
    minCapacity: 0.5
    secondsUntilAutoPause: 3600
  storageEncrypted: true
  vpcSecurityGroupRefs:
    - from:
        name: full-sg
  tags:
    - key: "schedule"
      value: "office-hours"
    - key: "team"
      value: "orders"
