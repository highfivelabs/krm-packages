# Source: rds-aurora/templates/monitoring.yaml
apiVersion: applicationautoscaling.services.k8s.aws/v1alpha1
kind: ScalingPolicy
metadata:
  name: mock-autoscaling-policy
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "mock"
    app.kubernetes.io/name: rds-aurora
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "autoscaling-policy"
    services.k8s.aws/region: "us-east-1"
spec:
  policyName: "target-metric"
  policyType: TargetTrackingScaling
  serviceNamespace: rds
  scalableDimension: rds:cluster:ReadReplicaCount
  resourceRef:
    from:
      name: mock-autoscaling-target
  targetTrackingScalingPolicyConfiguration:
    predefinedMetricSpecification:
      predefinedMetricType: "RDSReaderAverageCPUUtilization"
    scaleInCooldown: 300
    scaleOutCooldown: 300
    targetValue: 70
---
# Source: rds-aurora/templates/security-group.yaml
apiVersion: ec2.services.k8s.aws/v1alpha1
kind: SecurityGroup
metadata:
  name: mock-sg
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "mock"
    app.kubernetes.io/name: rds-aurora
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "security-group"
    services.k8s.aws/region: "us-east-1"
spec:
  name: "catalog-aurora"
  description: "Control traffic to/from RDS Aurora catalog-aurora"
  vpcID: "vpc-set-by-mock-set-yaml"
  ingressRules:
    - ipProtocol: "tcp"
      fromPort: 5432
      toPort: 5432
      ipRanges:
        - {"cidrIP":"10.60.0.0/16"}
  tags:
    - key: "Name"
      value: "catalog-aurora"
    - key: "catalog-test"
      value: "true"
