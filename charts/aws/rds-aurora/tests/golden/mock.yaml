---
# Source: rds-aurora/templates/cluster.yaml
apiVersion: rds.services.k8s.aws/v1alpha1
kind: DBCluster
metadata:
  name: mock-cluster
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "mock"
    app.kubernetes.io/name: rds-aurora
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "cluster"
    services.k8s.aws/region: "us-east-1"
    rds.services.k8s.aws/skip-final-snapshot: "true"
spec:
  dbClusterIdentifier: "catalog-aurora"
  engine: "aurora-postgresql"
  engineMode: "provisioned"
  engineVersion: "16.4"
  copyTagsToSnapshot: true
  databaseName: "catalog"
  dbClusterParameterGroupRef:
    from:
      name: mock-cluster-parameter-group
  dbSubnetGroupRef:
    from:
      name: mock-subnet-group
  enableCloudwatchLogsExports:
    - "postgresql"
  manageMasterUserPassword: true
  masterUsername: "catalog"
  monitoringInterval: 0
  port: 5432
  storageEncrypted: true
  vpcSecurityGroupRefs:
    - from:
        name: mock-sg
  tags:
    - key: "catalog-test"
      value: "true"
