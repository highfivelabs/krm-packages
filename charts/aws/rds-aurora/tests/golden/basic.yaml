  annotations:
    hfl.dev/id: "security-group"
spec:
  name: "test-aurora-db-postgres96"
  description: "Control traffic to/from RDS Aurora test-aurora-db-postgres96"
  vpcID: "vpc-12345678"
  ingressRules:
    - ipProtocol: "tcp"
      fromPort: 5432
      toPort: 5432
      userIDGroupPairs:
        - {"groupID":"sg-12345678"}
  tags:
