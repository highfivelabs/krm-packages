---
# Source: rds-aurora/templates/monitoring.yaml
apiVersion: iam.services.k8s.aws/v1alpha1
kind: Role
metadata:
  name: basic-monitoring-role
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "basic"
    app.kubernetes.io/name: rds-aurora
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "enhanced-monitoring-role"
spec:
  name: "test-aurora-db-postgres96-monitor"
  assumeRolePolicyDocument: "{\"Statement\":[{\"Action\":[\"sts:AssumeRole\"],\"Effect\":\"Allow\",\"Principal\":{\"Service\":[\"monitoring.rds.amazonaws.com\"]}}],\"Version\":\"2012-10-17\"}"
  policies:
    - "arn:aws:iam::aws:policy/service-role/AmazonRDSEnhancedMonitoringRole"
  tags:
    - key: "Environment"
      value: "dev"
    - key: "Terraform"
      value: "true"
---
# Source: rds-aurora/templates/cluster.yaml
apiVersion: rds.services.k8s.aws/v1alpha1
kind: DBCluster
metadata:
  name: basic-cluster
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "basic"
    app.kubernetes.io/name: rds-aurora
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "cluster"
    rds.services.k8s.aws/final-db-snapshot-identifier: "test-aurora-db-postgres96-final"
    rds.services.k8s.aws/skip-final-snapshot: "false"
spec:
  dbClusterIdentifier: "test-aurora-db-postgres96"
  engine: "aurora-postgresql"
  engineMode: "provisioned"
  engineVersion: "17.5"
  copyTagsToSnapshot: true
  dbSubnetGroupName: "db-subnet-group"
  enableCloudwatchLogsExports:
    - "postgresql"
  manageMasterUserPassword: true
  monitoringInterval: 10
  monitoringRoleRef:
    from:
      name: basic-monitoring-role
  port: 5432
  storageEncrypted: true
  vpcSecurityGroupRefs:
    - from:
        name: basic-sg
  tags:
    - key: "Environment"
      value: "dev"
    - key: "Terraform"
      value: "true"
