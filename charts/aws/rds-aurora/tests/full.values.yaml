# Most of what the chart carries: Aurora MySQL with its own subnet group,
# both parameter groups, Serverless v2 and a provisioned instance, an extra
# endpoint, read replica autoscaling on connections, log groups, enhanced
# monitoring, Performance Insights, a role association (alpha), ingress and
# egress rules (self, a prefix list, IPv6) and the master password from a
# Kubernetes Secret.
allow_alpha: true
name: orders
region: eu-west-1
engine: aurora-mysql
engine_version: 8.0.mysql_aurora.3.08.0
engine_mode: provisioned
master_username: admin
manage_master_user_password: false
master_password_wo: {secretName: orders-db, key: password}
database_name: orders
port: "3307"
backtrack_window: 3600
backup_retention_period: 7
preferred_backup_window: "02:00-03:00"
preferred_maintenance_window: sun:05:00-sun:06:00
deletion_protection: true
skip_final_snapshot: false
final_snapshot_identifier: orders-final
delete_automated_backups: false
iam_database_authentication_enabled: true
kms_key_id: arn:aws:kms:eu-west-1:111122223333:key/1234abcd-12ab-34cd-56ef-1234567890ab
availability_zones: [eu-west-1a, eu-west-1b, eu-west-1c]
network_type: IPV4
cluster_performance_insights_enabled: true
cluster_performance_insights_retention_period: 7
database_insights_mode: standard
serverlessv2_scaling_configuration: {min_capacity: 0.5, max_capacity: 4, seconds_until_auto_pause: 3600}
create_db_subnet_group: true
subnets: [subnet-0123456789abcdef0, subnet-0123456789abcdef1]
vpc_id: vpc-0123456789abcdef0
cluster_parameter_group:
  family: aurora-mysql8.0
  description: orders cluster parameters
  parameters:
    - {name: character_set_server, value: utf8mb4}
    - {name: require_secure_transport, value: "ON", apply_method: pending-reboot}
db_parameter_group:
  name: orders-instances
  family: aurora-mysql8.0
  parameters:
    - {name: connect_timeout, value: "60"}
instances:
  writer: {instance_class: db.serverless, promotion_tier: 0}
  reader: {instance_class: db.r7g.large, availability_zone: eu-west-1b, monitoring_interval: 30, tags: {role: reader}}
  analytics: {identifier: orders-analytics, instance_class: db.r7g.large, publicly_accessible: false, performance_insights_enabled: false}
endpoints:
  static: {identifier: static-readers, type: READER, static_members: [orders-analytics], tags: {use: reports}}
  excluded: {identifier: excluded-readers, type: ANY, excluded_members: [orders-analytics]}
role_associations:
  s3Import: {role_arn: "arn:aws:iam::111122223333:role/orders-s3-import"}
  lambda: {feature_name: Lambda, role_arn: "arn:aws:iam::111122223333:role/orders-lambda"}
create_monitoring_role: true
cluster_monitoring_interval: 60
iam_role_name: orders-rds-monitoring
iam_role_description: Enhanced monitoring for orders
iam_role_path: /rds/
iam_role_max_session_duration: 7200
autoscaling_enabled: true
autoscaling_min_capacity: 1
autoscaling_max_capacity: 5
predefined_metric_type: RDSReaderAverageDatabaseConnections
autoscaling_target_connections: 500
security_group_name: orders-db
security_group_description: Orders database
security_group_ingress_rules:
  app: {cidr_ipv4: 10.0.0.0/16, description: from the VPC}
  self: {referenced_security_group_id: self}
  v6: {cidr_ipv6: "2001:db8::/56", from_port: 3307, to_port: 3307}
security_group_egress_rules:
  all: {cidr_ipv4: 0.0.0.0/0, ip_protocol: "-1", from_port: -1, to_port: -1}
  s3: {prefix_list_id: pl-6da54004, from_port: 443}
security_group_tags: {tier: data}
create_cloudwatch_log_group: true
enabled_cloudwatch_logs_exports: [audit, error, slowquery]
cloudwatch_log_group_retention_in_days: 30
cloudwatch_log_group_skip_destroy: true
cloudwatch_log_group_tags: {logs: "yes"}
cluster_tags: {schedule: office-hours}
tags: {team: orders}
