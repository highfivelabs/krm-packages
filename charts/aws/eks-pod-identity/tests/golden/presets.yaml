spec:
  name: "Custom_EBS_CSI"
  path: "/"
  description: "Permissions to manage EBS volumes via the container storage interface (CSI) driver"
  policyDocument: "{\"Statement\":[{\"Action\":[\"ec2:CreateSnapshot\",\"ec2:AttachVolume\",\"ec2:DetachVolume\",\"ec2:ModifyVolume\",\"ec2:DescribeAvailabilityZones\",\"ec2:DescribeInstances\",\"ec2:DescribeInstanceTypes\",\"ec2:DescribeSnapshots\",\"ec2:DescribeTags\",\"ec2:DescribeVolumes\",\"ec2:DescribeVolumesModifications\",\"ec2:DescribeVolumeStatus\",\"ec2:EnableFastSnapshotRestores\"],\"Effect\":\"Allow\",\"Resource\":[\"*\"]},{\"Action\":[\"ec2:CopyVolumes\"],\"Effect\":\"Allow\",\"Resource\":[\"arn:aws:ec2:*:*:volume/vol-*\"]},{\"Action\":[\"ec2:CreateTags\"],\"Condition\":{\"StringEquals\":{\"ec2:CreateAction\":[\"CreateVolume\",\"CreateSnapshot\",\"CopyVolumes\"]}},\"Effect\":\"Allow\",\"Resource\":[\"arn:aws:ec2:*:*:volume/*\",\"arn:aws:ec2:*:*:snapshot/*\"]},{\"Action\":[\"ec2:DeleteTags\"],\"Effect\":\"Allow\",\"Resource\":[\"arn:aws:ec2:*:*:volume/*\",\"arn:aws:ec2:*:*:snapshot/*\"]},{\"Action\":[\"ec2:CreateVolume\",\"ec2:CopyVolumes\"],\"Condition\":{\"StringLike\":{\"aws:RequestTag/ebs.csi.aws.com/cluster\":[\"true\"]}},\"Effect\":\"Allow\",\"Resource\":[\"arn:aws:ec2:*:*:volume/*\"]},{\"Action\":[\"ec2:CreateVolume\",\"ec2:CopyVolumes\"],\"Condition\":{\"StringLike\":{\"aws:RequestTag/CSIVolumeName\":[\"*\"]}},\"Effect\":\"Allow\",\"Resource\":[\"arn:aws:ec2:*:*:volume/*\"]},{\"Action\":[\"ec2:CreateVolume\"],\"Effect\":\"Allow\",\"Resource\":[\"arn:aws:ec2:*:*:snapshot/*\"]},{\"Action\":[\"ec2:DeleteVolume\"],\"Condition\":{\"StringLike\":{\"ec2:ResourceTag/ebs.csi.aws.com/cluster\":[\"true\"]}},\"Effect\":\"Allow\",\"Resource\":[\"*\"]},{\"Action\":[\"ec2:DeleteVolume\"],\"Condition\":{\"StringLike\":{\"ec2:ResourceTag/CSIVolumeName\":[\"*\"]}},\"Effect\":\"Allow\",\"Resource\":[\"*\"]},{\"Action\":[\"ec2:DeleteVolume\"],\"Condition\":{\"StringLike\":{\"ec2:ResourceTag/kubernetes.io/created-for/pvc/name\":[\"*\"]}},\"Effect\":\"Allow\",\"Resource\":[\"*\"]},{\"Action\":[\"ec2:DeleteSnapshot\",\"ec2:LockSnapshot\"],\"Condition\":{\"StringLike\":{\"ec2:ResourceTag/CSIVolumeSnapshotName\":[\"*\"]}},\"Effect\":\"Allow\",\"Resource\":[\"*\"]},{\"Action\":[\"ec2:DeleteSnapshot\",\"ec2:LockSnapshot\"],\"Condition\":{\"StringLike\":{\"ec2:ResourceTag/ebs.csi.aws.com/cluster\":[\"true\"]}},\"Effect\":\"Allow\",\"Resource\":[\"*\"]},{\"Action\":[\"kms:CreateGrant\",\"kms:ListGrants\",\"kms:RevokeGrant\"],\"Condition\":{\"Bool\":{\"kms:GrantIsForAWSResource\":[\"true\"]}},\"Effect\":\"Allow\",\"Resource\":[\"arn:aws:kms:us-west-2:123456789012:key/1234\"]},{\"Action\":[\"kms:Encrypt\",\"kms:Decrypt\",\"kms:ReEncrypt*\",\"kms:GenerateDataKey*\",\"kms:DescribeKey\"],\"Effect\":\"Allow\",\"Resource\":[\"arn:aws:kms:us-west-2:123456789012:key/1234\"]}],\"Version\":\"2012-10-17\"}"
