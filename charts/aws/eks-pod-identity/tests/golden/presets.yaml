apiVersion: iam.services.k8s.aws/v1alpha1
kind: Policy
metadata:
  name: presets-ebs-csi-policy
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "presets"
    app.kubernetes.io/name: eks-pod-identity
