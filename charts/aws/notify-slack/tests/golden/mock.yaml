apiVersion: lambda.services.k8s.aws/v1alpha1
kind: Function
metadata:
  name: mock-function
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "mock"
    app.kubernetes.io/name: notify-slack
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "function"
    services.k8s.aws/region: "us-east-1"
spec:
  name: "notify-slack"
  roleRef:
    from:
      name: "mock-role"
  code:
    s3Bucket: "my-artifacts"
    s3Key: "notify-slack.zip"
  packageType: "Zip"
  handler: "notify_slack.lambda_handler"
  runtime: "python3.13"
  timeout: 30
  ephemeralStorage:
    size: 512
  publish: true
  environment:
    variables:
      LOG_EVENTS: "False"
      LOG_LEVEL: INFO
      SLACK_CHANNEL: '#alerts'
      SLACK_EMOJI: ':aws:'
      SLACK_USERNAME: aws-bot
