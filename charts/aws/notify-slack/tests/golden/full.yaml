# Source: notify-slack/templates/notify-slack.yaml
apiVersion: lambda.services.k8s.aws/v1alpha1
kind: Function
metadata:
  name: full-function
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "full"
    app.kubernetes.io/name: notify-slack
    app.kubernetes.io/version: "0.1.0"
    team: "platform"
  annotations:
    hfl.dev/id: "function"
    services.k8s.aws/region: "us-east-1"
spec:
  name: "notify-slack"
  roleRef:
    from:
      name: "full-role"
  code:
    s3Bucket: "my-artifacts"
    s3Key: "notify-slack.zip"
    s3ObjectVersion: "v1"
  packageType: "Zip"
  handler: "notify_slack.lambda_handler"
  runtime: "python3.13"
  description: "Forward SNS alerts to Slack"
  timeout: 30
  kmsKeyARN: "arn:aws:kms:us-east-1:123456789012:key/1234"
  reservedConcurrentExecutions: 5
  ephemeralStorage:
    size: 512
  publish: true
  environment:
    variables:
      LOG_EVENTS: "True"
      LOG_LEVEL: DEBUG
      SLACK_CHANNEL: '#alerts'
      SLACK_EMOJI: ':bell:'
      SLACK_USERNAME: aws-bot
      SLACK_WEBHOOK_URL: AQICAHhEncryptedCiphertext==
  tags:
    env: prod
