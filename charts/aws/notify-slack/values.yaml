#
# Values mirror the Terraform variables of terraform-aws-modules' notify-slack
# module (v7.5.2): same names, types and defaults, so a module block's
# arguments become a values file one to one. values.schema.json carries the
# types. A variable the chart cannot carry stays here and stops the render
# when set (upstream.yaml lists them; README.md says why).

names: {}
namePrefix: ""
labels: {}
# Permission (lambda.aws.hfl.dev/v1alpha1) is an ack-extensions kind outside
# ACK's released controllers and renders only with allow_alpha: true.
allow_alpha: false
deletion_policy: DELETE
partition: aws
account_id: null
region: null
# Published Lambda artifact (replaces local zip packaging of functions/notify_slack.py).
s3_existing_package: null
image_uri: null

# The module's variables, in its order, with its defaults.
putin_khuylo: true
architectures: null
create: true
create_sns_topic: true
hash_extra: ""
lambda_role: ""
lambda_function_name: "notify_slack"
lambda_description: null
lambda_source_path: null
lambda_dead_letter_target_arn: null
lambda_attach_dead_letter_policy: false
sns_topic_name: ""
sns_topic_kms_key_id: ""
sns_topic_policy: null
enable_sns_topic_delivery_status_logs: false
sns_topic_lambda_feedback_role_arn: ""
sns_topic_feedback_role_name: null
sns_topic_feedback_role_description: null
sns_topic_feedback_role_path: null
sns_topic_feedback_role_force_detach_policies: true
sns_topic_feedback_role_permissions_boundary: null
sns_topic_feedback_role_tags: {}
sns_topic_lambda_feedback_sample_rate: 100
slack_webhook_url: ""
slack_channel: ""
slack_username: ""
slack_emoji: ":aws:"
kms_key_arn: ""
recreate_missing_package: true
log_events: false
log_level: "INFO"
reserved_concurrent_executions: -1
cloudwatch_log_group_retention_in_days: 0
cloudwatch_log_group_kms_key_id: null
tags: {}
iam_role_tags: {}
iam_role_boundary_policy_arn: null
iam_role_name_prefix: "lambda"
iam_role_path: null
lambda_function_tags: {}
lambda_function_vpc_subnet_ids: null
lambda_function_vpc_security_group_ids: null
lambda_function_store_on_s3: false
lambda_function_s3_bucket: null
lambda_function_ephemeral_storage_size: 512
sns_topic_tags: {}
cloudwatch_log_group_tags: {}
subscription_filter_policy: null
subscription_filter_policy_scope: null
trigger_on_package_timestamp: false
runtime: "python3.13"
