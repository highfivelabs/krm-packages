{{- include "ack.unsupported" (list $ "recreate_missing_package" (not .Values.recreate_missing_package) "local deployment package building is not portable; pass s3_existing_package or image_uri") }}
{{- include "ack.unsupported" (list $ "sns_topic_feedback_role_force_detach_policies" (not .Values.sns_topic_feedback_role_force_detach_policies) "ACK's Role (iam-controller v1.11.3) has no forceDetachPolicies field; inline policies are deleted with the Role") }}
