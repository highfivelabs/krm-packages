apiVersion: ecr.services.k8s.aws/v1alpha1
kind: PullThroughCacheRule
metadata:
  name: mock-cache-pub
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "mock"
    app.kubernetes.io/name: ecr
    app.kubernetes.io/version: "0.1.0"
  annotations:
