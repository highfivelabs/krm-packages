# Values mirror the Terraform variables of terraform-aws-modules' network-firewall
# module (v2.3.0): same names, types and defaults, so a module block's
# arguments become a values file one to one. values.schema.json carries the
# types. A variable the chart cannot carry stays here and stops the render
# when set (upstream.yaml lists them; README.md says why).

# Names, labels and tags (docs/design.md, "Names, labels and tags"). Not
# Terraform variables, except tags, which is the module's own.
# Names in full, {firewall, policy}: the firewall's and the firewall policy's
# names. A name set here takes no namePrefix.
names: {}
# An optional convenience: "<namePrefix>-" in front of every name the chart
# derives or takes from the module's variables. Empty changes nothing.
namePrefix: ""
# Kubernetes labels on every object. They stay in Kubernetes: ACK does not
# copy labels to AWS (AWS tags are the module's tags variable).
labels: {}
# RAM ResourceAssociation (ram.cloudcontrol.aws.hfl.dev/v1alpha1,
# policy_ram_resource_associations) is an ack-extensions Cloud Control kind
# outside ACK's released controllers and renders only with allow_alpha: true.
allow_alpha: false
# DELETE (ACK's default) deletes the AWS resource with its object; ABANDON
# keeps it (services.k8s.aws/deletion-policy: retain).
deletion_policy: DELETE
partition: aws
# The account the firewall policy lives in: needed for policy_ram_resource_associations,
# which names the policy by its ARN (no reference field exists on the RAM kind).
account_id: null

# The module's variables, in its order, with its defaults.
# Controls if resources should be created
create: true
# Region where the resource(s) will be managed. Defaults to the Region set in
# the provider configuration
region: null
# A map of tags to add to all resources
tags: {}
#  A setting indicating whether the firewall is protected against changes to
# its Availability Zone configuration. When set to true, you must first
# disable this protection before adding or removing Availability Zones
availability_zone_change_protection: null
# Required when creating a transit gateway-attached firewall. Set of
# configuration blocks describing the avaiability availability where you want
# to create firewall endpoints for a transit gateway-attached firewall
availability_zone_mapping: null
# A boolean flag indicating whether it is possible to delete the firewall.
# Defaults to `true`
delete_protection: true
# A friendly description of the firewall
description: ""
# Set of types for which to collect analysis metrics. Valid values:
# `TLS_SNI`, `HTTP_HOST`. Defaults to `[]`
enabled_analysis_types: null
# KMS encryption configuration settings
encryption_configuration: null
# The ARN of the Firewall Policy to use
firewall_policy_arn: ""
# A boolean flag indicating whether it is possible to change the associated
# firewall policy. Defaults to `false`
firewall_policy_change_protection: null
# A friendly name of the firewall
name: ""
# A boolean flag indicating whether it is possible to change the associated
# subnet(s). Defaults to `true`
subnet_change_protection: true
# Set of configuration blocks describing the public subnets. Each subnet must
# belong to a different Availability Zone in the VPC. AWS Network Firewall
# creates a firewall endpoint in each subnet
subnet_mapping: null
# The ID of the transit gateway to which the firewall is attached. Required
# when creating a transit gateway-attached firewall
transit_gateway_id: null
# The unique identifier of the VPC where AWS Network Firewall should create
# the firewall
vpc_id: null
# Controls if a Logging Configuration should be created
create_logging_configuration: null
# A list of min 1, max 2 configuration blocks describing the destination for
# the logging configuration
logging_configuration_destination_config: null
# Whether to enable monitoring dashboard for the logging configuration
enable_monitoring_dashboard: null
# Controls if policy should be created
create_policy: true
# A friendly description of the firewall policy
policy_description: null
# KMS encryption configuration settings
policy_encryption_configuration: null
# Contains variables that you can use to override default Suricata settings
# in your firewall policy
policy_variables: null
# Set of actions to take on a packet if it does not match any stateful rules
# in the policy. This can only be specified if the policy has a
# `stateful_engine_options` block with a rule_order value of `STRICT_ORDER`.
# You can specify one of either or neither values of `aws:drop_strict` or
# `aws:drop_established`, as well as any combination of `aws:alert_strict`
# and `aws:alert_established`
policy_stateful_default_actions: null
# A configuration block that defines options on how the policy handles
# stateful rules. See [Stateful Engine
# Options](https://registry.terraform.io/providers/hashicorp/aws/latest/docs/resources/networkfirewall_firewall_policy#stateful-engine-options) for details
policy_stateful_engine_options: null
# Set of configuration blocks containing references to the stateful rule
# groups that are used in the policy. See [Stateful Rule Group
# Reference](https://registry.terraform.io/providers/hashicorp/aws/latest/docs/resources/networkfirewall_firewall_policy#stateful-rule-group-reference) for details
policy_stateful_rule_group_reference: null
# Set of configuration blocks describing the custom action definitions that
# are available for use in the firewall policy's `stateless_default_actions`
policy_stateless_custom_action: null
# Set of actions to take on a packet if it does not match any of the
# stateless rules in the policy. You must specify one of the standard actions
# including: `aws:drop`, `aws:pass`, or `aws:forward_to_sfe`
policy_stateless_default_actions: null
# Set of actions to take on a fragmented packet if it does not match any of
# the stateless rules in the policy. You must specify one of the standard
# actions including: `aws:drop`, `aws:pass`, or `aws:forward_to_sfe`
policy_stateless_fragment_default_actions: null
# Set of configuration blocks containing references to the stateless rule
# groups that are used in the policy. See [Stateless Rule Group
# Reference](https://registry.terraform.io/providers/hashicorp/aws/latest/docs/resources/networkfirewall_firewall_policy#stateless-rule-group-reference) for details
policy_stateless_rule_group_reference: null
# A friendly name of the firewall policy
policy_name: ""
# The ARN of the TLS inspection configuration to associate with the firewall
# policy
policy_tls_inspection_configuration_arn: null
# Whether to allow the firewall to hold TLS sessions to allow TLS traffic
# processing before downstream connection establishment. When set to `true`,
# adds latency — enable only if TLS.SNI rule groups are active in the policy
policy_enable_tls_session_holding: null
# A map of tags to add to all resources
policy_tags: {}
# Controls if a resource policy should be created
create_policy_resource_policy: null
# A list of IAM actions allowed in the resource policy
policy_resource_policy_actions: null
# A list of IAM principals allowed in the resource policy
policy_resource_policy_principals: null
# Controls if a resource policy should be attached to the firewall policy
policy_attach_resource_policy: null
# The policy JSON to use for the resource policy; required when
# `create_resource_policy` is `false`
policy_resource_policy: ""
# A map of RAM resource associations for the created firewall policy
policy_ram_resource_associations: null
