allow_alpha: true
function_name: full-fn
description: Full lambda test
package_type: Image
image_uri: 123456789012.dkr.ecr.us-east-1.amazonaws.com/my-fn:v1
memory_size: 512
timeout: 30
publish: true
reserved_concurrent_executions: 5
tracing_mode: Active
create_lambda_function_url: true
authorization_type: AWS_IAM
create_async_event_config: true
maximum_event_age_in_seconds: 300
maximum_retry_attempts: 1
attach_tracing_policy: true
allowed_triggers:
  events:
    principal: events.amazonaws.com
    source_arn: arn:aws:events:us-east-1:123456789012:rule/daily
event_source_mapping:
  sqs:
    event_source_arn: arn:aws:sqs:us-east-1:123456789012:jobs
    batch_size: 10
    enabled: true
tags:
  env: full
