---
# Source: lambda/templates/function.yaml
apiVersion: iam.services.k8s.aws/v1alpha1
kind: Role
metadata:
  name: mock-role
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "mock"
    app.kubernetes.io/name: lambda
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "role"
spec:
  name: "mock-fn"
  assumeRolePolicyDocument: "{\"Statement\":[{\"Action\":\"sts:AssumeRole\",\"Effect\":\"Allow\",\"Principal\":{\"Service\":[\"lambda.amazonaws.com\"]}}],\"Version\":\"2012-10-17\"}"
  maxSessionDuration: 3600
  policies:
    - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
  tags:
    - key: "env"
      value: "mock"
---
# Source: lambda/templates/function.yaml
apiVersion: lambda.services.k8s.aws/v1alpha1
kind: Function
metadata:
  name: mock-fn
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "mock"
    app.kubernetes.io/name: lambda
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "function"
spec:
  name: "mock-fn"
  roleRef:
    from:
      name: "mock-role"
  code:
    s3Bucket: "mock-lambda-bucket"
    s3Key: "mock-fn.zip"
  packageType: "Zip"
  handler: "index.handler"
  runtime: "python3.12"
  memorySize: 256
  timeout: 10
  ephemeralStorage:
    size: 512
  environment:
    variables:
      LOG_LEVEL: INFO
  loggingConfig:
    logFormat: "Text"
  tags:
    env: mock
---
# Source: lambda/templates/function.yaml
apiVersion: cloudwatchlogs.services.k8s.aws/v1alpha1
kind: LogGroup
metadata:
  name: mock-log-group
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "mock"
    app.kubernetes.io/name: lambda
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "log-group"
spec:
  name: "/aws/lambda/mock-fn"
  tags:
    env: mock
