# Source: rds-proxy/templates/rds-proxy.yaml
apiVersion: rds.services.k8s.aws/v1alpha1
kind: DBProxy
metadata:
  name: full-proxy
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "full"
    app.kubernetes.io/name: rds-proxy
    app.kubernetes.io/version: "0.1.0"
    team: "data"
  annotations:
    hfl.dev/id: "proxy"
    services.k8s.aws/region: "us-east-1"
spec:
  name: "db-proxy"
  engineFamily: "MYSQL"
  auth:
    - authScheme: SECRETS
      clientPasswordAuthType: MYSQL_NATIVE_PASSWORD
      description: admin user
      iamAuth: REQUIRED
      secretARN: arn:aws:secretsmanager:us-east-1:123456789012:secret:admin-AbCdEf
      userName: admin
    - authScheme: SECRETS
      secretARN: arn:aws:secretsmanager:us-east-1:123456789012:secret:app-AbCdEf
    - authScheme: SECRETS
  roleRef:
    from:
      name: full-role
  debugLogging: true
  requireTLS: true
  idleClientTimeout: 900
  vpcSubnetIDs:
    - subnet-0123456789abcdef0
    - subnet-0123456789abcdef1
  vpcSecurityGroupIDs:
    - sg-0123456789abcdef0
  tags:
    - key: "env"
      value: "prod"
    - key: "tier"
      value: "db"
