apiVersion: iam.services.k8s.aws/v1alpha1
kind: Role
metadata:
  name: full-role
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "full"
    app.kubernetes.io/name: rds-proxy
    app.kubernetes.io/version: "0.1.0"
    team: "data"
  annotations:
    hfl.dev/id: "role"
spec:
  name: "proxy-role"
  assumeRolePolicyDocument: "{\"Statement\":[{\"Action\":[\"sts:AssumeRole\"],\"Effect\":\"Allow\",\"Principal\":{\"Service\":[\"rds.amazonaws.com\"]},\"Sid\":\"RDSAssume\"}],\"Version\":\"2012-10-17\"}"
  description: "RDS proxy role"
  path: "/service/"
  permissionsBoundary: "arn:aws:iam::123456789012:policy/boundary"
  maxSessionDuration: 7200
  inlinePolicies:
    "proxy-secrets": "{\"Statement\":[{\"Action\":[\"kms:Decrypt\"],\"Condition\":{\"StringEquals\":{\"kms:ViaService\":[\"secretsmanager.us-east-1.amazonaws.com\"]}},\"Effect\":\"Allow\",\"Resource\":[\"arn:aws:kms:us-east-1:123456789012:key/1234\"],\"Sid\":\"DecryptSecrets\"},{\"Action\":[\"secretsmanager:GetRandomPassword\",\"secretsmanager:ListSecrets\"],\"Effect\":\"Allow\",\"Resource\":[\"*\"],\"Sid\":\"ListSecrets\"},{\"Action\":[\"secretsmanager:GetResourcePolicy\",\"secretsmanager:GetSecretValue\",\"secretsmanager:DescribeSecret\",\"secretsmanager:ListSecretVersionIds\"],\"Effect\":\"Allow\",\"Resource\":[\"arn:aws:secretsmanager:us-east-1:123456789012:secret:admin-AbCdEf\",\"arn:aws:secretsmanager:us-east-1:123456789012:secret:app-AbCdEf\"],\"Sid\":\"GetSecrets\"}],\"Version\":\"2012-10-17\"}"
  tags:
    - key: "env"
      value: "prod"
