# Source: rds-proxy/templates/rds-proxy.yaml
apiVersion: rds.services.k8s.aws/v1alpha1
kind: DBProxy
metadata:
  name: mock-proxy
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "mock"
    app.kubernetes.io/name: rds-proxy
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "proxy"
    services.k8s.aws/region: "us-east-1"
spec:
  name: "db-proxy"
  engineFamily: "POSTGRESQL"
  auth:
    - authScheme: SECRETS
      iamAuth: DISABLED
      secretARN: arn:aws:secretsmanager:us-east-1:123456789012:secret:db-creds-AbCdEf
  roleRef:
    from:
      name: mock-role
  debugLogging: false
  requireTLS: true
  idleClientTimeout: 1800
  vpcSubnetIDs:
    - subnet-0123456789abcdef0
    - subnet-0123456789abcdef1
  vpcSecurityGroupIDs:
    - sg-0123456789abcdef0
  tags:
    - key: "env"
      value: "dev"
---
# Source: rds-proxy/templates/rds-proxy.yaml
apiVersion: cloudwatchlogs.services.k8s.aws/v1alpha1
kind: LogGroup
metadata:
  name: mock-log-group
