# Values mirror the Terraform variables of terraform-aws-modules' rds-proxy
# module (v4.4.1): same names, types and defaults, so a module block's
# arguments become a values file one to one. values.schema.json carries the
# types. A variable the chart cannot carry stays here and stops the render
# when set (upstream.yaml lists them; README.md says why).

# Names, labels and tags (docs/design.md, "Names, labels and tags"). Not
# Terraform variables, except tags, which is the module's own.
# Names in full, {proxy, role, logGroup}: the proxy's, the IAM role's and the
# log group's names. A name set here takes no namePrefix.
names: {}
# An optional convenience: "<namePrefix>-" in front of every name the chart
# derives or takes from the module's variables. Empty changes nothing.
namePrefix: ""
# Kubernetes labels on every object. They stay in Kubernetes: ACK does not
# copy labels to AWS (AWS tags are the module's tags variable).
labels: {}
# DBProxyTarget (rds.aws.hfl.dev/v1alpha1) and DBProxyEndpoint
# (rds.cloudcontrol.aws.hfl.dev/v1alpha1, Cloud Control) are ack-extensions
# kinds outside ACK's released controllers and render only with allow_alpha:
# true.
allow_alpha: false
# DELETE (ACK's default) deletes the AWS resource with its object; ABANDON
# keeps it (services.k8s.aws/deletion-policy: retain).
deletion_policy: DELETE
partition: aws

# The module's variables, in its order, with its defaults.
# Whether cluster should be created (affects nearly all resources)
create: true
# Region where the resource(s) will be managed. Defaults to the Region set in
# the provider configuration
region: null
# A map of tags to add to all resources
tags: {}
# The identifier for the proxy. This name must be unique for all proxies
# owned by your AWS account in the specified AWS Region. An identifier must
# begin with a letter and must contain only ASCII letters, digits, and
# hyphens; it can't end with a hyphen or contain two consecutive hyphens
name: ""
# Configuration block(s) with authorization mechanisms to connect to the
# associated instances or clusters
auth: {default: {auth_scheme: SECRETS}}
# Whether the proxy includes detailed information about SQL statements in its
# logs
debug_logging: false
# Default authentication scheme that the proxy uses for client connections to
# the proxy and connections from the proxy to the underlying database. Valid
# values are NONE and IAM_AUTH. Defaults to NONE
default_auth_scheme: null
# Network type of the DB proxy endpoint. Valid values are IPV4, IPV6 and
# DUAL. Defaults to IPV4. If IPV6 is specified, the subnets associated with
# the proxy must be IPv6-only, and target_connection_network_type must be IPV6
endpoint_network_type: null
# The kind of database engine that the proxy will connect to. Valid values
# are `MYSQL` or `POSTGRESQL`
engine_family: ""
# The number of seconds that a connection to the proxy can be inactive before
# the proxy disconnects it
idle_client_timeout: 1800
# A Boolean parameter that specifies whether Transport Layer Security (TLS)
# encryption is required for connections to the proxy
require_tls: true
# The Amazon Resource Name (ARN) of the IAM role that the proxy uses to
# access secrets in AWS Secrets Manager
role_arn: ""
# Network type that the proxy uses to connect to the target database. Valid
# values are IPV4 and IPV6. Defaults to IPV4
target_connection_network_type: null
# One or more VPC security group IDs to associate with the new proxy
vpc_security_group_ids: []
# One or more VPC subnet IDs to associate with the new proxy
vpc_subnet_ids: []
# A map of tags to apply to the RDS Proxy
proxy_tags: {}
# The number of seconds for a proxy to wait for a connection to become
# available in the connection pool
connection_borrow_timeout: null
# One or more SQL statements for the proxy to run when opening each new
# database connection
init_query: ""
# The maximum size of the connection pool for each target in a target group
max_connections_percent: 90
# Controls how actively the proxy closes idle database connections in the
# connection pool
max_idle_connections_percent: 50
# Each item in the list represents a class of SQL operations that normally
# cause all later statements in a session using a proxy to be pinned to the
# same underlying database connection
session_pinning_filters: []
# Determines whether DB instance is targeted by proxy
target_db_instance: false
# DB instance identifier
db_instance_identifier: ""
# Determines whether DB cluster is targeted by proxy
target_db_cluster: false
# DB cluster identifier
db_cluster_identifier: ""
# Map of DB proxy endpoints to create and their attributes
endpoints: {}
# Determines whether Terraform will create/manage the CloudWatch log group or
# not. Note - this will fail if set to true after the log group has been
# created as the resource will already exist
manage_log_group: true
# Specifies the number of days you want to retain log events in the log group
log_group_retention_in_days: 30
# The ARN of the KMS Key to use when encrypting log data
log_group_kms_key_id: null
# Specified the log class of the log group. Possible values are: `STANDARD`
# or `INFREQUENT_ACCESS`
log_group_class: null
# A map of tags to apply to the CloudWatch log group
log_group_tags: {}
# Determines whether an IAM role is created
create_iam_role: true
# The name of the role. If omitted, Terraform will assign a random, unique
# name
iam_role_name: ""
# Whether to use unique name beginning with the specified `iam_role_name`
use_role_name_prefix: false
# The description of the role
iam_role_description: ""
# The path to the role
iam_role_path: null
# Specifies to force detaching any policies the role has before destroying it
iam_role_force_detach_policies: true
# The maximum session duration (in seconds) that you want to set for the
# specified role
iam_role_max_session_duration: 43200
# The ARN of the policy that is used to set the permissions boundary for the
# role
iam_role_permissions_boundary: null
# A map of tags to apply to the IAM role
iam_role_tags: {}
# Determines whether an IAM policy is created
create_iam_policy: true
# The name of the role policy. If omitted, Terraform will assign a random,
# unique name
iam_policy_name: ""
# Whether to use unique name beginning with the specified `iam_policy_name`
use_policy_name_prefix: false
# List of KMS Key ARNs to allow access to decrypt SecretsManager secrets
kms_key_arns: []
