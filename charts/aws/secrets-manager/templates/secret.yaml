{{- /*
Copyright 2026 High Five Labs
SPDX-License-Identifier: Apache-2.0

main.tf: the secret (aws_secretsmanager_secret.this,
secretsmanager/Secret) with its replicas (replicaRegions) and its value
(aws_secretsmanager_secret_version.this -> secretString), which ACK reads
from a Kubernetes Secret (secret_string_ref): a value never enters the
render. Rotation and the value variables are refused (refusals.yaml).
*/ -}}
{{- include "ack.names" (list $ (list "secret")) -}}
{{- $v := .Values -}}
{{- if $v.create }}
{{- $name := include "sm.name" $ }}
{{- if not $name }}
{{- fail "secrets-manager: name is required: the secret's name (or names.secret); Terraform's generated name (name_prefix) would change between renders" }}
{{- end }}
{{- $region := $v.region | default "" }}
{{- $tags := include "ack.tags" (list $ $v.tags) | fromJson }}
---
apiVersion: secretsmanager.services.k8s.aws/v1alpha1
kind: Secret
metadata:
{{- include "ack.metadata" (dict "root" $ "name" (include "ack.name" (list $.Release.Name "secret")) "id" "secret" "region" $region) | nindent 2 }}
spec:
  name: {{ $name | quote }}
{{- with $v.description }}
  description: {{ . | quote }}
{{- end }}
{{- if not (kindIs "invalid" $v.force_overwrite_replica_secret) }}
  forceOverwriteReplicaSecret: {{ $v.force_overwrite_replica_secret }}
{{- end }}
{{- with $v.kms_key_id }}
  kmsKeyID: {{ . | quote }}
{{- end }}
{{- if not (kindIs "invalid" $v.recovery_window_in_days) }}
  recoveryWindowInDays: {{ $v.recovery_window_in_days | int64 }}
{{- end }}
{{- with $v.replica }}
  replicaRegions:
{{- range $k := keys . | sortAlpha }}
{{- $r := index $v.replica $k | default dict }}
    - region: {{ $r.region | default $k | quote }}
{{- with $r.kms_key_id }}
      kmsKeyID: {{ . | quote }}
{{- end }}
{{- end }}
{{- end }}
{{- if and $v.create_secret_version $v.secret_string_ref }}
{{- $ref := $v.secret_string_ref }}
  secretString:
    name: {{ $ref.name | quote }}
    key: {{ $ref.key | quote }}
{{- with $ref.namespace }}
    namespace: {{ . | quote }}
{{- end }}
{{- end }}
{{- with $tags }}
  tags:
{{- include "ack.tagList" (list .) | nindent 4 }}
{{- end }}
{{- end }}
