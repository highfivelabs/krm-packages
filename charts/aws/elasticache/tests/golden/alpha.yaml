apiVersion: cloudwatchlogs.aws.hfl.dev/v1alpha1
kind: LogGroup
metadata:
  name: alpha-log-slow-log
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "alpha"
    app.kubernetes.io/name: elasticache
    app.kubernetes.io/version: "0.2.0"
  annotations:
    hfl.dev/id: "log-group-slow-log"
