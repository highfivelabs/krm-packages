# Source: elasticache/templates/elasticache.yaml
apiVersion: elasticache.aws.hfl.dev/v1alpha1
kind: ReplicationGroup
metadata:
  name: alpha-replication-group
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "alpha"
    app.kubernetes.io/name: elasticache
    app.kubernetes.io/version: "0.2.0"
  annotations:
    hfl.dev/id: "replication-group"
spec:
  replicationGroupID: "app-alpha"
  description: "Replication group"
  engine: "redis"
  engineVersion: "7.1"
  cacheNodeType: "cache.t4g.micro"
  port: 6379
  atRestEncryptionEnabled: true
  transitEncryptionEnabled: true
  authToken:
    name: "redis-auth"
    key: "token"
  authTokenUpdateStrategy: "SET"
  clusterMode: "enabled"
  finalSnapshotIdentifier: "app-alpha-final"
  globalReplicationGroupID: "global-app"
  transitEncryptionMode: "preferred"
  multiAZEnabled: false
  replicasPerNodeGroup: 1
  cacheSubnetGroupRef:
    from:
      name: alpha-subnet-group
  securityGroupRefs:
    - from:
        name: alpha-sg
  logDeliveryConfigurations:
    - {"destinationDetails":{"cloudWatchLogsDetails":{"logGroup":"/aws/elasticache/app-alpha"}},"destinationType":"cloudwatch-logs","enabled":true,"logFormat":"json","logType":"slow-log"}
  tags:
    - key: "terraform-aws-modules"
      value: "elasticache"
---
