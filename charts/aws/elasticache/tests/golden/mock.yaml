# Source: elasticache/templates/elasticache.yaml
apiVersion: elasticache.services.k8s.aws/v1alpha1
kind: ReplicationGroup
metadata:
  name: mock-replication-group
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "mock"
    app.kubernetes.io/name: elasticache
    app.kubernetes.io/version: "0.2.0"
  annotations:
    hfl.dev/id: "replication-group"
spec:
  replicationGroupID: "catalog-cache"
  description: "Replication group"
  engine: "redis"
  engineVersion: "7.1"
  cacheNodeType: "cache.t3.micro"
  port: 6379
  atRestEncryptionEnabled: true
  transitEncryptionEnabled: true
  authToken:
    name: "catalog-cache-auth"
    key: "token"
  multiAZEnabled: false
  numNodeGroups: 1
  replicasPerNodeGroup: 1
  cacheParameterGroupRef:
    from:
      name: mock-parameter-group
  cacheSubnetGroupRef:
    from:
      name: mock-subnet-group
  securityGroupRefs:
    - from:
        name: mock-sg
  logDeliveryConfigurations:
    - {"destinationDetails":{"cloudWatchLogsDetails":{"logGroup":"/aws/elasticache/catalog-cache"}},"destinationType":"cloudwatch-logs","enabled":true,"logFormat":"json","logType":"slow-log"}
  tags:
    - key: "catalog-test"
      value: "true"
    - key: "terraform-aws-modules"
      value: "elasticache"
