# Source: elasticache/templates/elasticache.yaml
apiVersion: elasticache.services.k8s.aws/v1alpha1
kind: ReplicationGroup
metadata:
  name: auth-token-replication-group
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "auth-token"
    app.kubernetes.io/name: elasticache
    app.kubernetes.io/version: "0.2.0"
  annotations:
    hfl.dev/id: "replication-group"
spec:
  replicationGroupID: "sessions"
  description: "Replication group"
  engine: "redis"
  cacheNodeType: "cache.t4g.small"
  port: 6379
  atRestEncryptionEnabled: true
  transitEncryptionEnabled: true
  authToken:
    name: "sessions-redis-auth"
    key: "token"
  multiAZEnabled: false
  numNodeGroups: 1
  replicasPerNodeGroup: 1
  cacheSubnetGroupRef:
    from:
      name: auth-token-subnet-group
  securityGroupRefs:
    - from:
        name: auth-token-sg
  logDeliveryConfigurations:
    - {"destinationDetails":{"cloudWatchLogsDetails":{"logGroup":"/aws/elasticache/sessions"}},"destinationType":"cloudwatch-logs","enabled":true,"logFormat":"json","logType":"slow-log"}
  tags:
    - key: "terraform-aws-modules"
      value: "elasticache"
