#
# What tests/mock.values.yaml needs and the chart does not make: a VPC with
# subnets in two Availability Zones for the subnet group and the security
# group (hack/mock-apply-aws.sh applies them first, deletes them last),
# and the Kubernetes Secret the replication group's AUTH token comes from
# (a test value, not a credential).
apiVersion: v1
kind: Secret
metadata:
  name: catalog-cache-auth
type: Opaque
stringData:
  token: catalog-fake-aws-test-token
---
apiVersion: ec2.services.k8s.aws/v1alpha1
kind: VPC
metadata:
  name: cache-vpc
  annotations:
    services.k8s.aws/region: us-east-1
spec:
  cidrBlocks: [10.70.0.0/16]
---
apiVersion: ec2.services.k8s.aws/v1alpha1
kind: Subnet
metadata:
  name: cache-subnet-a
  annotations:
    services.k8s.aws/region: us-east-1
spec:
  cidrBlock: 10.70.1.0/24
  availabilityZone: us-east-1a
  vpcRef:
    from:
      name: cache-vpc
---
apiVersion: ec2.services.k8s.aws/v1alpha1
kind: Subnet
metadata:
  name: cache-subnet-b
  annotations:
    services.k8s.aws/region: us-east-1
spec:
  cidrBlock: 10.70.2.0/24
  availabilityZone: us-east-1b
  vpcRef:
    from:
      name: cache-vpc
