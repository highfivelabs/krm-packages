# Module variables the chart keeps in values.yaml (so tfvars convert one to
# one) but refuses when set (to anything but the module's default), or
# accepts only in part. Read by `task coverage`; `task coverage-verify`
# renders the chart to check that each one is refused. kind: gap (no ACK or
# ack-extensions kind or field), not-ported (ACK has it, the chart does not
# map it yet) or by-design (Bundt replaces it). partial: the variable is
# accepted, the reason says what is not carried.
refused:
- variable: apply_immediately
  kind: gap
  reason: "accepted unset or true; false is refused: ACK's elasticache-controller v1.12.0 applies every change immediately, with no field to wait for the maintenance window"
  partial: true
- variable: auth_token
  kind: by-design
  reason: "auth_token is a reference to a Kubernetes Secret, {secretName, key}, rendered as ReplicationGroup's spec.authToken (ACK's SecretKeyReference; docs/secrets.md); the token itself, a string, is refused: it would be in the rendered manifest"
  partial: true
- variable: auth_token_update_strategy
  kind: alpha
  reason: "ACK's ReplicationGroup (elasticache-controller v1.12.0) has no authTokenUpdateStrategy field; ack-extensions' ReplicationGroup carries it (needs allow_alpha: true)"
  partial: true
  needs_allow_alpha: true
- variable: cluster_mode
  kind: alpha
  reason: "ACK's ReplicationGroup (elasticache-controller v1.12.0) has no clusterMode field; ack-extensions' ReplicationGroup carries it (needs allow_alpha: true)"
  partial: true
  needs_allow_alpha: true
- variable: create_primary_global_replication_group
  kind: gap
  reason: "no GlobalReplicationGroup kind in ACK (elasticache-controller pull request #237) or ack-extensions (its Cloud Control generator excludes AWS::ElastiCache::GlobalReplicationGroup for that pull request)"
- variable: create_secondary_global_replication_group
  kind: gap
  reason: "no GlobalReplicationGroup kind, and ACK's ReplicationGroup has no field to join one"
- variable: final_snapshot_identifier
  kind: alpha
  reason: "ACK's CacheCluster and ReplicationGroup (elasticache-controller v1.12.0) have no finalSnapshotIdentifier field; ack-extensions' kinds carry it (needs allow_alpha: true)"
  partial: true
  needs_allow_alpha: true
- variable: global_replication_group_id
  kind: alpha
  reason: "ACK's ReplicationGroup (elasticache-controller v1.12.0) has no globalReplicationGroupID field; ack-extensions' ReplicationGroup carries it (needs allow_alpha: true)"
  partial: true
  needs_allow_alpha: true
- variable: global_replication_group_id_suffix
  kind: gap
  reason: "used only with a global replication group, which is refused"
- variable: log_delivery_configuration
  kind: alpha
  reason: "accepted, with cloudwatch_log_group_class via ack-extensions' LogGroup (needs allow_alpha: true)"
  partial: true
  fields:
  - cloudwatch_log_group_class
- variable: parameter_group_name
  kind: gap
  reason: "accepted; unset with create_parameter_group: true, the group is named <cluster_id or replication_group_id>-<family> without the module's random_id suffix, since a render must not change between plans"
  partial: true
- variable: security_group_ids
  kind: gap
  reason: "accepted with create_security_group: false; with the chart's own group it is refused, since ACK's ReplicationGroup and CacheCluster cannot take group references and IDs together"
  partial: true
- variable: security_group_rules
  kind: gap
  reason: "accepted, but each rule's tags are not carried: ACK keeps a group's rules inline in SecurityGroup, which has no per-rule tags"
  partial: true
  fields:
  - tags
- variable: security_group_use_name_prefix
  kind: gap
  reason: "accepted: true (the default) names the group as given, without Terraform's random suffix, since a render must not change between plans; the namePrefix value keeps two Instances' groups apart"
  partial: true
- variable: timeouts
  kind: by-design
  reason: "Terraform's create, update and delete timeouts: ACK retries until the cluster is synced, and Bundt waits for it"
- variable: transit_encryption_mode
  kind: alpha
  reason: "ACK's ReplicationGroup (elasticache-controller v1.12.0) has no transitEncryptionMode field; ack-extensions' ReplicationGroup carries it (needs allow_alpha: true)"
  partial: true
  needs_allow_alpha: true
- variable: vpc_id
  kind: gap
  reason: "accepted when set; unset with create_security_group: true (Terraform's default VPC) is refused: ACK's SecurityGroup needs its VPC's ID"
  partial: true
