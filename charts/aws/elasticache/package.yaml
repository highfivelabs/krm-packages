#
# The Bundt Package for this chart (docs/design.md, "Outputs"): the module's
# outputs from the live ReplicationGroup (resources.replication-group),
# CacheCluster (resources.cluster), CacheParameterGroup
# (resources.parameter-group), CacheSubnetGroup (resources.subnet-group),
# SecurityGroup (resources.security-group) and LogGroups
# (resources.log-group-<key>). The primary, reader and port outputs are the
# first node group's endpoints, as the provider reads them for a
# replication group with cluster mode disabled. cluster_cache_nodes is each
# node's id, address, port and Availability Zone, as Terraform's.
# cloudwatch_log_groups is the one field consumers take from each log
# group, its name, by key (outputs are selective). EC2 reports no ARN for a
# group, so security_group_arn is built as the provider builds it.
# Not provided: cluster_engine_version_actual and
# replication_group_engine_version_actual (ACK reports no running version),
# the global_replication_group_* outputs (refused), and
# cloudwatch_log_group_name and cloudwatch_log_group_arn (the module reads
# them from its log group map by the index 0, so they are always null).
apiVersion: hfl.dev/v1
kind: Package
metadata:
  name: aws-elasticache
spec:
  version: 0.2.0
  engine: helm
  providers: [ack]
  outputs:
    cluster_arn: >-
      'cluster' in resources && has(resources.cluster.status.ackResourceMetadata)
      && has(resources.cluster.status.ackResourceMetadata.arn)
      ? dyn(resources.cluster.status.ackResourceMetadata.arn) : null
    cluster_cache_nodes: >-
      'cluster' in resources && has(resources.cluster.status.cacheNodes)
      ? dyn(resources.cluster.status.cacheNodes.map(n, {
          'id': has(n.cacheNodeID) ? n.cacheNodeID : '',
          'address': has(n.endpoint) && has(n.endpoint.address) ? n.endpoint.address : '',
          'port': has(n.endpoint) && has(n.endpoint.port) ? n.endpoint.port : 0,
          'availability_zone': has(n.customerAvailabilityZone) ? n.customerAvailabilityZone : ''}))
      : null
    cluster_address: >-
      'cluster' in resources && has(resources.cluster.status.configurationEndpoint)
      && has(resources.cluster.status.configurationEndpoint.address)
      ? dyn(resources.cluster.status.configurationEndpoint.address) : null
    cluster_configuration_endpoint: >-
      'cluster' in resources && has(resources.cluster.status.configurationEndpoint)
      && has(resources.cluster.status.configurationEndpoint.address)
      ? dyn(resources.cluster.status.configurationEndpoint.address + ':'
        + string(resources.cluster.status.configurationEndpoint.port)) : null
    replication_group_arn: >-
      'replication-group' in resources && has(resources['replication-group'].status.ackResourceMetadata)
      && has(resources['replication-group'].status.ackResourceMetadata.arn)
      ? dyn(resources['replication-group'].status.ackResourceMetadata.arn) : null
    replication_group_id: >-
      'replication-group' in resources ? dyn(resources['replication-group'].spec.replicationGroupID) : null
    replication_group_configuration_endpoint_address: >-
      'replication-group' in resources && has(resources['replication-group'].status.configurationEndpoint)
      && has(resources['replication-group'].status.configurationEndpoint.address)
      ? dyn(resources['replication-group'].status.configurationEndpoint.address) : null
    replication_group_member_clusters: >-
      'replication-group' in resources && has(resources['replication-group'].status.memberClusters)
      ? dyn(resources['replication-group'].status.memberClusters) : null
    replication_group_primary_endpoint_address: >-
      'replication-group' in resources && has(resources['replication-group'].status.nodeGroups)
      && size(resources['replication-group'].status.nodeGroups) > 0
      && has(resources['replication-group'].status.nodeGroups[0].primaryEndpoint)
      && has(resources['replication-group'].status.nodeGroups[0].primaryEndpoint.address)
      ? dyn(resources['replication-group'].status.nodeGroups[0].primaryEndpoint.address) : null
    replication_group_port: >-
      'replication-group' in resources ? dyn(resources['replication-group'].spec.port) : null
    replication_group_reader_endpoint_address: >-
      'replication-group' in resources && has(resources['replication-group'].status.nodeGroups)
      && size(resources['replication-group'].status.nodeGroups) > 0
      && has(resources['replication-group'].status.nodeGroups[0].readerEndpoint)
      && has(resources['replication-group'].status.nodeGroups[0].readerEndpoint.address)
      ? dyn(resources['replication-group'].status.nodeGroups[0].readerEndpoint.address) : null
    cloudwatch_log_groups: >-
      resources.filter(k, k.startsWith('log-group-')).transformMapEntry(i, k, {k.substring(10): resources[k].spec.name})
    parameter_group_arn: >-
      'parameter-group' in resources && has(resources['parameter-group'].status.ackResourceMetadata)
      && has(resources['parameter-group'].status.ackResourceMetadata.arn)
      ? dyn(resources['parameter-group'].status.ackResourceMetadata.arn) : null
    parameter_group_id: >-
      'parameter-group' in resources ? dyn(resources['parameter-group'].spec.cacheParameterGroupName) : null
    subnet_group_name: >-
      'subnet-group' in resources ? dyn(resources['subnet-group'].spec.cacheSubnetGroupName) : null
    security_group_id: >-
      'security-group' in resources && has(resources['security-group'].status.id)
      ? dyn(resources['security-group'].status.id) : null
    security_group_arn: >-
      'security-group' in resources && has(resources['security-group'].status.id)
      ? dyn('arn:'
        + (resources['security-group'].status.ackResourceMetadata.region.startsWith('cn-') ? 'aws-cn'
          : (resources['security-group'].status.ackResourceMetadata.region.startsWith('us-gov-') ? 'aws-us-gov' : 'aws'))
        + ':ec2:' + resources['security-group'].status.ackResourceMetadata.region
        + ':' + resources['security-group'].status.ackResourceMetadata.ownerAccountID
        + ':security-group/' + resources['security-group'].status.id)
      : null
