---
# Source: ecs/templates/cluster.yaml
apiVersion: ecs.services.k8s.aws/v1alpha1
kind: Cluster
metadata:
  name: names-cluster
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "names"
    app.kubernetes.io/name: ecs
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "cluster"
spec:
  name: "custom-cluster"
  settings:
    - name: containerInsights
      value: enabled
---
# Source: ecs/templates/cluster.yaml
apiVersion: cloudwatchlogs.services.k8s.aws/v1alpha1
kind: LogGroup
metadata:
  name: names-log-group
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "names"
    app.kubernetes.io/name: ecs
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "log-group"
spec:
  name: "/aws/ecs/custom-cluster"
  retentionDays: 90
