      - subnet-slkjf456
      - subnet-qeiru789
    endpointPrivateAccess: true
    endpointPublicAccess: true
    publicAccessCIDRs:
      - 0.0.0.0/0
  kubernetesNetworkConfig:
    ipFamily: "ipv4"
  encryptionConfig:
    - provider:
        keyRef:
          from:
            name: basic-kms-key
      resources:
        - secrets
  tags:
    Environment: dev
    Terraform: "true"
