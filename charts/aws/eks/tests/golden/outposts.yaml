---
# Source: eks/templates/cluster.yaml
apiVersion: iam.services.k8s.aws/v1alpha1
kind: Role
metadata:
  name: outposts-cluster-role
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "outposts"
    app.kubernetes.io/name: eks
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "cluster-role"
spec:
  name: "outpost-cluster"
  path: "/"
  assumeRolePolicyDocument: "{\"Statement\":[{\"Action\":[\"sts:AssumeRole\",\"sts:TagSession\"],\"Effect\":\"Allow\",\"Principal\":{\"Service\":[\"eks.amazonaws.com\",\"ec2.amazonaws.com\"]},\"Sid\":\"EKSClusterAssumeRole\"}],\"Version\":\"2012-10-17\"}"
  policies:
    - "arn:aws:iam::aws:policy/AmazonEKSLocalOutpostClusterPolicy"
---
# Source: eks/templates/cluster.yaml
apiVersion: eks.services.k8s.aws/v1alpha1
kind: Cluster
metadata:
  name: outposts-cluster
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "outposts"
    app.kubernetes.io/name: eks
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "cluster"
spec:
  name: "outpost"
  roleRef:
    from:
      name: outposts-cluster-role
  accessConfig:
    authenticationMode: "API_AND_CONFIG_MAP"
    bootstrapClusterCreatorAdminPermissions: false
  bootstrapSelfManagedAddons: false
  logging:
    clusterLogging:
      - enabled: true
        types:
          - audit
          - api
          - authenticator
  resourcesVPCConfig:
    securityGroupRefs:
      - from:
          name: outposts-cluster-sg
    subnetIDs:
      - subnet-abcde012
    endpointPrivateAccess: true
    endpointPublicAccess: false
    publicAccessCIDRs:
      - 0.0.0.0/0
  outpostConfig:
    controlPlaneInstanceType: "m5.large"
    controlPlanePlacement:
      groupName: "outpost-pg"
    outpostARNs:
      - arn:aws:outposts:us-west-2:111122223333:outpost/op-0123456789abcdef0
---
# Source: eks/templates/cluster.yaml
apiVersion: cloudwatchlogs.services.k8s.aws/v1alpha1
kind: LogGroup
metadata:
  name: outposts-log-group
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "outposts"
    app.kubernetes.io/name: eks
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "log-group"
spec:
  name: "/aws/eks/outpost/cluster"
  retentionDays: 90
  tags:
    Name: /aws/eks/outpost/cluster
---
# Source: eks/templates/security-groups.yaml
apiVersion: ec2.services.k8s.aws/v1alpha1
kind: SecurityGroup
metadata:
  name: outposts-cluster-sg
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "outposts"
    app.kubernetes.io/name: eks
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "security-group"
spec:
  name: "outpost-cluster"
  description: "EKS cluster security group"
  vpcID: "vpc-1234556abcdef"
  tags:
    - key: "Name"
      value: "outpost-cluster"
---
# Source: eks/templates/security-groups.yaml
apiVersion: ec2.services.k8s.aws/v1alpha1
kind: SecurityGroup
metadata:
  name: outposts-node-sg
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "outposts"
    app.kubernetes.io/name: eks
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "node-security-group"
spec:
  name: "outpost-node"
  description: "EKS node shared security group"
  vpcID: "vpc-1234556abcdef"
  ingressRules:
    - ipProtocol: "tcp"
      fromPort: 10251
      toPort: 10251
      userIDGroupPairs:
        - {"description":"Cluster API to node 10251/tcp webhook","groupRef":{"from":{"name":"outposts-cluster-sg"}}}
    - ipProtocol: "tcp"
      fromPort: 443
      toPort: 443
      userIDGroupPairs:
        - {"description":"Cluster API to node groups","groupRef":{"from":{"name":"outposts-cluster-sg"}}}
    - ipProtocol: "tcp"
      fromPort: 4443
      toPort: 4443
      userIDGroupPairs:
        - {"description":"Cluster API to node 4443/tcp webhook","groupRef":{"from":{"name":"outposts-cluster-sg"}}}
    - ipProtocol: "tcp"
      fromPort: 6443
      toPort: 6443
      userIDGroupPairs:
        - {"description":"Cluster API to node 6443/tcp webhook","groupRef":{"from":{"name":"outposts-cluster-sg"}}}
    - ipProtocol: "tcp"
      fromPort: 8443
      toPort: 8443
      userIDGroupPairs:
        - {"description":"Cluster API to node 8443/tcp webhook","groupRef":{"from":{"name":"outposts-cluster-sg"}}}
    - ipProtocol: "tcp"
      fromPort: 9443
      toPort: 9443
      userIDGroupPairs:
        - {"description":"Cluster API to node 9443/tcp webhook","groupRef":{"from":{"name":"outposts-cluster-sg"}}}
    - ipProtocol: "tcp"
      fromPort: 10250
      toPort: 10250
      userIDGroupPairs:
        - {"description":"Cluster API to node kubelets","groupRef":{"from":{"name":"outposts-cluster-sg"}}}
    - ipProtocol: "tcp"
      fromPort: 1025
      toPort: 65535
      userIDGroupPairs:
        - {"description":"Node to node ingress on ephemeral ports"}
    - ipProtocol: "tcp"
      fromPort: 53
      toPort: 53
      userIDGroupPairs:
        - {"description":"Node to node CoreDNS"}
    - ipProtocol: "udp"
      fromPort: 53
      toPort: 53
      userIDGroupPairs:
        - {"description":"Node to node CoreDNS UDP"}
  egressRules:
    - ipProtocol: "-1"
      ipRanges:
        - {"cidrIP":"0.0.0.0/0","description":"Allow all egress"}
  tags:
    - key: "Name"
      value: "outpost-node"
    - key: "kubernetes.io/cluster/outpost"
      value: "owned"
