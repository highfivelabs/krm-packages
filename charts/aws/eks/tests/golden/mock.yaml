# Source: eks/templates/security-groups.yaml
apiVersion: ec2.services.k8s.aws/v1alpha1
kind: SecurityGroup
metadata:
  name: mock-node-sg
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "mock"
    app.kubernetes.io/name: eks
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "node-security-group"
    services.k8s.aws/region: "us-east-1"
spec:
  name: "catalog-eks-node"
  description: "EKS node shared security group"
  vpcID: "vpc-set-by-mock-set-yaml"
  ingressRules:
    - ipProtocol: "tcp"
      fromPort: 10251
      toPort: 10251
      userIDGroupPairs:
        - {"description":"Cluster API to node 10251/tcp webhook","groupRef":{"from":{"name":"mock-cluster-sg"}}}
    - ipProtocol: "tcp"
      fromPort: 443
      toPort: 443
      userIDGroupPairs:
        - {"description":"Cluster API to node groups","groupRef":{"from":{"name":"mock-cluster-sg"}}}
    - ipProtocol: "tcp"
      fromPort: 4443
      toPort: 4443
      userIDGroupPairs:
        - {"description":"Cluster API to node 4443/tcp webhook","groupRef":{"from":{"name":"mock-cluster-sg"}}}
    - ipProtocol: "tcp"
      fromPort: 6443
      toPort: 6443
      userIDGroupPairs:
        - {"description":"Cluster API to node 6443/tcp webhook","groupRef":{"from":{"name":"mock-cluster-sg"}}}
    - ipProtocol: "tcp"
      fromPort: 8443
      toPort: 8443
      userIDGroupPairs:
        - {"description":"Cluster API to node 8443/tcp webhook","groupRef":{"from":{"name":"mock-cluster-sg"}}}
    - ipProtocol: "tcp"
      fromPort: 9443
      toPort: 9443
      userIDGroupPairs:
        - {"description":"Cluster API to node 9443/tcp webhook","groupRef":{"from":{"name":"mock-cluster-sg"}}}
    - ipProtocol: "tcp"
      fromPort: 10250
      toPort: 10250
      userIDGroupPairs:
        - {"description":"Cluster API to node kubelets","groupRef":{"from":{"name":"mock-cluster-sg"}}}
    - ipProtocol: "tcp"
      fromPort: 1025
      toPort: 65535
      userIDGroupPairs:
        - {"description":"Node to node ingress on ephemeral ports"}
    - ipProtocol: "tcp"
      fromPort: 53
      toPort: 53
      userIDGroupPairs:
        - {"description":"Node to node CoreDNS"}
    - ipProtocol: "udp"
      fromPort: 53
      toPort: 53
      userIDGroupPairs:
        - {"description":"Node to node CoreDNS UDP"}
  egressRules:
    - ipProtocol: "-1"
      ipRanges:
        - {"cidrIP":"0.0.0.0/0","description":"Allow all egress"}
  tags:
    - key: "Name"
      value: "catalog-eks-node"
    - key: "catalog-test"
      value: "true"
    - key: "kubernetes.io/cluster/catalog-eks"
      value: "owned"
