# Source: eks/templates/cluster.yaml
apiVersion: eks.services.k8s.aws/v1alpha1
kind: Cluster
metadata:
  name: auto-cluster
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "auto"
    app.kubernetes.io/name: eks
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "cluster"
spec:
  name: "auto"
  version: "1.33"
  roleRef:
    from:
      name: auto-cluster-role
  accessConfig:
    authenticationMode: "API_AND_CONFIG_MAP"
    bootstrapClusterCreatorAdminPermissions: false
  bootstrapSelfManagedAddons: false
  computeConfig:
    enabled: true
    nodePools:
      - general-purpose
      - system
    nodeRoleARN: "arn:aws:iam::111122223333:role/auto-eks-auto"
  resourcesVPCConfig:
    securityGroupRefs:
      - from:
          name: auto-cluster-sg
    subnetIDs:
      - subnet-abcde012
      - subnet-bcde012a
    endpointPrivateAccess: true
    endpointPublicAccess: true
    publicAccessCIDRs:
      - 0.0.0.0/0
  kubernetesNetworkConfig:
    elasticLoadBalancing:
      enabled: true
    ipFamily: "ipv4"
  storageConfig:
    blockStorage:
      enabled: true
