apiVersion: iam.services.k8s.aws/v1alpha1
kind: Policy
metadata:
  name: auto-auto-mode-policy
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "auto"
    app.kubernetes.io/name: eks
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "auto-mode-policy"
spec:
  name: "auto-cluster"
  path: "/"
  policyDocument: "{\"Statement\":[{\"Action\":[\"ec2:CreateFleet\",\"ec2:RunInstances\",\"ec2:CreateLaunchTemplate\"],\"Condition\":{\"StringEquals\":{\"aws:RequestTag/eks:eks-cluster-name\":[\"${aws:PrincipalTag/eks:eks-cluster-name}\"]},\"StringLike\":{\"aws:RequestTag/eks:kubernetes-node-class-name\":[\"*\"],\"aws:RequestTag/eks:kubernetes-node-pool-name\":[\"*\"]}},\"Effect\":\"Allow\",\"Resource\":[\"*\"],\"Sid\":\"Compute\"},{\"Action\":[\"ec2:CreateVolume\",\"ec2:CreateSnapshot\"],\"Condition\":{\"StringEquals\":{\"aws:RequestTag/eks:eks-cluster-name\":[\"${aws:PrincipalTag/eks:eks-cluster-name}\"]}},\"Effect\":\"Allow\",\"Resource\":[\"arn:aws:ec2:*:*:volume/*\",\"arn:aws:ec2:*:*:snapshot/*\"],\"Sid\":\"Storage\"},{\"Action\":[\"ec2:CreateNetworkInterface\"],\"Condition\":{\"StringEquals\":{\"aws:RequestTag/eks:eks-cluster-name\":[\"${aws:PrincipalTag/eks:eks-cluster-name}\"],\"aws:RequestTag/eks:kubernetes-cni-node-name\":[\"*\"]}},\"Effect\":\"Allow\",\"Resource\":[\"*\"],\"Sid\":\"Networking\"},{\"Action\":[\"elasticloadbalancing:CreateLoadBalancer\",\"elasticloadbalancing:CreateTargetGroup\",\"elasticloadbalancing:CreateListener\",\"elasticloadbalancing:CreateRule\",\"ec2:CreateSecurityGroup\"],\"Condition\":{\"StringEquals\":{\"aws:RequestTag/eks:eks-cluster-name\":[\"${aws:PrincipalTag/eks:eks-cluster-name}\"]}},\"Effect\":\"Allow\",\"Resource\":[\"*\"],\"Sid\":\"LoadBalancer\"},{\"Action\":[\"shield:CreateProtection\"],\"Condition\":{\"StringEquals\":{\"aws:RequestTag/eks:eks-cluster-name\":[\"${aws:PrincipalTag/eks:eks-cluster-name}\"]}},\"Effect\":\"Allow\",\"Resource\":[\"*\"],\"Sid\":\"ShieldProtection\"},{\"Action\":[\"shield:TagResource\"],\"Condition\":{\"StringEquals\":{\"aws:RequestTag/eks:eks-cluster-name\":[\"${aws:PrincipalTag/eks:eks-cluster-name}\"]}},\"Effect\":\"Allow\",\"Resource\":[\"arn:aws:shield::*:protection/*\"],\"Sid\":\"ShieldTagResource\"}],\"Version\":\"2012-10-17\"}"
