# Source: eks/templates/cluster.yaml
apiVersion: eks.services.k8s.aws/v1alpha1
kind: Cluster
metadata:
  name: full-cluster
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "full"
    app.kubernetes.io/name: eks
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "cluster"
    services.k8s.aws/region: "eu-west-1"
spec:
  name: "full"
  version: "1.33"
  roleRef:
    from:
      name: full-cluster-role
  accessConfig:
    authenticationMode: "API"
    bootstrapClusterCreatorAdminPermissions: false
  bootstrapSelfManagedAddons: false
  deletionProtection: false
  logging:
    clusterLogging:
      - enabled: true
        types:
          - api
          - audit
  controlPlaneScalingConfig:
    tier: "tier-xl"
  resourcesVPCConfig:
    controlPlaneEgressMode: "VPC"
    securityGroupRefs:
      - from:
          name: full-cluster-sg
    subnetIDs:
      - subnet-abcde012
      - subnet-bcde012a
    endpointPrivateAccess: true
    endpointPublicAccess: true
    publicAccessCIDRs:
      - 203.0.113.0/24
  kubernetesNetworkConfig:
    ipFamily: "ipv4"
    serviceIPv4CIDR: "172.20.0.0/16"
  kubeSchedulerConfig:
    nodeResourcesFit:
      scoringStrategy:
        type: "MostAllocated"
        resources:
          - name: "cpu"
            weight: 1
          - name: "memory"
  kubeControllerManagerConfig:
    horizontalPodAutoscalerControllerConfig:
      horizontalPodAutoscalerSyncPeriod: "30s"
  kubeAPIServerConfig:
    eventTTL: "2h"
    serviceNodePortRange:
      minPort: 30000
      maxPort: 32767
  encryptionConfig:
    - provider:
        keyARN: "arn:aws:kms:eu-west-1:111122223333:key/1234abcd-12ab-34cd-56ef-1234567890ab"
      resources:
        - secrets
  remoteNetworkConfig:
    remoteNodeNetworks:
      - cidrs:
          - 172.16.0.0/18
    remotePodNetworks:
      - cidrs:
          - 172.16.64.0/18
  upgradePolicy:
    supportType: "STANDARD"
  zonalShiftConfig:
    enabled: true
  tags:
    Cluster: full
    Environment: test
