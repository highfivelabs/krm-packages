    clusterLogging:
      - enabled: true
        types:
          - audit
          - api
          - authenticator
  resourcesVPCConfig:
    securityGroupIDs:
      - sg-0extra
      - sg-0cluster
    subnetIDs:
      - subnet-abcde012
      - subnet-bcde012a
    endpointPrivateAccess: true
    endpointPublicAccess: false
    publicAccessCIDRs:
      - 0.0.0.0/0
  kubernetesNetworkConfig:
    ipFamily: "ipv6"
  encryptionConfig:
    - provider:
        keyARN: "arn:aws:kms:us-east-2:111122223333:key/abcd"
      resources:
        - secrets
