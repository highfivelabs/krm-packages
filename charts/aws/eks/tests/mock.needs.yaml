#
# What tests/mock.values.yaml needs and the chart does not make: a VPC and
# two subnets in two zones (hack/mock-apply-aws.sh applies them first,
# deletes them last).
apiVersion: ec2.services.k8s.aws/v1alpha1
kind: VPC
metadata:
  name: eks-vpc
  annotations:
    services.k8s.aws/region: us-east-1
spec:
  cidrBlocks: [10.41.0.0/16]
  tags:
    - key: catalog-test
      value: "true"
---
apiVersion: ec2.services.k8s.aws/v1alpha1
kind: Subnet
metadata:
  name: eks-subnet-a
  annotations:
    services.k8s.aws/region: us-east-1
spec:
  vpcRef:
    from:
      name: eks-vpc
  cidrBlock: 10.41.1.0/24
  availabilityZone: us-east-1a
  tags:
    - key: catalog-test
      value: "true"
---
apiVersion: ec2.services.k8s.aws/v1alpha1
kind: Subnet
metadata:
  name: eks-subnet-b
  annotations:
    services.k8s.aws/region: us-east-1
spec:
  vpcRef:
    from:
      name: eks-vpc
  cidrBlock: 10.41.2.0/24
  availabilityZone: us-east-1b
  tags:
    - key: catalog-test
      value: "true"
