# Everything at once: a path, a session length, two policies of its own
# beside an AWS managed policy (so their ARNs are built from account_id),
# tags and labels.
name: gsa-full
path: /federated/
description: Every value set
max_session_duration: 7200
account_id: "111122223333"
google_service_account_unique_id: "123456789012345678901"
audience: https://example.com/aws
trust_sid: OnlyTheRunner
policy_arns:
  view: arn:aws:iam::aws:policy/job-function/ViewOnlyAccess
policies:
  a:
    description: Part a
    statements:
      - sid: Logs
        actions: ["logs:CreateLogGroup"]
        resources: ["*"]
  b:
    statements:
      - sid: DenyIam
        effect: Deny
        actions: ["iam:*"]
        resources: ["*"]
        condition:
          - test: StringNotEquals
            variable: aws:RequestedRegion
            values: [us-east-2]
tags: {Environment: test, team: platform}
labels: {team: platform}
