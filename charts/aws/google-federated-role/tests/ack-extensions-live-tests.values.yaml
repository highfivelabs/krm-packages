#
# The instance for ack-extensions' live tests: the role
# ack-extensions-live-tests in the AWS test account, which the offload VMs'
# Google service account assumes for `task test-live` (ack-extensions
# docs/live-runs.md). Deployed through ACK and adopted in place
# (2026-11-16). The policies are ack-extensions' generated
# cloudcontrol/config/live/role-policies.yaml, statement for statement
# (since 2026-11-16 with the ACK-kind suite's actions, HFL-623); the budget
# alarm stays in ack-extensions' CloudFormation stack (no ACK or
# ack-extensions kind serves AWS::Budgets::Budget; README.md).
#
# The service account's unique ID never goes in this repository: the one
# here is a placeholder. Set the real one where the instance is deployed
# (google_service_account_unique_id), as the template took it as a
# parameter. When ack-extensions' liveKinds or live-test actions change,
# copy the statements from its role-policies.yaml and apply the instance
# again (README.md, "The ack-extensions live-test role").
name: ack-extensions-live-tests
description: Assumed only by the offload VMs' Google service account, through web identity federation, for task test-live (ack-extensions docs/live-runs.md).
max_session_duration: 3600
google_service_account_unique_id: "000000000000000000000"
audience: ack-extensions-live-tests
trust_sid: OnlyTheOffloadServiceAccount
tags:
  purpose: ack-extensions-live-tests
