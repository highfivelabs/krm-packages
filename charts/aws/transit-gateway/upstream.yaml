# Module variables the chart keeps in values.yaml (so tfvars convert one to
# one) but refuses when set (to anything but the module's default), or
# accepts only in part. Read by `task coverage`; `task coverage-verify`
# renders the chart to check that each one is refused. kind: gap (no ACK or
# ack-extensions kind or field, or none that can be wired in one render),
# alpha (only an ack-extensions kind, behind allow_alpha), not-ported (ACK
# has it, the chart does not map it yet) or by-design (Bundt replaces it).
# partial: the variable is accepted, the reason says what is not carried.
refused:
- variable: create_tgw_routes
  kind: gap
  reason: "accepted at false (and with no create_tgw and no tgw_routes); true is refused: the transit gateway route table, routes, associations and propagations (ack-extensions' Cloud Control TransitGatewayRouteTable, TransitGatewayRoute and the association kinds) take plain IDs of the gateway and its attachments, known only after apply, with no reference fields"
  partial: true
- variable: enable_encryption_support
  kind: gap
  reason: "ACK's TransitGateway has no encryptionSupport option: true is refused"
- variable: enable_sg_referencing_support
  kind: gap
  reason: "accepted at false only, and not sent; true (the module's default) is refused: ACK's TransitGateway (ec2-controller v1.23.1) has no securityGroupReferencingSupport option"
  partial: true
- variable: ram_allow_external_principals
  kind: gap
  reason: "the RAM share is not ported (share_tgw)"
- variable: ram_name
  kind: gap
  reason: "the RAM share is not ported (share_tgw)"
- variable: ram_principals
  kind: gap
  reason: "the RAM share is not ported (share_tgw)"
- variable: ram_resource_share_arn
  kind: gap
  reason: "the RAM share accepter (aws_ram_resource_share_accepter) has no kind"
- variable: ram_tags
  kind: gap
  reason: "the RAM share is not ported (share_tgw)"
- variable: share_tgw
  kind: gap
  reason: "accepted at false; true is refused: the RAM share's resource association (ACK's ResourceShare.resourceARNs) takes the gateway's ARN, built from its ID, known only after apply, and the share accepter has no kind"
  partial: true
- variable: tgw_default_route_table_tags
  kind: gap
  reason: "tags on the default association route table (aws_ec2_tag) need its ID, which TransitGateway's status does not carry, and ack-extensions' ResourceTag takes a plain resource ID"
- variable: tgw_route_table_tags
  kind: gap
  reason: "the transit gateway route table is not ported (create_tgw_routes)"
- variable: timeouts
  kind: by-design
  reason: "ACK controllers retry until the resource is ready; Bundt sets a component's time limit"
- variable: transit_gateway_route_table_id
  kind: gap
  reason: "route table associations and propagations are not ported (create_tgw_routes): the Cloud Control kinds have no reference fields"
