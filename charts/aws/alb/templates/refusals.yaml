{{- /*
Copyright 2026 High Five Labs
SPDX-License-Identifier: Apache-2.0

The module variables this chart keeps in its values but cannot carry
(upstream.yaml, "refused"): each stops the render, naming the gap, when it
is set to anything but its Terraform default. Renders nothing.
*/ -}}
{{- $v := .Values -}}
{{- include "ack.unsupported" (list $ "enforce_security_group_inbound_rules_on_private_link_traffic" $v.enforce_security_group_inbound_rules_on_private_link_traffic "ACK's LoadBalancer (elbv2-controller v1.10.0) has no field for it (SetSecurityGroups' EnforceSecurityGroupInboundRulesOnPrivateLinkTraffic)") }}
{{- include "ack.unsupported" (list $ "ipam_pools" $v.ipam_pools "ACK's LoadBalancer (elbv2-controller v1.10.0) has no IPAM pools field") }}
{{- include "ack.unsupported" (list $ "minimum_load_balancer_capacity" $v.minimum_load_balancer_capacity "ACK's LoadBalancer (elbv2-controller v1.10.0) has no capacity reservation field (ModifyCapacityReservation)") }}
{{- include "ack.unsupported" (list $ "name_prefix" $v.name_prefix "Terraform appends a random suffix, and a render must not change between plans; give name (namePrefix keeps two Instances' load balancers apart)") }}
{{- include "ack.unsupported" (list $ "timeouts" $v.timeouts "Terraform's create, update and delete timeouts: ACK retries until the load balancer is synced, and Bundt waits for it") }}
{{- include "ack.unsupported" (list $ "route53_records" $v.route53_records "an alias record needs the load balancer's DNS name and zone ID, which exist only in its status, and ACK's RecordSet has no reference to a LoadBalancer; make the records in a route53 component from this one's dns_name and zone_id outputs") }}
