# Source: alb/templates/listeners.yaml
apiVersion: elbv2.services.k8s.aws/v1alpha1
kind: Listener
metadata:
  name: basic-listener-ex-http-https-redirect
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "basic"
    app.kubernetes.io/name: alb
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "listener-ex-http-https-redirect"
spec:
  loadBalancerRef:
    from:
      name: basic-lb
  port: 80
  protocol: "HTTP"
  defaultActions:
    - redirectConfig:
        port: "443"
        protocol: HTTPS
        statusCode: HTTP_301
      type: redirect
  tags:
    - key: "Environment"
      value: "Development"
    - key: "Project"
      value: "Example"
---
# Source: alb/templates/listeners.yaml
apiVersion: elbv2.services.k8s.aws/v1alpha1
kind: Listener
metadata:
  name: basic-listener-ex-https
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "basic"
    app.kubernetes.io/name: alb
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "listener-ex-https"
spec:
  loadBalancerRef:
    from:
      name: basic-lb
  port: 443
  protocol: "HTTPS"
  sslPolicy: "ELBSecurityPolicy-TLS13-1-3-2021-06"
  certificates:
    - certificateARN: "arn:aws:acm:eu-west-1:123456789012:certificate/12345678-1234-1234-1234-123456789012"
  defaultActions:
    - targetGroupRef:
        from:
          name: basic-tg-ex-instance
      type: forward
  tags:
    - key: "Environment"
      value: "Development"
    - key: "Project"
      value: "Example"
---
# Source: alb/templates/load-balancer.yaml
apiVersion: elbv2.services.k8s.aws/v1alpha1
kind: LoadBalancer
metadata:
  name: basic-lb
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "basic"
    app.kubernetes.io/name: alb
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "load-balancer"
spec:
  name: "my-alb"
  type: "application"
  subnets:
    - "subnet-abcde012"
    - "subnet-bcde012a"
  securityGroupRefs:
    - from:
        name: basic-sg
  attributes:
    - key: "access_logs.s3.bucket"
      value: "my-alb-logs"
    - key: "access_logs.s3.enabled"
      value: "true"
    - key: "access_logs.s3.prefix"
      value: ""
    - key: "deletion_protection.enabled"
      value: "false"
    - key: "routing.http.drop_invalid_header_fields.enabled"
      value: "true"
  tags:
    - key: "Environment"
      value: "Development"
    - key: "Project"
      value: "Example"
---
# Source: alb/templates/listeners.yaml
apiVersion: elbv2.services.k8s.aws/v1alpha1
kind: Rule
metadata:
  name: basic-rule-ex-https-ex-fixed
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "basic"
    app.kubernetes.io/name: alb
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "rule-ex-https/ex-fixed"
spec:
  listenerRef:
    from:
      name: basic-listener-ex-https
  priority: 10
  actions:
    - fixedResponseConfig:
        contentType: text/plain
        messageBody: Fixed message
        statusCode: "200"
      type: fixed-response
  conditions:
    - field: path-pattern
      pathPatternConfig:
        values:
        - /onfixed
    - field: http-request-method
      httpRequestMethodConfig:
        values:
        - GET
        - HEAD
  tags:
    - key: "Environment"
      value: "Development"
    - key: "Project"
      value: "Example"
---
# Source: alb/templates/security-group.yaml
apiVersion: ec2.services.k8s.aws/v1alpha1
kind: SecurityGroup
metadata:
  name: basic-sg
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "basic"
    app.kubernetes.io/name: alb
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "security-group"
spec:
  name: "my-alb"
  description: "Security group for my-alb application load balancer"
  vpcID: "vpc-abcde012"
  ingressRules:
    - ipProtocol: "tcp"
      fromPort: 80
      toPort: 80
      ipRanges:
        - {"cidrIP":"0.0.0.0/0","description":"HTTP web traffic"}
    - ipProtocol: "tcp"
      fromPort: 443
      toPort: 443
      ipRanges:
        - {"cidrIP":"0.0.0.0/0","description":"HTTPS web traffic"}
  egressRules:
    - ipProtocol: "-1"
      ipRanges:
        - {"cidrIP":"10.0.0.0/16"}
  tags:
    - key: "Environment"
      value: "Development"
    - key: "Project"
      value: "Example"
---
# Source: alb/templates/target-groups.yaml
apiVersion: elbv2.services.k8s.aws/v1alpha1
kind: TargetGroup
metadata:
  name: basic-tg-ex-instance
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "basic"
    app.kubernetes.io/name: alb
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "target-group-ex-instance"
spec:
  name: "h1"
  targetType: "instance"
  port: 80
  protocol: "HTTP"
  vpcID: "vpc-abcde012"
  healthCheckEnabled: true
  healthyThresholdCount: 3
  healthCheckIntervalSeconds: 30
  matcher:
    httpCode: "200-399"
  healthCheckPath: "/healthz"
  healthCheckPort: "traffic-port"
  healthCheckProtocol: "HTTP"
  healthCheckTimeoutSeconds: 6
  unhealthyThresholdCount: 3
  attributes:
    - key: "deregistration_delay.timeout_seconds"
      value: "10"
    - key: "stickiness.enabled"
      value: "true"
    - key: "stickiness.lb_cookie.duration_seconds"
      value: "3600"
    - key: "stickiness.type"
      value: "lb_cookie"
  targets:
    - id: "i-0f6d38a07d50d080f"
      port: 80
  tags:
    - key: "Environment"
      value: "Development"
    - key: "Project"
      value: "Example"
