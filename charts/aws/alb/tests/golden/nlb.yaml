---
# Source: alb/templates/listeners.yaml
apiVersion: elbv2.services.k8s.aws/v1alpha1
kind: Listener
metadata:
  name: nlb-listener-tcp
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "nlb"
    app.kubernetes.io/name: alb
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "listener-tcp"
spec:
  loadBalancerRef:
    from:
      name: nlb-lb
  port: 80
  protocol: "TCP"
  defaultActions:
    - targetGroupRef:
        from:
          name: nlb-tg-tcp
      type: forward
---
# Source: alb/templates/listeners.yaml
apiVersion: elbv2.services.k8s.aws/v1alpha1
kind: Listener
metadata:
  name: nlb-listener-tls
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "nlb"
    app.kubernetes.io/name: alb
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "listener-tls"
spec:
  loadBalancerRef:
    from:
      name: nlb-lb
  port: 443
  protocol: "TLS"
  sslPolicy: "ELBSecurityPolicy-TLS13-1-3-2021-06"
  alpnPolicy:
    - "HTTP2Preferred"
  certificates:
    - certificateARN: "arn:aws:acm:eu-west-1:123456789012:certificate/abc"
  defaultActions:
    - targetGroupRef:
        from:
          name: nlb-tg-tcp
      type: forward
---
# Source: alb/templates/load-balancer.yaml
apiVersion: elbv2.services.k8s.aws/v1alpha1
kind: LoadBalancer
metadata:
  name: nlb-lb
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "nlb"
    app.kubernetes.io/name: alb
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "load-balancer"
spec:
  name: "my-nlb"
  type: "network"
  subnets:
    - "subnet-abcde012"
    - "subnet-bcde012a"
  securityGroups:
    - "sg-0123456789abcdef0"
  attributes:
    - key: "deletion_protection.enabled"
      value: "false"
    - key: "dns_record.client_routing_policy"
      value: "availability_zone_affinity"
    - key: "load_balancing.cross_zone.enabled"
      value: "true"
---
# Source: alb/templates/target-groups.yaml
apiVersion: elbv2.services.k8s.aws/v1alpha1
kind: TargetGroup
metadata:
  name: nlb-tg-tcp
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "nlb"
    app.kubernetes.io/name: alb
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "target-group-tcp"
spec:
  name: "nlb-tcp"
  targetType: "ip"
  port: 80
  protocol: "TCP"
  vpcID: "vpc-abcde012"
  attributes:
    - key: "preserve_client_ip.enabled"
      value: "true"
    - key: "proxy_protocol_v2.enabled"
      value: "true"
