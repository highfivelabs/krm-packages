# Source: alb/templates/listeners.yaml
apiVersion: elbv2.services.k8s.aws/v1alpha1
kind: Listener
metadata:
  name: full-listener-https
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "full"
    app.kubernetes.io/name: alb
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "listener-https"
    services.k8s.aws/region: "eu-west-1"
spec:
  loadBalancerRef:
    from:
      name: full-lb
  port: 443
  protocol: "HTTPS"
  sslPolicy: "ELBSecurityPolicy-TLS13-1-2-2021-06"
  certificates:
    - certificateARN: "arn:aws:acm:eu-west-1:123456789012:certificate/abc"
  mutualAuthentication:
    mode: "verify"
    ignoreClientCertificateExpiry: false
    trustStoreARN: "arn:aws:elasticloadbalancing:eu-west-1:123456789012:truststore/ts/1"
  defaultActions:
    - forwardConfig:
        targetGroupStickinessConfig:
          durationSeconds: 3600
          enabled: true
        targetGroups:
        - targetGroupRef:
            from:
              name: full-tg-ip
          weight: 80
        - targetGroupARN: arn:aws:elasticloadbalancing:eu-west-1:123456789012:targetgroup/other/1
          weight: 20
      type: forward
---
# Source: alb/templates/load-balancer.yaml
apiVersion: elbv2.services.k8s.aws/v1alpha1
kind: LoadBalancer
metadata:
  name: full-lb
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "full"
    app.kubernetes.io/name: alb
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "load-balancer"
    services.k8s.aws/region: "eu-west-1"
spec:
  name: "full-alb"
  type: "application"
  scheme: "internal"
  ipAddressType: "dualstack"
  subnetMappings:
    - subnetID: "subnet-abcde012"
      privateIPv4Address: "10.0.1.10"
    - subnetID: "subnet-bcde012a"
  securityGroupRefs:
    - from:
        name: full-sg
  attributes:
    - key: "client_keep_alive.seconds"
      value: "7200"
    - key: "connection_logs.s3.bucket"
      value: "conn-logs"
    - key: "connection_logs.s3.enabled"
      value: "true"
    - key: "connection_logs.s3.prefix"
      value: "full"
    - key: "deletion_protection.enabled"
      value: "true"
    - key: "health_check_logs.s3.bucket"
      value: "hc-logs"
    - key: "health_check_logs.s3.enabled"
      value: "false"
    - key: "health_check_logs.s3.prefix"
      value: ""
    - key: "idle_timeout.timeout_seconds"
      value: "120"
    - key: "routing.http.desync_mitigation_mode"
      value: "strictest"
    - key: "routing.http.drop_invalid_header_fields.enabled"
      value: "true"
    - key: "routing.http.preserve_host_header.enabled"
      value: "true"
    - key: "routing.http.x_amzn_tls_version_and_cipher_suite.enabled"
      value: "true"
    - key: "routing.http.xff_client_port.enabled"
      value: "true"
    - key: "routing.http.xff_header_processing.mode"
      value: "preserve"
    - key: "routing.http2.enabled"
      value: "false"
    - key: "waf.fail_open.enabled"
      value: "true"
    - key: "zonal_shift.config.enabled"
      value: "true"
