apiVersion: ec2.services.k8s.aws/v1alpha1
kind: SecurityGroup
metadata:
  name: full-sg
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "full"
    app.kubernetes.io/name: alb
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "security-group"
    services.k8s.aws/region: "eu-west-1"
spec:
  name: "full-alb-lb"
  description: "The load balancer's group"
  vpcID: "vpc-abcde012"
  ingressRules:
    - ipProtocol: "tcp"
      fromPort: 443
      toPort: 443
      ipRanges:
        - {"cidrIP":"10.0.0.0/16"}
  tags:
    - key: "Tier"
      value: "edge"
