# Source: alb/templates/listeners.yaml
apiVersion: elbv2.services.k8s.aws/v1alpha1
kind: Rule
metadata:
  name: full-rule-https-cognito
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "full"
    app.kubernetes.io/name: alb
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "rule-https/cognito"
    services.k8s.aws/region: "eu-west-1"
spec:
  listenerRef:
    from:
      name: full-listener-https
  priority: 2
  actions:
    - authenticateCognitoConfig:
        sessionTimeout: 3600
        userPoolARN: arn:aws:cognito-idp:eu-west-1:123456789012:userpool/eu-west-1_abc
        userPoolClientID: clientid
        userPoolDomain: auth.example.com
      type: authenticate-cognito
    - redirectConfig:
        host: www.example.com
        path: /#{path}
        query: '#{query}'
        statusCode: HTTP_302
      type: redirect
  conditions:
    - field: path-pattern
      pathPatternConfig:
        values:
        - /login
---
# Source: alb/templates/listeners.yaml
apiVersion: elbv2.services.k8s.aws/v1alpha1
kind: Rule
metadata:
  name: full-rule-https-oidc
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "full"
    app.kubernetes.io/name: alb
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "rule-https/oidc"
    services.k8s.aws/region: "eu-west-1"
spec:
  listenerRef:
    from:
      name: full-listener-https
  priority: 1
  actions:
    - authenticateOIDCConfig:
        authenticationRequestExtraParams:
          display: page
        authorizationEndpoint: https://idp.example.com/authorize
        clientID: client
        clientSecret: secret
        issuer: https://idp.example.com
        tokenEndpoint: https://idp.example.com/token
        userInfoEndpoint: https://idp.example.com/userinfo
      order: 1
      type: authenticate-oidc
    - order: 2
      targetGroupRef:
        from:
          name: full-tg-lambda
      type: forward
  conditions:
    - field: host-header
      hostHeaderConfig:
        values:
        - app.example.com
    - field: http-header
      httpHeaderConfig:
        httpHeaderName: X-Forwarded-For
        values:
        - 192.168.1.*
    - field: query-string
      queryStringConfig:
        values:
        - key: q
          value: "1"
        - value: bar
    - field: source-ip
      sourceIPConfig:
        values:
        - 10.0.0.0/8
  tags:
    - key: "Rule"
      value: "oidc"
---
