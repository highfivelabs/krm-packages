synced: 2026-11-16
# Module variables the chart keeps in values.yaml (so tfvars convert one to
# one) but refuses when set (to anything but the module's default), or
# accepts only in part. Read by `task coverage`; `task coverage-verify`
# renders the chart to check that each one is refused. kind: gap (no ACK or
# ack-extensions kind or field), not-ported (ACK has it, the chart does not
# map it yet) or by-design (Bundt replaces it). partial: the variable is
# accepted, the reason says what is not carried.
refused:
- variable: associate_web_acl
  kind: gap
  reason: "ack-extensions' WebACLAssociation takes the load balancer's ARN only as a string, with no reference to the LoadBalancer this render makes"
- variable: enforce_security_group_inbound_rules_on_private_link_traffic
  kind: gap
  reason: "ACK's LoadBalancer (elbv2-controller v1.10.0) has no field for it"
- variable: ipam_pools
  kind: gap
  reason: "ACK's LoadBalancer (elbv2-controller v1.10.0) has no IPAM pools field"
- variable: listeners
  kind: gap
  reason: "accepted, but the listener attributes (routing_http_*, tcp_idle_timeout_seconds), additional_certificate_arns, mutual_authentication.advertise_trust_store_ca_names, jwt_validation actions, rule transforms and regex_values conditions have no ACK field and are refused; a rule needs priority (ACK requires it)"
  partial: true
  fields:
  - additional_certificate_arns
  - jwt_validation
  - mutual_authentication.advertise_trust_store_ca_names
  - routing_http_*
  - rules.conditions.*.regex_values
  - rules.priority
  - rules.transform
  - tcp_idle_timeout_seconds
- variable: minimum_load_balancer_capacity
  kind: gap
  reason: "ACK's LoadBalancer (elbv2-controller v1.10.0) has no capacity reservation field"
- variable: name
  kind: gap
  reason: "accepted, and required: unset (with name_prefix unset), Terraform generates a name, which would change between renders"
  partial: true
- variable: name_prefix
  kind: gap
  reason: "Terraform appends a random suffix, and a render must not change between plans; give name (namePrefix keeps two Instances' load balancers apart)"
- variable: route53_records
  kind: gap
  reason: "an alias record needs the load balancer's DNS name and zone ID, which exist only in its status, and ACK's RecordSet has no reference to a LoadBalancer; make the records in a route53 component from this one's dns_name and zone_id outputs"
- variable: security_group_egress_rules
  kind: gap
  reason: "accepted, but each rule's name and tags are not carried: ACK keeps a group's rules inline in SecurityGroup, which has no per-rule tags"
  partial: true
  fields:
  - name
  - tags
- variable: security_group_ingress_rules
  kind: gap
  reason: "accepted, but each rule's name and tags are not carried: ACK keeps a group's rules inline in SecurityGroup, which has no per-rule tags"
  partial: true
  fields:
  - name
  - tags
- variable: security_group_use_name_prefix
  kind: gap
  reason: "accepted: true (the default) names the group as given, without Terraform's random suffix, since a render must not change between plans; the namePrefix value keeps two Instances' groups apart"
  partial: true
- variable: security_groups
  kind: gap
  reason: "accepted with create_security_group: false; with the chart's own group it is refused, since ACK's LoadBalancer cannot take group references and IDs together"
  partial: true
- variable: target_groups
  kind: gap
  reason: "accepted, but each group needs name (name_prefix, a random suffix, is refused), and attach_lambda_permission is refused: ack-extensions' Lambda Permission cannot reference the target group this render makes (the lambda_* fields go with it)"
  partial: true
  fields:
  - attach_lambda_permission
  - lambda_action
  - lambda_event_source_token
  - lambda_principal
  - lambda_qualifier
  - lambda_source_account
  - lambda_statement_id
  - name_prefix
- variable: timeouts
  kind: by-design
  reason: "Terraform's create, update and delete timeouts: ACK retries until the load balancer is synced, and Bundt waits for it"
- variable: vpc_id
  kind: gap
  reason: "accepted when set; unset with create_security_group: true (Terraform's default VPC) is refused: ACK's SecurityGroup needs its VPC's ID"
  partial: true
- variable: web_acl_arn
  kind: gap
  reason: "used only with associate_web_acl, which is refused"
