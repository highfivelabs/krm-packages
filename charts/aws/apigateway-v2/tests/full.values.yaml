account_id: "123456789012"
region: us-east-1
labels:
  team: platform
name: orders-api
description: Orders HTTP API
protocol_type: HTTP
disable_execute_api_endpoint: true
cors_configuration:
  allow_origins: ["https://app.example.com"]
  allow_methods: ["GET", "POST"]
  allow_headers: ["Authorization"]
  max_age: 300
authorizers:
  jwt:
    authorizer_type: JWT
    identity_sources: ["$request.header.Authorization"]
    jwt_configuration:
      audience: ["orders"]
      issuer: https://auth.example.com/
vpc_links:
  private:
    subnet_ids: ["subnet-1111", "subnet-2222"]
    security_group_ids: ["sg-1111"]
routes:
  "GET /orders":
    authorizer_key: jwt
    authorization_type: JWT
    throttling_burst_limit: 100
    throttling_rate_limit: 50
    integration:
      type: HTTP_PROXY
      method: GET
      uri: http://internal-alb.example.com/orders
      connection_type: VPC_LINK
      vpc_link_key: private
      payload_format_version: "1.0"
stage_name: "$default"
stage_access_log_settings:
  create_log_group: true
  log_group_retention_in_days: 14
  format: '{"requestId":"$context.requestId"}'
stage_variables:
  env: prod
domain_name: api.example.com
domain_name_certificate_arn: arn:aws:acm:us-east-1:123456789012:certificate/abc
api_mapping_key: v1
tags:
  env: prod
