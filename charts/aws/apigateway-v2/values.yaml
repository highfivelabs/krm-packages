#
# Values mirror the Terraform variables of terraform-aws-modules' apigateway-v2
# module (v6.1.1): same names, types and defaults, so a module block's
# arguments become a values file one to one. values.schema.json carries the
# types. A variable the chart cannot carry stays here and stops the render
# when set (upstream.yaml lists them; README.md says why).

names: {}
namePrefix: ""
labels: {}
deletion_policy: DELETE
partition: aws
account_id: null

# The module's variables, in its order, with its defaults.
create: true
region: null
tags: {}

api_key_selection_expression: null
cors_configuration: null
credentials_arn: null
description: null
disable_execute_api_endpoint: null
fail_on_warnings: null
ip_address_type: null
name: ""
body: null
protocol_type: "HTTP"
route_key: null
route_selection_expression: null
target: null
api_version: null
api_mapping_key: null

authorizers: {}

create_domain_name: true
domain_name: ""
hosted_zone_name: null
private_zone: false
domain_name_certificate_arn: null
domain_name_ownership_verification_certificate_arn: null
mutual_tls_authentication: {}

create_domain_records: true
subdomains: []
subdomain_record_types: ["A", "AAAA"]

create_certificate: true

create_routes_and_integrations: true
routes: {}

create_stage: true
stage_access_log_settings: {}
stage_client_certificate_id: null
stage_default_route_settings: {}
stage_description: null
stage_name: "$default"
stage_variables: {}
stage_tags: {}

deploy_stage: true

vpc_links: {}
vpc_link_tags: {}
