---
# Source: estate-read/templates/role.yaml
apiVersion: iam.services.k8s.aws/v1alpha1
kind: Role
metadata:
  name: mock-role
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "mock"
    app.kubernetes.io/name: estate-read
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "role"
spec:
  name: "catalog-estate-read"
  path: "/"
  description: "Read-only inventory for Bundt's estate collector; no data reads, no writes."
  assumeRolePolicyDocument: "{\"Statement\":[{\"Action\":[\"sts:AssumeRole\"],\"Effect\":\"Allow\",\"Principal\":{\"AWS\":[\"arn:aws:iam::000000000000:role/catalog-estate-collector\"]},\"Sid\":\"Collector\"}],\"Version\":\"2012-10-17\"}"
  maxSessionDuration: 3600
  policies:
    - "arn:aws:iam::000000000000:policy/catalog-estate-read-cloud-control"
    - "arn:aws:iam::aws:policy/job-function/ViewOnlyAccess"
  tags:
    - key: "catalog-test"
      value: "true"
---
# Source: estate-read/templates/role.yaml
apiVersion: iam.services.k8s.aws/v1alpha1
kind: Policy
metadata:
  name: mock-policy-cloud-control
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "mock"
    app.kubernetes.io/name: estate-read
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "policy:cloud-control"
spec:
  name: "catalog-estate-read-cloud-control"
  path: "/"
  description: "Cloud Control's read actions, for Bundt's estate collector"
  policyDocument: "{\"Statement\":[{\"Action\":[\"cloudformation:GetResource\",\"cloudformation:ListResources\"],\"Effect\":\"Allow\",\"Resource\":[\"*\"],\"Sid\":\"CloudControlRead\"}],\"Version\":\"2012-10-17\"}"
  tags:
    - key: "catalog-test"
      value: "true"
