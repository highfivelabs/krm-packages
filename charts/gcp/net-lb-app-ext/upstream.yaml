# Module variables the chart keeps in values.yaml (so tfvars convert one to
# one) but refuses when set, or accepts only in part. Read by `task
# coverage`; `task coverage-verify` renders the chart to check that each one
# is refused. kind: gap (no Config Connector kind or field) or by-design
# (Bundt replaces it). partial: the variable is accepted, the reason says
# what is refused.
refused:
  - variable: context
    kind: by-design
    reason: "Bundt replaces fabric's $context lookups with ${...} expressions and valueFrom in the component's inputs"
  - variable: backend_service_configs
    kind: gap
    reason: "ComputeBackendService has no tlsSettings, no backend preference, no awsV4Authentication in securitySettings, and no optionalMode or optionalFields in logConfig"
    partial: true
    fields: [tls_settings, preferred, aws_v4_authentication, optional_mode, optional_fields]
  - variable: neg_configs
    kind: gap
    reason: "ComputeRegionNetworkEndpointGroup has no serverlessDeployment; an internet NEG's endpoints are Config Connector's ComputeGlobalNetworkEndpoint, which is v1alpha1: needs allow_alpha: true"
    partial: true
    fields: [serverless_deployment]
  - variable: urlmap_config
    kind: gap
    reason: "ComputeURLMap's pathRule and routeRules have no customErrorResponsePolicy"
    partial: true
    fields: [custom_error_response_policy]
