apiVersion: v2
name: net-lb-app-ext
description: >-
  A global external Application Load Balancer, classic or
  EXTERNAL_MANAGED: global forwarding rules, an HTTP or HTTPS proxy with
  its SSL certificates, a URL map, backend services and buckets, health
  checks, optional instance groups and network endpoint groups, as Config
  Connector objects. A port of Cloud Foundation Fabric's net-lb-app-ext
  module.
type: application
