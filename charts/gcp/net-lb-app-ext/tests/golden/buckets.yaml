---
# Source: net-lb-app-ext/templates/main.yaml
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeBackendBucket
metadata:
  name: buckets-bucket-default
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "buckets"
    app.kubernetes.io/name: net-lb-app-ext
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "backend_bucket:default"
    cnrm.cloud.google.com/project-id: "my-project"
spec:
  resourceID: "glb-test-0-default"
  bucketRef:
    external: "my-bucket"
  compressionMode: "AUTOMATIC"
  customResponseHeaders: ["X-Cache: {cdn_cache_status}"]
  edgeSecurityPolicy: "projects/my-project/global/securityPolicies/edge"
  enableCdn: true
  cdnPolicy:
    cacheMode: "CACHE_ALL_STATIC"
    clientTtl: 3600
    defaultTtl: 3600
    maxTtl: 86400
    negativeCaching: true
    requestCoalescing: true
    serveWhileStale: 60
    signedUrlCacheMaxAgeSec: 0
    bypassCacheOnRequestHeaders:
      - headerName: "x-no-cache"
    cacheKeyPolicy:
      includeHttpHeaders: ["x-variant"]
      queryStringWhitelist: ["v"]
    negativeCachingPolicy:
      - code: 404
        ttl: 60
---
# Source: net-lb-app-ext/templates/backend-service.yaml
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeBackendService
metadata:
  name: buckets-bs-app
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "buckets"
    app.kubernetes.io/name: net-lb-app-ext
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "backend_service:app"
    cnrm.cloud.google.com/project-id: "my-project"
spec:
  resourceID: "glb-test-0-app"
  location: "global"
  description: "Terraform managed."
  loadBalancingScheme: "EXTERNAL"
  protocol: "HTTP"
  healthChecks:
    - healthCheckRef:
        name: buckets-hc-default
  portName: "http"
  backend:
    - balancingMode: "UTILIZATION"
      capacityScaler: 1
      description: "Terraform managed."
      group:
        instanceGroupRef:
          external: "projects/my-project/zones/europe-west8-b/instanceGroups/my-ig-b"
---
# Source: net-lb-app-ext/templates/main.yaml
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeForwardingRule
metadata:
  name: buckets-fr
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "buckets"
    app.kubernetes.io/name: net-lb-app-ext
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "forwarding_rule:"
    cnrm.cloud.google.com/project-id: "my-project"
spec:
  resourceID: "glb-test-0"
  location: global
  description: "Terraform managed."
  ipVersion: IPV4
  ipProtocol: TCP
  loadBalancingScheme: EXTERNAL
  portRange: "80"
  target:
    targetHTTPProxyRef:
      name: buckets
---
