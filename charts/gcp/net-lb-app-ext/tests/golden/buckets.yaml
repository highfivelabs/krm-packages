    cnrm.cloud.google.com/project-id: "my-project"
spec:
  resourceID: "glb-test-0"
  location: global
  description: "Terraform managed."
  urlMapRef:
    name: buckets
---
# Source: net-lb-app-ext/templates/urlmap.yaml
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeURLMap
metadata:
  name: buckets
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "buckets"
    app.kubernetes.io/name: net-lb-app-ext
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "url_map"
    cnrm.cloud.google.com/project-id: "my-project"
spec:
  resourceID: "glb-test-0"
  location: "global"
  description: "Terraform managed."
  defaultService:
    backendBucketRef:
      name: buckets-bucket-default
  defaultCustomErrorResponsePolicy:
    errorServiceRef:
      name: buckets-bucket-default
    errorResponseRule:
      - matchResponseCodes:
        - 5xx
        overrideResponseCode: 502
        path: /errors/5xx.html
  hostRule:
    - hosts: ["*"]
      pathMatcher: "main"
  pathMatcher:
    - name: "main"
      defaultService:
        backendServiceRef:
          name: buckets-bs-app
      defaultCustomErrorResponsePolicy:
        errorServiceRef:
          name: buckets-bucket-default
        errorResponseRule:
          - matchResponseCodes:
            - "404"
            path: /errors/404.html
      pathRule:
        - paths: ["/static/*"]
          service:
            backendBucketRef:
              name: buckets-bucket-default
        - paths: ["/legacy/*"]
          service:
            backendBucketRef:
              external: "projects/my-project/global/backendBuckets/legacy"
  test:
    - host: "example.org"
      path: "/static/a.css"
      service:
        backendBucketRef:
          name: buckets-bucket-default
