# Source: net-lb-app-ext/templates/backend-service.yaml
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeBackendService
metadata:
  name: full-bs-default
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "full"
    app.kubernetes.io/name: net-lb-app-ext
    app.kubernetes.io/version: "0.1.0"
    env: "test"
  annotations:
    hfl.dev/id: "backend_service:default"
    cnrm.cloud.google.com/project-id: "my-project"
    cnrm.cloud.google.com/deletion-policy: abandon
spec:
  resourceID: "glb-full-default"
  location: "global"
  description: "Default service."
  loadBalancingScheme: "EXTERNAL_MANAGED"
  protocol: "HTTPS"
  healthChecks:
    - healthCheckRef:
        name: full-hc-default
    - healthCheckRef:
        external: "projects/my-project/global/healthChecks/other"
  affinityCookieTtlSec: 60
  compressionMode: "AUTOMATIC"
  connectionDrainingTimeoutSec: 30
  customRequestHeaders: ["X-Client-Geo: {client_region}"]
  customResponseHeaders: ["X-Cache: {cdn_cache_status}"]
  enableCdn: true
  localityLbPolicy: "RING_HASH"
  portName: "http"
  securityPolicyRef:
    external: "projects/my-project/global/securityPolicies/waf"
  sessionAffinity: "STRONG_COOKIE_AFFINITY"
  timeoutSec: 20
  backend:
    - balancingMode: "UTILIZATION"
      capacityScaler: 0.5
      description: "The group."
      group:
        instanceGroupRef:
          name: full-group-ig
      maxConnections: 100
      maxUtilization: 0.8
    - balancingMode: "UTILIZATION"
      capacityScaler: 1
      description: "Terraform managed."
      group:
        instanceGroupRef:
          name: full-group-ig2
      maxConnectionsPerInstance: 10
  cdnPolicy:
    cacheMode: "USE_ORIGIN_HEADERS"
    clientTtl: 60
    defaultTtl: 60
    maxTtl: 600
    negativeCaching: true
    serveWhileStale: 30
    signedUrlCacheMaxAgeSec: 120
    bypassCacheOnRequestHeaders:
      - headerName: "x-bypass"
    cacheKeyPolicy:
      includeHost: true
      includeNamedCookies: ["c"]
      includeProtocol: true
      includeQueryString: true
      queryStringBlacklist: ["utm"]
    negativeCachingPolicy:
      - code: 404
        ttl: 30
  circuitBreakers:
    maxConnections: 100
    maxPendingRequests: 10
    maxRequests: 1000
    maxRequestsPerConnection: 5
    maxRetries: 3
    connectTimeout:
      seconds: 5
      nanos: 100
  consistentHash:
    minimumRingSize: 1024
    httpCookie:
      name: "sticky"
      path: "/"
      ttl:
        seconds: 3600
  iap:
    oauth2ClientId: "client-id"
    oauth2ClientSecret:
      valueFrom:
        secretKeyRef:
          name: "iap"
          key: "secret"
    oauth2ClientSecretSha256: "abc"
  logConfig:
    enable: true
    sampleRate: 0.5
  outlierDetection:
    consecutiveErrors: 5
    consecutiveGatewayFailure: 3
    enforcingConsecutiveErrors: 100
    enforcingConsecutiveGatewayFailure: 100
    enforcingSuccessRate: 100
    maxEjectionPercent: 50
    successRateMinimumHosts: 5
    successRateRequestVolume: 100
    successRateStdevFactor: 1900
    baseEjectionTime:
      seconds: 30
    interval:
      seconds: 10
      nanos: 0
  securitySettings:
    clientTLSPolicyRef:
      external: "projects/my-project/locations/global/clientTlsPolicies/ctp"
    subjectAltNames: ["spiffe://example"]
