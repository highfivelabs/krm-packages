# fabric's README, "Backend buckets" with CDN, and a URL map sending
# /static to the bucket, with a custom error response policy served from
# it.
name: glb-test-0
project_id: my-project
backend_buckets_config:
  default:
    bucket_name: my-bucket
    enable_cdn: true
    compression_mode: AUTOMATIC
    custom_response_headers: ["X-Cache: {cdn_cache_status}"]
    edge_security_policy: projects/my-project/global/securityPolicies/edge
    cdn_policy:
      cache_mode: CACHE_ALL_STATIC
      client_ttl: 3600
      default_ttl: 3600
      max_ttl: 86400
      negative_caching: true
      request_coalescing: true
      serve_while_stale: 60
      signed_url_cache_max_age_sec: 0
      bypass_cache_on_request_headers: [x-no-cache]
      cache_key_policy: {include_http_headers: [x-variant], query_string_whitelist: [v]}
      negative_caching_policy: {code: 404, ttl: 60}
backend_service_configs:
  app:
    backends:
      - group: projects/my-project/zones/europe-west8-b/instanceGroups/my-ig-b
urlmap_config:
  default_service: default
  default_custom_error_response_policy:
    error_service: default
    error_response_rules:
      - {match_response_codes: [5xx], path: /errors/5xx.html, override_response_code: 502}
  host_rules:
    - {hosts: ["*"], path_matcher: main}
  path_matchers:
    main:
      default_service: app
      default_custom_error_response_policy:
        error_service: default
        error_response_rules:
          - {match_response_codes: ["404"], path: /errors/404.html}
      path_rules:
        - {paths: [/static/*], service: default}
        - {paths: [/legacy/*], service: projects/my-project/global/backendBuckets/legacy}
  test:
    - {host: example.org, path: /static/a.css, service: default}
