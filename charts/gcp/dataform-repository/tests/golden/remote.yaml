---
# Source: dataform-repository/templates/main.yaml
apiVersion: dataform.cnrm.cloud.google.com/v1beta1
kind: DataformRepository
metadata:
  name: remote
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "remote"
    app.kubernetes.io/name: dataform-repository
    app.kubernetes.io/version: "0.2.0"
  annotations:
    hfl.dev/id: "repository"
    cnrm.cloud.google.com/project-id: "my-project"
spec:
  projectRef:
    external: "my-project"
  region: "europe-west1"
  resourceID: "my-remote"
  serviceAccountRef:
    external: "dataform@my-project.iam.gserviceaccount.com"
  gitRemoteSettings:
    url: "https://github.com/example/dataform.git"
    defaultBranch: "main"
    authenticationTokenSecretVersionRef:
      external: "projects/my-project/secrets/my-token/versions/1"
