#
# Values mirror the Terraform variables of fabric's dataform-repository
# module (v60.0.0): same names, types and defaults, so a module block's
# arguments become this file one to one (README.md, "From Terraform").
# values.schema.json carries the types.

# Names, labels and tags (docs/design.md, "Names, labels and tags"). Not
# Terraform variables: Bundt supplies names from a team's naming convention
# and stamps its identity labels; the chart takes them and computes none.
#
# names.repository sets the repository's name in full (else name).
names: {}
# An optional convenience: "<namePrefix>-" in front of the repository's
# name when names.repository is not set. Empty (the default) changes
# nothing.
namePrefix: ""
# Kubernetes labels on every object. A repository takes no Google Cloud
# labels through Config Connector.
labels: {}
# Cloud labels: DataformRepository has no labels field, so they stay on the
# objects' metadata.labels.
tags: {}

# IAM bindings in {ROLE => [MEMBERS]} format.
iam: {}
# Authoritative IAM bindings in {KEY => {role = ROLE, members = [],
# condition = {}}}. Keys are arbitrary.
iam_bindings: {}
# Individual additive IAM bindings. Keys are arbitrary.
iam_bindings_additive: {}
# Name of the dataform repository.
name: ""
# Id of the project where resources will be created.
project_id: ""
# The repository's region.
region: ""
# Remote settings required to attach the repository to a remote repository:
# url, branch (main), secret_version (v1: the Secret Manager secret version
# holding the token, as fabric passes it), secret_name (accepted and not
# used, as fabric does). token is refused.
remote_repository_settings: null
# Service account used to execute the dataform workflow.
service_account: ""

# Not a fabric variable: no kind of this chart is alpha any more
# (config-connector-extensions' IAMMember is v1beta1 since 81c3f9b5); kept
# so components that set it still render, it changes nothing.
allow_alpha: false
# Not a fabric variable: DELETE (the default) or ABANDON, which keeps the
# repository when the component is deleted. PREVENT has no Config Connector
# equivalent.
deletion_policy: null
