# For the fake cloud (hack/mock-apply.sh): a small PostgreSQL instance with
# one database and one BUILT_IN user, deletable. The root and user
# passwords are references to the Secret below, which hack/test-secret.sh
# makes in the test's namespace before the apply (docs/secrets.md).
# secret: catalog-mock-sql random
project_id: mock-project
prefix: catalog
name: mock-sql
region: us-central1
database_version: POSTGRES_16
tier: db-custom-1-3840
gcp_deletion_protection: false
network_config:
  connectivity:
    public_ipv4: true
databases: [app]
root_password:
  password: {secretName: catalog-mock-sql, key: value}
users:
  app: {password: {secretName: catalog-mock-sql, key: value}}
