# Passwords as references to Kubernetes Secrets (docs/secrets.md): a SQL
# Server instance with its root password and a BUILT_IN user.
project_id: myproject
name: reports
region: europe-west1
database_version: SQLSERVER_2019_STANDARD
tier: db-custom-2-7680
network_config:
  connectivity:
    public_ipv4: true
root_password:
  password: {secretName: reports-sql, key: root}
users:
  reporting: {password: {secretName: reports-sql, key: reporting}, password_version: 1}
