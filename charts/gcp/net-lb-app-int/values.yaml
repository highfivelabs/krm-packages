# Values mirror the Terraform variables of fabric's net-lb-app-int module
# (v60.0.0): same names, types and defaults, so a module block's arguments
# become this file one to one (README.md, "From Terraform").
# values.schema.json carries the types.

# Names, labels and tags (docs/design.md, "Names, labels and tags"). Not
# Terraform variables: Bundt supplies names from a team's naming convention
# and stamps its identity labels; the chart takes them and computes none.
#
# names.targetProxy and names.urlMap set those cloud names in full (else
# fabric's: the proxy config's name, or name). The forwarding rule and the
# service attachment are named name; backend services, health checks,
# certificates, groups and network endpoint groups in their own entries
# (the entry's name, or <name>-<key>, with the namePrefix).
names: {}
# An optional convenience: "<namePrefix>-" in front of every name the chart
# derives or is given in an entry, never one set under names. Empty (the
# default) changes nothing.
namePrefix: ""
# fabric's labels: Kubernetes labels on every object. An unprefixed key also
# becomes a Google Cloud label (the forwarding rule takes labels; the other
# resources none), so it must be a valid one.
labels: {}
# Cloud labels on every resource that takes them (the forwarding rule).
tags: {}

# Optional IP address used for the forwarding rule: an IP, or an address's
# ID or self link.
address: null
# Backend service level configuration, by key.
backend_service_configs: {}
# Context-specific interpolations. Refused when set: Bundt expressions
# (${...}) and valueFrom replace fabric's $context lookups.
context: {}
# Optional description used for resources.
description: Terraform managed.
# Allow client access from all regions.
global_access: null
# Optional unmanaged groups to create. Can be referenced in backends via key
# or outputs.
group_configs: {}
# Optional auto-created health check configurations, by key. null (the
# default) is fabric's default, {default: {http: {port_specification:
# USE_SERVING_PORT}}}; {} creates none. An entry with is_regional: true is
# a regional health check.
health_check_configs: null
# HTTP proxy configuration.
http_proxy_config: {}
# HTTPS proxy configuration.
https_proxy_config: {}
# Load balancer name.
name: ""
# Optional network endpoint groups to create. Can be referenced in backends
# via key or outputs.
neg_configs: {}
# Use premium network tier. Defaults to true.
network_tier_premium: true
# Optional ports for the forwarding rule (at most one).
ports: null
# Project id.
project_id: ""
# Protocol supported by this load balancer: HTTP or HTTPS.
protocol: HTTP
# The region where to allocate the ILB resources.
region: ""
# PSC service attachment.
service_attachment: null
# Service directory namespace and service used to register this load
# balancer. Refused when set: ComputeForwardingRule's
# serviceDirectoryRegistrations takes a service only.
service_directory_registration: null
# SSL target proxy certificates (only if protocol is HTTPS): certificate_ids
# (existing) and create_configs ({name, certificate, private_key}, the
# private key a reference to a Kubernetes Secret, {secretName, key}:
# docs/secrets.md).
ssl_certificates: {}
# The URL map configuration. null (the default) is fabric's default,
# {default_service: default}.
urlmap_config: null
# VPC-level configuration: {network, subnetwork}.
vpc_config: {}

# Not a fabric variable: accept alpha (v1alpha1) kinds, here
# config-connector-extensions' ComputeRegionNetworkEndpoint for internet
# NEG endpoints (docs/design.md, "Alpha kinds").
allow_alpha: false
# Not a fabric variable: DELETE (the default) or ABANDON, which keeps the
# load balancer's resources when the component is deleted. PREVENT has no
# Config Connector equivalent.
deletion_policy: null
