  loadBalancingScheme: "INTERNAL_MANAGED"
  protocol: "HTTPS"
  healthChecks:
    - healthCheckRef:
        name: full-hc-default
    - healthCheckRef:
        external: "projects/my-project/global/healthChecks/other"
  affinityCookieTtlSec: 60
  connectionDrainingTimeoutSec: 30
  localityLbPolicy: "RING_HASH"
  portName: "http"
  securityPolicyRef:
    external: "projects/my-project/regions/europe-west1/securityPolicies/waf"
  sessionAffinity: "HTTP_COOKIE"
  subsetting:
    policy: CONSISTENT_HASH_SUBSETTING
  timeoutSec: 20
  backend:
    - balancingMode: "UTILIZATION"
      capacityScaler: 0.5
      description: "The group."
      group:
        instanceGroupRef:
          name: full-group-ig
      maxUtilization: 0.8
    - balancingMode: "UTILIZATION"
      capacityScaler: 1
      description: "Terraform managed."
      group:
