---
# Source: container-registry/templates/iam.yaml
# NOTE container-registry: iam role roles/storage.admin was converted to roles/artifactregistry.repoAdmin. gcr.io repositories are legacy, supported for organizations still on gcr.io; new setups should use a native Artifact Registry repository with Artifact Registry roles directly.
---
# Source: container-registry/templates/main.yaml
apiVersion: artifactregistry.cnrm.cloud.google.com/v1beta1
kind: ArtifactRegistryRepository
metadata:
  name: storage-admin
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "storage-admin"
    app.kubernetes.io/name: container-registry
    app.kubernetes.io/version: "0.2.0"
  annotations:
    hfl.dev/id: "registry"
    cnrm.cloud.google.com/project-id: "my-project"
spec:
  resourceID: "gcr.io"
  location: "us"
  format: "DOCKER"
  mode: "STANDARD_REPOSITORY"
---
# Source: container-registry/templates/iam.yaml
apiVersion: iam.cnrm.cloud.google.com/v1beta1
kind: IAMPartialPolicy
metadata:
  name: storage-admin-iam
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "storage-admin"
    app.kubernetes.io/name: container-registry
    app.kubernetes.io/version: "0.2.0"
  annotations:
    hfl.dev/id: "iam"
spec:
  resourceRef:
    apiVersion: artifactregistry.cnrm.cloud.google.com/v1beta1
    kind: ArtifactRegistryRepository
    name: storage-admin
  bindings:
    - role: "roles/artifactregistry.repoAdmin"
      members:
        - member: "user:foo@example.com"
