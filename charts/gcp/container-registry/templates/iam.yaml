google_storage_bucket_iam_binding.bindings: fabric binds iam on the
registry's Cloud Storage bucket. The registry is now an Artifact Registry
repository, so iam is one IAMPartialPolicy on it (docs/design.md, "IAM").
Five Cloud Storage roles are translated to Artifact Registry roles, each
with a note; any other Cloud Storage role is refused
(containerRegistry.iam; README.md, "Values").
*/ -}}
{{- /* The notes go into the IAMPartialPolicy's own document, as comments
after its "---", so no comment-only document is rendered. */ -}}
{{- $r := include "containerRegistry.iam" . | fromJson }}
{{- $out := include "kcc.iam" (dict "root" $ "base" .Release.Name "idPrefix" "" "resourceRef" (dict "apiVersion" "artifactregistry.cnrm.cloud.google.com/v1beta1" "kind" "ArtifactRegistryRepository" "name" .Release.Name) "v" (dict "iam" $r.iam)) }}
{{- $notes := "" }}
{{- range $n := $r.notes }}{{ $notes = printf "%s# NOTE %s\n" $notes $n }}{{ end }}
{{- regexReplaceAll "^\\s*---\\n" $out (printf "\n---\n%s" $notes) }}
