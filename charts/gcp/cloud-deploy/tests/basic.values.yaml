# fabric's README basic example: a pipeline with two Cloud Run targets.
project_id: my-project
region: europe-west1
name: deployment-pipeline
targets:
  - name: dev-target
    description: Dev Target
    profiles: [dev]
    cloud_run_configs:
      automatic_traffic_control: true
  - name: prod-target
    description: Prod Target
    profiles: [prod]
    require_approval: true
    cloud_run_configs:
      automatic_traffic_control: true
