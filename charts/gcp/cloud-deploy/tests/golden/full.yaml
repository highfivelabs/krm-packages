apiVersion: clouddeploy.gcp.hfl.dev/v1beta1
kind: CloudDeployAutomation
metadata:
  name: full-automation-repair
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "full"
    app.kubernetes.io/name: cloud-deploy
    app.kubernetes.io/version: "0.2.0"
    team: "platform"
  annotations:
    hfl.dev/id: "automation:repair"
    cnrm.cloud.google.com/project-id: "other-project"
    cnrm.cloud.google.com/deletion-policy: abandon
spec:
  projectRef:
    external: "other-project"
  location: "us-central1"
  resourceID: "repair"
  deliveryPipeline: "full"
  serviceAccount: "deployer@my-project.iam.gserviceaccount.com"
  suspended: false
  rules:
    - repairRolloutRule:
        id: "repair-rollout"
        phases:
          - "stable"
        jobs:
          - "deploy"
        repairPhases:
          - retry:
              attempts: 3
              wait: "60s"
              backoffMode: "BACKOFF_MODE_EXPONENTIAL"
          - rollback:
              destinationPhase: "stable"
              disableRollbackIfRolloutPending: false
  selector:
    targets:
      - id: "*"
