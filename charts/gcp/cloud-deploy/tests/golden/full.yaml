# Source: cloud-deploy/templates/delivery-pipeline.yaml
apiVersion: clouddeploy.cnrm.cloud.google.com/v1beta1
kind: CloudDeployDeliveryPipeline
metadata:
  name: full
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "full"
    app.kubernetes.io/name: cloud-deploy
    app.kubernetes.io/version: "0.2.0"
    team: "platform"
  annotations:
    hfl.dev/id: "pipeline"
    cnrm.cloud.google.com/project-id: "my-project"
    cnrm.cloud.google.com/deletion-policy: abandon
spec:
  projectRef:
    external: "my-project"
  location: "europe-west1"
  resourceID: "full"
  description: "Every variable."
  annotations:
    "owner": "platform"
  suspended: false
  serialPipeline:
    stages:
      - targetID: "dev"
        profiles:
          - "dev"
        deployParameters:
          -
            values:
              "replicas": "1"
            matchTargetLabels:
              "tier": "dev"
        strategy:
          canary:
            canaryDeployment:
              percentages:
                - 10
                - 50
              verify: true
              predeploy:
                actions:
                  - "lint"
              postdeploy:
                actions:
                  - "smoke"
            runtimeConfig:
              cloudRun:
                automaticTrafficControl: false
                canaryRevisionTags:
                  - "canary"
                priorRevisionTags:
                  - "prior"
                stableRevisionTags:
                  - "stable"
      - targetID: "staging"
        strategy:
          canary:
            customCanaryDeployment:
              phaseConfigs:
                - phaseID: "phase1"
                  percentage: 25
                  verify: false
                  predeploy:
                    actions:
                      - "pre"
                - phaseID: "phase2"
                  percentage: 75
                  verify: false
                  postdeploy:
                    actions:
                      - "post"
      - targetID: "prod"
        strategy:
          standard:
            verify: false
      - targetID: "legacy"
        strategy:
          standard:
            verify: false
---
# Source: cloud-deploy/templates/deploy-policy.yaml
apiVersion: clouddeploy.gcp.hfl.dev/v1beta1
kind: CloudDeployDeployPolicy
metadata:
  name: full-policy-freeze
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "full"
    app.kubernetes.io/name: cloud-deploy
    app.kubernetes.io/version: "0.2.0"
    team: "platform"
  annotations:
    hfl.dev/id: "deploy_policy:freeze"
    cnrm.cloud.google.com/project-id: "my-project"
    cnrm.cloud.google.com/deletion-policy: abandon
spec:
  projectRef:
    external: "my-project"
  location: "europe-west1"
  resourceID: "freeze"
  description: "Holiday freeze."
  annotations:
    "owner": "platform"
  labels:
    "kind": "freeze"
  suspended: false
  rules:
    - rolloutRestriction:
        id: "holidays"
        timeWindows:
          timeZone: "America/New_York"
          oneTimeWindows:
            - startDate:
                day: 24
                month: 12
                year: 2026
              startTime:
                hours: 0
              endDate:
                day: 26
                month: 12
                year: 2026
              endTime:
                hours: 23
                minutes: 59
    - rolloutRestriction:
        id: "weekends"
        actions:
          - "CREATE"
        invokers:
          - "USER"
        timeWindows:
          timeZone: "America/New_York"
          weeklyWindows:
            -
              daysOfWeek:
                - "SATURDAY"
                - "SUNDAY"
              startTime:
                hours: 0
                minutes: 0
              endTime:
                hours: 23
                minutes: 59
  selectors:
    - deliveryPipeline:
        id: "full"
    - target:
        id: "*"
        labels:
          "tier": "prod"
