# GCP to GCP, after the module README's first example: a GCP peer gateway
# makes no object, the router advertises custom ranges, and two tunnels
# (one per gateway interface) each get a router interface and a BGP peer.
# The shared secret is a reference to a Kubernetes Secret (docs/secrets.md).
project_id: my-project
region: europe-west4
network: https://www.googleapis.com/compute/v1/projects/my-project/global/networks/vpc1
name: net1-to-net-2
peer_gateways:
  default: {gcp: projects/my-project/regions/europe-west4/vpnGateways/net2-to-net1}
router_config:
  asn: 64514
  custom_advertise:
    all_subnets: true
    ip_ranges: {10.0.0.0/8: default}
tunnels:
  remote-0:
    bgp_peer: {address: 169.254.1.1, asn: 64513}
    bgp_session_range: 169.254.1.2/30
    vpn_gateway_interface: 0
    shared_secret: {secretName: net1-to-net2-vpn, key: shared-secret}
  remote-1:
    bgp_peer: {address: 169.254.2.1, asn: 64513}
    bgp_session_range: 169.254.2.2/30
    vpn_gateway_interface: 1
    shared_secret: {secretName: net1-to-net2-vpn, key: shared-secret}
