# An existing gateway and router: no gateway and no router are made; the
# route policies (allow_alpha) and a tunnel's interface and peer go on the
# router router_config names, the tunnel on the gateway vpn_gateway names.
allow_alpha: true
project_id: my-project
region: europe-west1
network: projects/my-project/global/networks/my-network
name: vpn-existing
vpn_gateway: projects/my-project/regions/europe-west1/vpnGateways/existing
vpn_gateway_create: null
router_config:
  create: false
  name: existing-router
  route_policies:
    import:
      type: IMPORT
      terms: [{priority: 1, match: {expression: "true"}, actions: []}]
tunnels:
  remote-0:
    bgp_peer: {address: 169.254.1.1, asn: 64513}
    bgp_session_range: 169.254.1.2/30
    vpn_gateway_interface: 0
    shared_secret: {secretName: vpn-existing, key: shared-secret}
