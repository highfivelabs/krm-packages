# 0.10.0: an IAM deny policy (config-connector-extensions' IAMDenyPolicy),
# a Cloud Asset feed and the project in a VPC-SC perimeter, on a new
# project (the perimeter resource refers to the Project object).
name: secure-project
parent: folders/1234567890
iam_deny_policies:
  no-sa-keys:
    display_name: No service account keys
    rules:
      - description: Nobody but the admins creates keys.
        denied_principals: ["principalSet://goog/public:all"]
        denied_permissions: ["iam.googleapis.com/serviceAccountKeys.create"]
        exception_principals: ["principalSet://goog/group/admins@example.com"]
        denial_condition:
          title: only prod
          expression: resource.matchTag('1234567890/env', 'prod')
asset_feeds:
  buckets:
    content_type: RESOURCE
    asset_types: [storage.googleapis.com/Bucket]
    feed_output_config: {pubsub_destination: {topic: projects/secure-project/topics/assets}}
    condition: {expression: "!temporal_asset.deleted", title: live}
vpc_sc:
  perimeter_name: accessPolicies/1234/servicePerimeters/default
