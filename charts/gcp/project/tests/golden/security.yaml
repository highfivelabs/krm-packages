---
# Source: project/templates/deny-policies.yaml
apiVersion: iam.gcp.hfl.dev/v1beta1
kind: IAMDenyPolicy
metadata:
  name: security-deny-no-sa-keys
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "security"
    app.kubernetes.io/name: project
    app.kubernetes.io/version: "0.11.0"
  annotations:
    hfl.dev/id: "iam_deny_policy:no-sa-keys"
spec:
  resourceID: "no-sa-keys"
  projectRef:
    name: security
  displayName: "No service account keys"
  rules:
    - denyRule:
        deniedPrincipals:
          - "principalSet://goog/public:all"
        deniedPermissions:
          - "iam.googleapis.com/serviceAccountKeys.create"
        exceptionPrincipals:
          - "principalSet://goog/group/admins@example.com"
        denialCondition:
          title: "only prod"
          expression: "resource.matchTag('1234567890/env', 'prod')"
      description: "Nobody but the admins creates keys."
---
# Source: project/templates/project.yaml
apiVersion: resourcemanager.cnrm.cloud.google.com/v1beta1
kind: Project
metadata:
