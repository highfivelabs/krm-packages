    app.kubernetes.io/version: "0.11.0"
  annotations:
    hfl.dev/id: "project"
    cnrm.cloud.google.com/auto-create-network: "false"
spec:
  resourceID: secure-project
  name: "secure-project"
  folderRef:
    external: "1234567890"
