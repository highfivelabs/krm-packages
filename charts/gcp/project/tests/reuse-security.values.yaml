# 0.10.0 on a reused project with its number: a Cloud Asset feed and the
# project in a VPC-SC perimeter, both by number, and (behind allow_alpha) a hierarchical Cloud Armor
# policy association named project-<number>.
name: existing-project
project_reuse: {attributes: {name: existing-project, number: 123456789012}}
allow_alpha: true
vpc_sc:
  perimeter_name: accessPolicies/1234/servicePerimeters/default
cloud_armor_policy:
  policy_id: "987654321"
asset_feeds:
  buckets:
    content_type: RESOURCE
    asset_types: [storage.googleapis.com/Bucket]
    feed_output_config: {pubsub_destination: {topic: projects/existing-project/topics/assets}}
    condition: {expression: "!temporal_asset.deleted", title: live}
