# Module variables the chart keeps in values.yaml (so tfvars convert one to
# one) but refuses when set, or accepts only in part. Read by `task
# coverage`; `task coverage-verify` renders the chart to check that each one
# is refused. kind: gap (no Config Connector kind or field), alpha (a
# v1alpha1 kind, accepted with allow_alpha: true) or by-design (Bundt
# replaces it). partial: the variable is accepted, the reason says what is
# refused.
refused:
  - variable: context
    kind: by-design
    reason: "Bundt replaces fabric's $context lookups with ${...} expressions and valueFrom in the component's inputs"
  - variable: ca_configs
    kind: gap
    reason: "pem_ca_certificate and subordinate_config are refused: PrivateCACertificateAuthority has no pemCaCertificate or subordinateConfig field (a subordinate CA is made, and waits for activation, without them); deletion_protection, ignore_active_certificates_on_deletion and skip_grace_period are accepted and have no effect: they are Terraform's own delete options, and Config Connector has none"
    partial: true
    fields: [pem_ca_certificate, subordinate_config]
  - variable: ca_pool_config
    kind: gap
    reason: "create_pool.publishing_options.encoding_format DER is refused: PrivateCACAPool's publishingOptions has no encodingFormat, so the pool publishes PEM (the API's default)"
    partial: true
    fields: [encoding_format]
