#
# The Bundt Package for this chart (see iam-service-account/package.yaml).
# Outputs are fabric's declared outputs, selected (docs/design.md,
# "Outputs"): data_exchange_id from the rendered exchange; data_listings,
# by listing ID, the dataset each listing shares (fabric's is the
# listing's bigquery_dataset block, whose field is that dataset).
apiVersion: hfl.dev/v1
kind: Package
metadata:
  name: gcp-analytics-hub
spec:
  version: 0.1.0
  engine: helm
  providers: [kcc]
  outputs:
    data_exchange_id: resources.data_exchange.spec.resourceID
    data_listings: >-
      resources.transformMapEntry(k, v, v.kind == 'BigQueryAnalyticsHubListing',
        {k.substring(8): v.spec.source.bigQueryDatasetSource.datasetRef.external})
