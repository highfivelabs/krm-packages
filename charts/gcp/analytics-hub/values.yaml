#
# Values mirror the Terraform variables of fabric's analytics-hub module
# (v60.0.0): same names, types and defaults, so a module block's arguments
# become this file one to one (README.md, "From Terraform").
# values.schema.json carries the types.

# Names, labels and tags (docs/design.md, "Names, labels and tags"). Not
# Terraform variables: Bundt supplies names from a team's naming convention
# and stamps its identity labels; the chart takes them and computes none.
#
# names.data_exchange sets the data exchange's ID in full (else
# <prefix>_<name>). Listings are named by their keys, inside the exchange.
names: {}
# An optional convenience: "<namePrefix>_" (its hyphens as underscores) in
# front of the data exchange's ID when names.data_exchange is not set.
# Empty (the default) changes nothing.
namePrefix: ""
# Kubernetes labels on every object. Analytics Hub resources take no
# Google Cloud labels.
labels: {}
# Cloud labels: none of these resources takes any, so they stay on the
# objects' metadata.labels.
tags: {}

# Resource description for data exchange.
description: null
# Documentation describing the data exchange.
documentation: null
# Paths to data files and folders that enable factory functionality.
# Refused when set: a component has no files; use listings.
factories_config: {}
# Base64 encoded image representing the data exchange. Refused when set:
# BigQueryAnalyticsHubDataExchange has no icon.
icon: null
# Listings definitions in the form {LISTING_ID => LISTING_CONFIGS}.
listings: {}
# The ID of the data exchange.
name: ""
# Optional prefix for data exchange ID.
prefix: null
# Email or URL of the primary point of contact of the data exchange.
primary_contact: null
# The ID of the project where the data exchange will be created.
project_id: ""
# Region for the data exchange.
region: ""
# Authoritative IAM bindings in {ROLE => [MEMBERS]} format.
iam: {}
# Authoritative IAM bindings in {KEY => {role = ROLE, members = []}}. Keys
# are arbitrary; merged by role with iam, as fabric merges them.
iam_bindings: {}
# Individual additive IAM bindings. Keys are arbitrary. IAMMember is
# v1alpha1: needs allow_alpha.
iam_bindings_additive: {}
# Authoritative IAM binding in {PRINCIPAL => [ROLES]} format. Merged with
# iam.
iam_by_principals: {}

# Not a fabric variable: iam_bindings_additive renders
# config-connector-extensions' IAMMember, which is v1alpha1; set true to
# accept that its schema may change (docs/design.md, "Alpha kinds").
allow_alpha: false
# Not a fabric variable: DELETE (the default) or ABANDON, which keeps the
# exchange and its listings when the component is deleted. PREVENT has no
# Config Connector equivalent.
deletion_policy: null
