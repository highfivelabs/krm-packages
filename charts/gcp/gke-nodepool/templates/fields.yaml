Copyright 2022 Google LLC, Apache-2.0.

google_container_node_pool.nodepool's node_config.kubelet_config fields
Config Connector's ContainerNodePool has no field for
(insecure_kubelet_readonly_port_enabled, container_log_max_size,
container_log_max_files, allowed_unsafe_sysctls): a ContainerNodePoolFields
(config-connector-extensions, container.gcp.hfl.dev/v1beta1) on the node
pool, when any is set. Known limit: GKE takes kubeletConfig whole, so when
Config Connector changes one of its own kubelet fields, Terraform's update
can reset these until the ContainerNodePoolFields reconciles again
(README.md).
*/ -}}
{{- $v := .Values }}
{{- $kc := $v.node_config.kubelet_config | default dict }}
{{- $k := dict }}
{{- if not (kindIs "invalid" $kc.insecure_kubelet_readonly_port_enabled) }}{{ $_ := set $k "insecureKubeletReadonlyPortEnabled" (eq (upper (toString $kc.insecure_kubelet_readonly_port_enabled)) "TRUE") }}{{ end }}
{{- with $kc.container_log_max_size }}{{ $_ := set $k "containerLogMaxSize" . }}{{ end }}
{{- if not (kindIs "invalid" $kc.container_log_max_files) }}{{ $_ := set $k "containerLogMaxFiles" ($kc.container_log_max_files | int64) }}{{ end }}
{{- with $kc.allowed_unsafe_sysctls }}{{ $_ := set $k "allowedUnsafeSysctls" . }}{{ end }}
{{- with $k }}
---
apiVersion: container.gcp.hfl.dev/v1beta1
kind: ContainerNodePoolFields
metadata:
  {{- include "kcc.metadata" (dict "root" $ "name" (include "kcc.name" (list $.Release.Name "fields")) "id" "nodepool-fields" "abandon" (include "kcc.abandon" $)) | nindent 2 }}
spec:
  resourceRef:
    name: {{ $.Release.Name }}
  config:
    kubeletConfig:
      {{- toYaml . | nindent 6 }}
{{- end }}
