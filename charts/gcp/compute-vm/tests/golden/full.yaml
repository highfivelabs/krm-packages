# Source: compute-vm/templates/instance.yaml
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeInstance
metadata:
  name: full
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "full"
    app.kubernetes.io/name: compute-vm
    app.kubernetes.io/version: "0.1.0"
    env: "test"
    hfl.dev/team: "shop"
  annotations:
    hfl.dev/id: "instance"
    cnrm.cloud.google.com/project-id: "my-project"
spec:
  resourceID: "full"
  zone: "europe-west8-b"
  machineType: "n1-standard-4"
  hostname: "full.example.internal"
  description: "A test VM."
  tags: ["ssh","http-server"]
  minCpuPlatform: "Intel Cascade Lake"
  canIpForward: true
  deletionProtection: true
  enableDisplay: true
  metadata:
    - key: "enable-oslogin"
      value: "TRUE"
    - key: "serial-port-enable"
      value: "1"
  metadataStartupScript: "#!/bin/bash\necho hello"
  resourcePolicies:
    - external: "projects/my-project/regions/europe-west8/resourcePolicies/placement"
    - name: full-schedule
  advancedMachineFeatures:
    enableNestedVirtualization: true
    threadsPerCore: 1
    visibleCoreCount: 2
  attachedDisk:
    - deviceName: "full-repd"
      mode: "READ_ONLY"
      sourceDiskRef:
        name: full-disk-repd
    - deviceName: "data"
      mode: "READ_WRITE"
      sourceDiskRef:
        name: full-disk-data
    - deviceName: "legacy"
      mode: "READ_WRITE"
      sourceDiskRef:
        external: "projects/my-project/zones/europe-west8-b/disks/legacy-disk"
  bootDisk:
    autoDelete: false
    sourceDiskRef:
      name: full-boot
    kmsKeyRef:
      external: "projects/my-project/locations/europe-west8/keyRings/kr/cryptoKeys/k"
  confidentialInstanceConfig:
    enableConfidentialCompute: true
  networkInterface:
    - networkRef:
        external: "projects/my-project/global/networks/vpc"
      subnetworkRef:
        external: "projects/my-project/regions/europe-west8/subnetworks/subnet"
      networkIp: "10.0.0.10"
      nicType: "GVNIC"
      stackType: "IPV4_IPV6"
      queueCount: 2
      accessConfig:
        - {"natIpRef":{"external":"34.1.2.3"},"networkTier":"PREMIUM"}
      ipv6AccessConfig:
        - networkTier: PREMIUM
      aliasIpRange:
        - subnetworkRangeName: "pods"
          ipCidrRange: "10.16.0.0/24"
    - networkRef:
        external: "projects/my-project/global/networks/vpc-2"
      subnetworkRef:
        external: "projects/my-project/regions/europe-west8/subnetworks/subnet-2"
  networkPerformanceConfig:
    totalEgressBandwidthTier: "TIER_1"
  scheduling:
    automaticRestart: false
    instanceTerminationAction: "STOP"
    onHostMaintenance: "TERMINATE"
    preemptible: true
    provisioningModel: "SPOT"
    minNodeCpus: 2
    maxRunDuration:
      seconds: 3600
    localSsdRecoveryTimeout:
      seconds: 600
      nanos: 0
    nodeAffinities:
      - value:
          key: "compute.googleapis.com/node-group-name"
          operator: IN
          values: ["group-1"]
      - value:
          key: "workload"
          operator: NOT_IN
          values: ["batch"]
  scratchDisk:
    - interface: "NVME"
      size: 375
    - interface: "NVME"
      size: 375
  serviceAccount:
    serviceAccountRef:
      name: full-sa
    scopes: ["https://www.googleapis.com/auth/cloud-platform","https://www.googleapis.com/auth/userinfo.email"]
  shieldedInstanceConfig:
    enableSecureBoot: false
    enableVtpm: true
    enableIntegrityMonitoring: true
  params:
    resourceManagerTags: {"tagKeys/1234":"tagValues/5678"}
  guestAccelerator:
    - type: "nvidia-tesla-t4"
      count: 1
