apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeResourcePolicy
metadata:
  name: full-snapshot-daily
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "full"
    app.kubernetes.io/name: compute-vm
    app.kubernetes.io/version: "0.1.0"
    env: "test"
    hfl.dev/team: "shop"
  annotations:
    hfl.dev/id: "snapshot_schedule:daily"
    cnrm.cloud.google.com/project-id: "my-project"
spec:
  resourceID: "full-daily"
  region: "europe-west8"
  description: "Schedule policy daily for full."
  snapshotSchedulePolicy:
    schedule:
      dailySchedule:
        daysInCycle: 1
        startTime: "03:00"
    retentionPolicy:
      maxRetentionDays: 7
      onSourceDiskDelete: "APPLY_RETENTION_POLICY"
    snapshotProperties:
      labels: {"kind":"daily"}
      storageLocations: ["eu"]
      guestFlush: true
