metadata:
  name: mock-disk-data-snapshot-daily
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "mock"
    app.kubernetes.io/name: compute-vm
    app.kubernetes.io/version: "0.2.0"
