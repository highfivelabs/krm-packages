apiVersion: iam.cnrm.cloud.google.com/v1beta1
kind: IAMServiceAccount
metadata:
  name: mock-sa
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "mock"
    app.kubernetes.io/name: compute-vm
    app.kubernetes.io/version: "0.2.0"
  annotations:
    hfl.dev/id: "service_account"
    cnrm.cloud.google.com/project-id: "mock-project"
spec:
  resourceID: "tf-vm-catalog-mock-vm"
  displayName: "Terraform VM catalog-mock-vm."
