{{- /*
Copyright 2026 High Five Labs
SPDX-License-Identifier: Apache-2.0
Ported from cloud-foundation-fabric modules/compute-vm/iam.tf (v60.0.0),
Copyright 2026 Google LLC, Apache-2.0.

google_iap_tunnel_instance_iam_binding.authoritative: one IAMBinding
(config-connector-extensions, iam.gcp.hfl.dev/v1beta1) per role of
iap_tunnel_iam, exact per role as fabric's.
google_iap_tunnel_instance_iam_binding.bindings: one IAMBinding per entry
of iap_tunnel_iam_bindings.
google_iap_tunnel_instance_iam_member.bindings: one IAMMember
(config-connector-extensions, iam.gcp.hfl.dev/v1alpha1, so allow_alpha) per
entry of iap_tunnel_iam_bindings_additive.
config-connector-extensions resolves an IAP tunnel instance only from
external (projects/<p>/iap_tunnel/zones/<z>/instances/<name>).
*/ -}}
{{- $v := .Values }}
{{- if not (include "computeVm.isTemplate" .) }}
{{- $ref := dict "kind" "IAPTunnelInstance" "external" (printf "projects/%s/iap_tunnel/zones/%s/instances/%s" $v.project_id $v.zone (include "computeVm.instanceName" .)) }}
{{- range $role, $members := ($v.iap_tunnel_iam | default dict) }}
---
apiVersion: iam.gcp.hfl.dev/v1beta1
kind: IAMBinding
metadata:
  {{- include "kcc.metadata" (dict "root" $ "name" (include "kcc.name" (list $.Release.Name "iap-iam" $role)) "id" (printf "iap_iam:%s" $role) "project" $v.project_id) | nindent 2 }}
spec:
  resourceRef:
    {{- toYaml $ref | nindent 4 }}
  role: {{ $role | quote }}
  members:
  {{- range $m := ($members | uniq | sortAlpha) }}
    - {{ $m | quote }}
  {{- end }}
{{- end }}
{{- range $key, $b := ($v.iap_tunnel_iam_bindings | default dict) }}
---
apiVersion: iam.gcp.hfl.dev/v1beta1
kind: IAMBinding
metadata:
  {{- include "kcc.metadata" (dict "root" $ "name" (include "kcc.name" (list $.Release.Name "iap-iam-binding" $key)) "id" (printf "iap_iam_binding:%s" $key) "project" $v.project_id) | nindent 2 }}
spec:
  resourceRef:
    {{- toYaml $ref | nindent 4 }}
  role: {{ $b.role | quote }}
  members:
  {{- range $m := ($b.members | uniq | sortAlpha) }}
    - {{ $m | quote }}
  {{- end }}
  {{- with $b.condition }}
  condition:
    {{- include "kcc.condition" . | nindent 4 }}
  {{- end }}
{{- end }}
{{- include "kcc.alpha" (list $ "iap_tunnel_iam_bindings_additive" $v.iap_tunnel_iam_bindings_additive "IAMMember (config-connector-extensions)") }}
{{- range $key, $b := ($v.iap_tunnel_iam_bindings_additive | default dict) }}
{{- if not (and $b.member $b.role) }}
{{- fail (printf "compute-vm: iap_tunnel_iam_bindings_additive.%s: member and role are required" $key) }}
{{- end }}
---
apiVersion: iam.gcp.hfl.dev/v1alpha1
kind: IAMMember
metadata:
  {{- include "kcc.metadata" (dict "root" $ "name" (include "kcc.name" (list $.Release.Name "iap-iam-member" $key)) "id" (printf "iap_iam_member:%s" $key) "project" $v.project_id) | nindent 2 }}
spec:
  resourceRef:
    {{- toYaml $ref | nindent 4 }}
  role: {{ $b.role | quote }}
  member: {{ $b.member | quote }}
  {{- with $b.condition }}
  condition:
    {{- include "kcc.condition" . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
