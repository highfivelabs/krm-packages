apiVersion: v2
name: net-lb-proxy-int
description: >-
  A regional internal proxy Network Load Balancer (an L4 TCP proxy ILB):
  forwarding rules in a subnet, a TCP proxy, a regional backend service
  and health check, optional instance groups, network endpoint groups and a
  PSC service attachment, as Config Connector objects. A port of Cloud
  Foundation Fabric's net-lb-proxy-int module.
type: application
version: 0.2.0
# The fabric release this chart was ported from (UPSTREAM.md).
appVersion: "fabric-v60.0.0"
kubeVersion: ">=1.27.0-0"
keywords: [gcp, config-connector, load-balancer, tcp, proxy, internal, ilb, neg, fabric]
