#
# The Bundt Package for this chart (see iam-service-account/package.yaml).
# Outputs are fabric's declared outputs, selected (docs/design.md,
# "Outputs"). IDs from the rendered objects, as fabric's resources compute
# them; self links from the objects' status. address is each forwarding
# rule's spec.ipAddress.ip by rule name, as fabric keys it (the address
# given, or the one Config Connector writes back), else null. Not outputs:
# fabric's whole objects (backend_service, forwarding_rules, groups,
# health_check).
apiVersion: hfl.dev/v1
kind: Package
metadata:
  name: gcp-net-lb-proxy-int
spec:
  version: 0.2.0
  engine: helm
  providers: [kcc]
  outputs:
    address: >-
      resources.transformMapEntry(k, v, v.kind == 'ComputeForwardingRule',
        {v.spec.resourceID: has(v.spec.ipAddress) && has(v.spec.ipAddress.ip) ? dyn(v.spec.ipAddress.ip) : null})
    backend_service_id: >-
      'projects/' + resources.backend_service.metadata.annotations['cnrm.cloud.google.com/project-id']
      + '/regions/' + resources.backend_service.spec.location
      + '/backendServices/' + resources.backend_service.spec.resourceID
    backend_service_self_link: resources.backend_service.status.selfLink
    group_self_links: >-
      resources.transformMapEntry(k, v, v.kind == 'ComputeInstanceGroup',
        {k.substring(6): v.status.selfLink})
    health_check_id: >-
      'health_check' in resources
      ? dyn('projects/' + resources.health_check.metadata.annotations['cnrm.cloud.google.com/project-id']
        + '/regions/' + resources.health_check.spec.location
        + '/healthChecks/' + resources.health_check.spec.resourceID)
      : null
    health_check_self_link: >-
      'health_check' in resources ? dyn(resources.health_check.status.selfLink) : null
    ids: >-
      resources.transformMapEntry(k, v, v.kind == 'ComputeForwardingRule',
        {k.substring(16): 'projects/' + v.metadata.annotations['cnrm.cloud.google.com/project-id']
          + '/regions/' + v.spec.location + '/forwardingRules/' + v.spec.resourceID})
    neg_ids: >-
      resources.transformMapEntry(k, v, v.kind == 'ComputeNetworkEndpointGroup',
        {k.substring(4): 'projects/' + v.metadata.annotations['cnrm.cloud.google.com/project-id']
          + '/zones/' + v.spec.location + '/networkEndpointGroups/' + v.spec.resourceID})
    service_attachment_id: >-
      'service_attachment' in resources
      ? dyn('projects/' + resources.service_attachment.metadata.annotations['cnrm.cloud.google.com/project-id']
        + '/regions/' + resources.service_attachment.spec.location + '/serviceAttachments/' + resources.service_attachment.spec.resourceID)
      : null
