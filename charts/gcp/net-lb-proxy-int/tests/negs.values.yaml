# fabric's README, NEG examples: zonal (the chart's subnetwork), hybrid,
# and internet with endpoints, with a regional HTTP health check.
name: ilb-test
project_id: my-project
region: europe-west1
health_check_config:
  name: ilb-test-hc
  project_id: my-project
  check_interval_sec: 5
  enable_logging: true
  http: {port: 8080, request_path: /healthz}
backend_service_config:
  backends:
    - {group: zonal, balancing_mode: CONNECTION, max_connections: {per_endpoint: 10}}
    - {group: hybrid, balancing_mode: CONNECTION, max_connections: {per_endpoint: 10}}
    - {group: web}
neg_configs:
  zonal:
    gce:
      zone: europe-west1-b
      endpoints:
        e-0: {instance: my-vm, ip_address: 10.0.0.10, port: 80}
  hybrid:
    project_id: other-project
    hybrid:
      zone: europe-west1-b
      network: projects/other-project/global/networks/other-vpc
      endpoints:
        e-0: {ip_address: 192.168.0.3, port: 80}
  web:
    internet:
      region: europe-west1
      use_fqdn: false
      endpoints:
        e-0: {destination: 203.0.113.10, port: 443}
vpc_config:
  network: projects/my-project/global/networks/my-vpc
  subnetwork: projects/my-project/regions/europe-west1/subnetworks/my-subnet
