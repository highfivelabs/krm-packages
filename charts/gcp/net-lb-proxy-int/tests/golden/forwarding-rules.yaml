spec:
  resourceID: "ilb-test-bs"
  location: "europe-west1"
  description: "The backend."
  loadBalancingScheme: INTERNAL_MANAGED
  protocol: TCP
  healthChecks:
    - healthCheckRef:
        external: "projects/my-project/regions/europe-west1/healthChecks/existing"
  affinityCookieTtlSec: 60
  connectionDrainingTimeoutSec: 10
  portName: "tcp"
  sessionAffinity: "CLIENT_IP"
  timeoutSec: 30
  backend:
    - balancingMode: "CONNECTION"
      capacityScaler: 1
      description: "Terraform managed."
      group:
        instanceGroupRef:
          name: forwarding-rules-group-ig
      maxConnectionsPerInstance: 100
  logConfig:
    enable: true
    sampleRate: 0.5
