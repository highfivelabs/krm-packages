kind: ComputeBackendService
metadata:
  name: forwarding-rules
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "forwarding-rules"
    app.kubernetes.io/name: net-lb-proxy-int
    app.kubernetes.io/version: "0.2.0"
