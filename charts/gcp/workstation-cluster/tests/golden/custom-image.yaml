apiVersion: workstations.cnrm.cloud.google.com/v1beta1
kind: WorkstationConfig
metadata:
  name: custom-image-config-my-workstation-config
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "custom-image"
    app.kubernetes.io/name: workstation-cluster
    app.kubernetes.io/version: "0.2.0"
