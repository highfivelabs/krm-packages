  resourceID: "my-workstation-config"
  container:
    image: "repo/my-image:v10.0.0"
    args: ["--arg1","value1","--arg2","value2"]
    workingDir: "/my-dir"
    env:
      - name: "VAR1"
        value: "VALUE1"
      - name: "VAR2"
        value: "VALUE2"
