# Every variable and field the chart carries.
project_id: my-project
id: my-workstation-cluster
location: europe-west1
network_config:
  network: projects/my-project/global/networks/vpc
  subnetwork: projects/my-project/regions/europe-west1/subnetworks/subnet
display_name: My cluster
annotations: {owner: platform}
labels: {env: prod}
private_cluster_config:
  enable_private_endpoint: true
  allowed_projects: [other-project]
workstation_configs:
  dev:
    annotations: {purpose: dev}
    display_name: Developers
    labels: {tier: dev}
    replica_zones: [europe-west1-b, europe-west1-c]
    timeouts: {idle: 1200, running: 43200}
    container:
      image: europe-west1-docker.pkg.dev/my-project/ws/code-oss:latest
      command: [/bin/entrypoint]
      args: [--verbose]
      env: {EDITOR: vim}
      run_as_user: "1000"
      working_dir: /home/user
    encryption_key:
      kms_key: projects/my-project/locations/europe-west1/keyRings/kr/cryptoKeys/k
      kms_key_service_account: kms@my-project.iam.gserviceaccount.com
    gce_instance:
      boot_disk_size_gb: 50
      disable_public_ip_addresses: true
      enable_confidential_compute: true
      enable_nested_virtualization: false
      machine_type: n2d-standard-4
      pool_size: 1
      service_account: ws@my-project.iam.gserviceaccount.com
      service_account_scopes: [https://www.googleapis.com/auth/cloud-platform]
      tags: [workstation]
      shielded_instance_config: {enable_secure_boot: true, enable_vtpm: true, enable_integrity_monitoring: true}
    persistent_directories:
      - mount_path: /home
        gce_pd: {size_gb: 200, fs_type: ext4, disk_type: pd-balanced, reclaim_policy: DELETE}
    workstations:
      alice:
        display_name: Alice
        annotations: {user: alice}
        labels: {owner: alice}
