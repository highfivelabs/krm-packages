# Source: bigquery-connection/templates/main.yaml
apiVersion: bigqueryconnection.cnrm.cloud.google.com/v1beta1
kind: BigQueryConnectionConnection
metadata:
  name: full
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "full"
    app.kubernetes.io/name: bigquery-connection
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "connection"
    cnrm.cloud.google.com/project-id: "my-project"
    cnrm.cloud.google.com/deletion-policy: abandon
spec:
  projectRef:
    external: "my-project"
  location: "europe-west1"
  resourceID: "my_spark"
  friendlyName: "Spark"
  description: "Spark with a metastore and a history server."
  spark:
    metastoreService:
      metastoreServiceRef:
        external: "projects/my-project/locations/europe-west1/services/my-metastore"
    sparkHistoryServer:
      dataprocClusterRef:
        external: "projects/my-project/regions/europe-west1/clusters/my-history"
