#
# Values mirror the Terraform variables of fabric's bigquery-connection
# module (v60.0.0): same names, types and defaults, so a module block's
# arguments become this file one to one (README.md, "From Terraform").
# values.schema.json carries the types.

# Names, labels and tags (docs/design.md, "Names, labels and tags"). Not
# Terraform variables: Bundt supplies names from a team's naming convention
# and stamps its identity labels; the chart takes them and computes none.
#
# names.connection sets the connection's ID in full (else connection_id).
names: {}
# An optional convenience: "<namePrefix>-" in front of the connection's ID
# when names.connection is not set. Empty (the default) changes nothing.
namePrefix: ""
# Kubernetes labels on every object. A connection takes no Google Cloud
# labels.
labels: {}
# Cloud labels: a connection takes none, so they stay on the objects'
# metadata.labels.
tags: {}

# Connection properties: one of aws, azure, cloud_resource, cloud_spanner,
# cloud_sql, spark. cloud_sql's credential is a Kubernetes Secret
# (credential.secret_name), never a username and password here.
connection_config: {}
# The ID of the connection.
connection_id: ""
# Context-specific interpolations. Refused when set: Bundt expressions
# (${...}) and valueFrom replace fabric's $context lookups.
context: {}
# A description of the connection.
description: null
# The name of the KMS key used for encryption. Refused when set:
# BigQueryConnectionConnection has no kmsKeyName.
encryption_key: null
# A descriptive name for the connection.
friendly_name: null
# IAM bindings for the connection in {ROLE => [MEMBERS]} format.
iam: {}
# Authoritative IAM bindings in {KEY => {role = ROLE, members = [],
# condition = {}}}. Keys are arbitrary.
iam_bindings: {}
# Individual additive IAM bindings. Keys are arbitrary.
iam_bindings_additive: {}
# Authoritative IAM binding in {PRINCIPAL => [ROLES]} format. Merged with
# iam.
iam_by_principals: {}
# The geographic location where the connection should reside.
location: ""
# The ID of the project in which the resource belongs.
project_id: ""

# Not a fabric variable: no kind of this chart is alpha any more
# (config-connector-extensions' IAMMember is v1beta1 since 81c3f9b5); kept
# so components that set it still render, it changes nothing.
allow_alpha: false
# Not a fabric variable: DELETE (the default) or ABANDON, which keeps the
# connection when the component is deleted. PREVENT has no Config Connector
# equivalent.
deletion_policy: null
