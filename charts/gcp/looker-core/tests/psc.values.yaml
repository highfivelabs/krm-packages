# Fabric's README example "Looker Core with PSC", with an egress service
# attachment.
allow_alpha: true
project_id: my-project
region: europe-west1
name: looker-psc
network_config:
  psc_config:
    allowed_vpcs: ["projects/test-project/global/networks/test"]
    service_attachments:
      - local_fqdn: db.example.internal
        target_service_attachment_uri: projects/my-project/regions/europe-west1/serviceAttachments/db
oauth_config:
  client_id: xxxxxxxxx
  client_secret: {secretName: looker-oauth, key: client-secret}
platform_edition: LOOKER_CORE_ENTERPRISE_ANNUAL
