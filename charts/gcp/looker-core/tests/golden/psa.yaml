# Source: looker-core/templates/main.yaml
apiVersion: looker.gcp.hfl.dev/v1alpha1
kind: LookerInstance
metadata:
  name: psa
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "psa"
    app.kubernetes.io/name: looker-core
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "instance"
    cnrm.cloud.google.com/project-id: "my-project"
spec:
  projectRef:
    external: "my-project"
  location: "europe-west1"
  resourceID: "looker"
  platformEdition: "LOOKER_CORE_ENTERPRISE_ANNUAL"
  consumerNetwork: "projects/my-project/global/networks/my-network"
  privateIpEnabled: true
  publicIpEnabled: false
  pscEnabled: false
  oauthConfig:
    clientId: "xxxxxxxxx"
    clientSecret: {"valueFrom":{"secretKeyRef":{"key":"client-secret","name":"looker-oauth"}}}
