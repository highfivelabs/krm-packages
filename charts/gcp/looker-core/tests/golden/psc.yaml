# Source: looker-core/templates/main.yaml
apiVersion: looker.gcp.hfl.dev/v1alpha1
kind: LookerInstance
metadata:
  name: psc
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "psc"
    app.kubernetes.io/name: looker-core
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "instance"
    cnrm.cloud.google.com/project-id: "my-project"
spec:
  projectRef:
    external: "my-project"
  location: "europe-west1"
  resourceID: "looker-psc"
  platformEdition: "LOOKER_CORE_ENTERPRISE_ANNUAL"
  publicIpEnabled: false
  pscEnabled: true
  pscConfig:
    allowedVpcs: ["projects/test-project/global/networks/test"]
    serviceAttachments:
      - localFqdn: "db.example.internal"
        targetServiceAttachmentUri: "projects/my-project/regions/europe-west1/serviceAttachments/db"
  oauthConfig:
    clientId: "xxxxxxxxx"
    clientSecret: {"valueFrom":{"secretKeyRef":{"key":"client-secret","name":"looker-oauth"}}}
