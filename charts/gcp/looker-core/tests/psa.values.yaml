# Fabric's README example "Looker Core private instance with PSA", the
# network's id resolved.
allow_alpha: true
project_id: my-project
region: europe-west1
name: looker
network_config:
  psa_config:
    network: projects/my-project/global/networks/my-network
oauth_config:
  client_id: xxxxxxxxx
  client_secret: {secretName: looker-oauth, key: client-secret}
platform_edition: LOOKER_CORE_ENTERPRISE_ANNUAL
