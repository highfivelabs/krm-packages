# Module variables the chart keeps in values.yaml (so tfvars convert one to
# one) but refuses when set, or accepts only in part. Read by `task
# coverage`; `task coverage-verify` renders the chart to check that each one
# is refused. kind: gap (no Config Connector kind or field) or by-design
# (Bundt replaces it). partial: the variable is accepted, the reason says
# what is refused. The whole chart needs allow_alpha: true
# (config-connector-extensions' LookerInstance is v1alpha1).
refused:
  - variable: oauth_config
    kind: by-design
    reason: "client_secret is a reference to a Kubernetes Secret, {secretName, key}, rendered as LookerInstance's oauthConfig.clientSecret.valueFrom.secretKeyRef (docs/secrets.md); the secret itself, a string, is refused: it would be in the rendered manifest"
    partial: true
    fields: [client_secret]
