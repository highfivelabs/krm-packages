---
# Source: folder/templates/asset-feeds.yaml
apiVersion: asset.gcp.hfl.dev/v1beta1
kind: AssetFeed
metadata:
  name: mock-feed-catalog-mock-feed
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "mock"
    app.kubernetes.io/name: folder
    app.kubernetes.io/version: "0.3.0"
  annotations:
    hfl.dev/id: "asset-feed:catalog-mock-feed"
spec:
  resourceID: "catalog-mock-feed"
  folderRef:
    name: mock
  contentType: "RESOURCE"
  assetTypes: ["storage.googleapis.com/Bucket"]
  feedOutputConfig:
    pubsubDestination:
      topicRef:
        external: "projects/mock-project/topics/assets"
---
# Source: folder/templates/folder.yaml
apiVersion: resourcemanager.cnrm.cloud.google.com/v1beta1
kind: Folder
metadata:
  name: mock
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "mock"
    app.kubernetes.io/name: folder
    app.kubernetes.io/version: "0.3.0"
  annotations:
    hfl.dev/id: "folder"
spec:
  displayName: "catalog-mock-folder"
  organizationRef:
    external: "123450000000"
---
# Source: folder/templates/deny-policies.yaml
apiVersion: iam.gcp.hfl.dev/v1beta1
kind: IAMDenyPolicy
metadata:
  name: mock-deny-no-sa-keys
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "mock"
    app.kubernetes.io/name: folder
    app.kubernetes.io/version: "0.3.0"
  annotations:
    hfl.dev/id: "iam_deny_policy:no-sa-keys"
spec:
  resourceID: "no-sa-keys"
  folderRef:
    name: mock
  displayName: "No service account keys"
  rules:
    - denyRule:
        deniedPrincipals:
          - "principalSet://goog/public:all"
        deniedPermissions:
          - "iam.googleapis.com/serviceAccountKeys.create"
        exceptionPrincipals:
          - "principalSet://goog/group/admins@example.com"
      description: "Nobody but the admins creates keys."
---
# Source: folder/templates/iam.yaml
apiVersion: iam.cnrm.cloud.google.com/v1beta1
kind: IAMPartialPolicy
metadata:
  name: mock-iam
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "mock"
    app.kubernetes.io/name: folder
    app.kubernetes.io/version: "0.3.0"
  annotations:
    hfl.dev/id: "iam"
spec:
  resourceRef:
    apiVersion: resourcemanager.cnrm.cloud.google.com/v1beta1
    kind: Folder
    name: mock
  bindings:
    - role: "roles/viewer"
      members:
        - member: "group:viewers@example.com"
---
# Source: folder/templates/iam.yaml
apiVersion: iam.cnrm.cloud.google.com/v1beta1
kind: IAMPolicyMember
metadata:
  name: mock-iam-browser
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "mock"
    app.kubernetes.io/name: folder
    app.kubernetes.io/version: "0.3.0"
  annotations:
    hfl.dev/id: "iam-additive-browser"
spec:
  resourceRef:
    apiVersion: resourcemanager.cnrm.cloud.google.com/v1beta1
    kind: Folder
    name: mock
  role: "roles/browser"
  member: "user:one@example.com"
---
# Source: folder/templates/logging.yaml
apiVersion: logging.cnrm.cloud.google.com/v1beta1
kind: LoggingLogExclusion
metadata:
  name: mock-exclusion-no-gce
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "mock"
    app.kubernetes.io/name: folder
    app.kubernetes.io/version: "0.3.0"
  annotations:
    hfl.dev/id: "logging-exclusion:no-gce"
spec:
  resourceID: "no-gce"
  folderRef:
    name: mock
  description: "no-gce (Terraform-managed)."
  filter: "resource.type=gce_instance"
