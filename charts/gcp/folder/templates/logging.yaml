{{- /*
Copyright 2026 High Five Labs
SPDX-License-Identifier: Apache-2.0
Ported from cloud-foundation-fabric modules/folder/logging.tf (v60.0.0),
Copyright 2025 Google LLC, Apache-2.0.

google_folder_iam_audit_config.default: one IAMAuditConfig per service of
logging_data_access, with a log config per type set.
google_logging_folder_exclusion.logging_exclusion: one LoggingLogExclusion
per entry of logging_exclusions, described "<name> (Terraform-managed).".
google_logging_folder_sink.sink: one LoggingLogSink per entry of
logging_sinks, named by its key, config-connector-extensions' kind
(logging.gcp.hfl.dev/v1beta1; docs/design.md decision 16), which has
interceptChildren and a project destination (destination.projectRef), with
fabric's defaults (described "<name> (Terraform-managed).",
include_children true) and fabric's check that intercept_children needs
type project and include_children.
google_storage_bucket_iam_member, google_pubsub_topic_iam_member,
google_bigquery_dataset_iam_member and google_project_iam_member
.*_sinks_binding: with iam (the default), one config-connector-extensions
IAMMember granting the sink's writer identity (memberFrom.logSinkRef; Config
Connector's IAMPolicyMember resolves only its own LoggingLogSink) fabric's
role on the destination: storage.objectCreator on a bucket,
pubsub.publisher on a topic, bigquery.dataEditor on a dataset,
logging.bucketWriter on a log bucket's project (with fabric's condition on
the bucket) and logging.logWriter on a destination project.
google_logging_folder_settings.default (logging_settings, when not null):
config-connector-extensions' LoggingSettings (logging.gcp.hfl.dev/v1beta1)
on the folder, with disableDefaultSink, the CMEK key kms_key_name
(kmsKeyRef.external) and storageLocation as given; a field left null is
not set, so not managed, as fabric leaves it null. The settings always
exist: the object is always abandoned, so deleting it leaves them, as
removing fabric's variable does. A $context lookup in kms_key_name is
refused.
*/ -}}
{{- $v := .Values }}
{{- $access := $v.logging_data_access | default dict }}
{{- range $service := keys $access | sortAlpha }}
{{- $types := index $access $service | default dict }}
---
apiVersion: iam.cnrm.cloud.google.com/v1beta1
kind: IAMAuditConfig
metadata:
  {{- include "kcc.metadata" (dict "root" $ "name" (include "kcc.name" (list $.Release.Name "audit" $service)) "id" (printf "data-access:%s" $service)) | nindent 2 }}
spec:
  resourceRef:
    {{- include "folder.iamRef" $ | nindent 4 }}
  service: {{ $service | quote }}
  auditLogConfigs:
    {{- range $type := keys $types | sortAlpha }}
    {{- $c := index $types $type }}
    {{- if not (kindIs "invalid" $c) }}
    - logType: {{ $type | quote }}
      {{- with $c.exempted_members }}
      exemptedMembers: {{ toJson . }}
      {{- end }}
    {{- end }}
    {{- end }}
{{- end }}
{{- $exclusions := $v.logging_exclusions | default dict }}
{{- range $name := keys $exclusions | sortAlpha }}
---
apiVersion: logging.cnrm.cloud.google.com/v1beta1
kind: LoggingLogExclusion
metadata:
  {{- include "kcc.metadata" (dict "root" $ "name" (include "kcc.name" (list $.Release.Name "exclusion" $name)) "id" (printf "logging-exclusion:%s" $name) "abandon" (include "kcc.abandon" $)) | nindent 2 }}
spec:
  resourceID: {{ include "kcc.cloudName" (list $ "logging exclusion" $name 100) | quote }}
  folderRef:
    {{- include "folder.ref" $ | nindent 4 }}
  description: {{ printf "%s (Terraform-managed)." $name | quote }}
  filter: {{ index $exclusions $name | quote }}
{{- end }}

{{- $sinks := $v.logging_sinks | default dict }}
{{- $abandon := include "kcc.abandon" $ }}
{{- range $name := keys $sinks | sortAlpha }}
{{- $s := index $sinks $name }}
{{- if not (has $s.type (list "bigquery" "logging" "project" "pubsub" "storage")) }}
{{- fail (printf "folder: logging_sinks.%s: Type must be one of 'bigquery', 'logging', 'project', 'pubsub', 'storage'." $name) }}
{{- end }}
{{- if and $s.bq_partitioned_table (ne $s.type "bigquery") }}
{{- fail (printf "folder: logging_sinks.%s: Can only set bq_partitioned_table when type is `bigquery`." $name) }}
{{- end }}
{{- $include := ternary true $s.include_children (kindIs "invalid" $s.include_children) }}
{{- if and $s.intercept_children (not (and $include (eq $s.type "project"))) }}
{{- fail (printf "folder: logging_sinks.%s: 'type' must be set to 'project' if 'intercept_children' is 'true'." $name) }}
{{- end }}
{{- $iam := ternary true $s.iam (kindIs "invalid" $s.iam) }}
{{- $dest := toString $s.destination }}
{{- if eq $s.type "project" }}{{ $dest = trimPrefix "projects/" $dest }}{{ end }}
{{- $kname := include "kcc.name" (list $.Release.Name "sink" $name) }}
---
apiVersion: logging.gcp.hfl.dev/v1beta1
kind: LoggingLogSink
metadata:
  {{- include "kcc.metadata" (dict "root" $ "name" $kname "id" (printf "logging-sink:%s" $name) "abandon" $abandon) | nindent 2 }}
spec:
  resourceID: {{ include "kcc.cloudName" (list $ "logging sink" $name 100) | quote }}
  folderRef:
    {{- include "folder.ref" $ | nindent 4 }}
  description: {{ (kindIs "invalid" $s.description | ternary (printf "%s (Terraform-managed)." $name) $s.description) | quote }}
  destination:
    {{- if eq $s.type "bigquery" }}
    bigQueryDatasetRef:
    {{- else if eq $s.type "logging" }}
    loggingLogBucketRef:
    {{- else if eq $s.type "pubsub" }}
    pubSubTopicRef:
    {{- else if eq $s.type "project" }}
    projectRef:
    {{- else }}
    storageBucketRef:
    {{- end }}
      external: {{ $dest | quote }}
  {{- with $s.filter }}
  filter: {{ . | quote }}
  {{- end }}
  includeChildren: {{ $include }}
  interceptChildren: {{ $s.intercept_children | default false }}
  disabled: {{ $s.disabled | default false }}
  {{- if eq $s.type "bigquery" }}
  bigqueryOptions:
    usePartitionedTables: {{ $s.bq_partitioned_table | default false }}
  {{- end }}
  {{- with $s.exclusions }}
  exclusions:
    {{- range $ek := keys . | sortAlpha }}
    - name: {{ $ek | quote }}
      filter: {{ index $s.exclusions $ek | quote }}
    {{- end }}
  {{- end }}
{{- if $iam }}
{{- $parts := splitList "/" $dest }}
---
apiVersion: iam.gcp.hfl.dev/v1beta1
kind: IAMMember
metadata:
  {{- include "kcc.metadata" (dict "root" $ "name" (include "kcc.name" (list $.Release.Name "sink-writer" $name)) "id" (printf "logging-sink-writer:%s" $name)) | nindent 2 }}
spec:
  memberFrom:
    logSinkRef:
      apiVersion: logging.gcp.hfl.dev/v1beta1
      name: {{ $kname }}
  {{- if eq $s.type "storage" }}
  role: roles/storage.objectCreator
  resourceRef:
    kind: StorageBucket
    external: {{ $dest | quote }}
  {{- else if eq $s.type "pubsub" }}
  role: roles/pubsub.publisher
  resourceRef:
    kind: PubSubTopic
    external: {{ $dest | quote }}
  {{- else if eq $s.type "bigquery" }}
  {{- if or (lt (len $parts) 4) (ne (index $parts 2) "datasets") }}
  {{- fail (printf "folder: logging_sinks.%s: a bigquery sink's destination must be projects/<project>/datasets/<dataset>" $name) }}
  {{- end }}
  role: roles/bigquery.dataEditor
  resourceRef:
    kind: BigQueryDataset
    external: {{ printf "projects/%s/datasets/%s" (index $parts 1) (index $parts 3) | quote }}
  {{- else if eq $s.type "project" }}
  role: roles/logging.logWriter
  resourceRef:
    kind: Project
    external: {{ printf "projects/%s" $dest | quote }}
  {{- else }}
  {{- if lt (len $parts) 6 }}
  {{- fail (printf "folder: logging_sinks.%s: a logging sink's destination must be projects/<project>/locations/<location>/buckets/<bucket>" $name) }}
  {{- end }}
  role: roles/logging.bucketWriter
  resourceRef:
    kind: Project
    external: {{ printf "projects/%s" (index $parts 1) | quote }}
  condition:
    title: {{ printf "%s bucket writer" $name | quote }}
    description: {{ printf "Grants bucketWriter to the writer identity used by log sink %s on %s" $name (include "folder.idOrName" $) | quote }}
    expression: {{ printf "resource.name.endsWith('locations/%s/buckets/%s')" (index $parts 3) (index $parts 5) | quote }}
  {{- end }}
{{- end }}
{{- end }}
{{- with $v.logging_settings }}
{{- if hasPrefix "$" (toString .kms_key_name) }}
{{- include "kcc.unsupported" (list $ "context" "x" (printf "logging_settings.kms_key_name %q is a fabric $context lookup; Bundt replaces them with ${...} expressions and valueFrom in the component's inputs" .kms_key_name)) }}
{{- end }}
---
apiVersion: logging.gcp.hfl.dev/v1beta1
kind: LoggingSettings
metadata:
  {{- include "kcc.metadata" (dict "root" $ "name" (include "kcc.name" (list $.Release.Name "logging-settings")) "id" "logging-settings" "abandon" "true") | nindent 2 }}
spec:
  folderRef:
    {{- include "folder.ref" $ | nindent 4 }}
  {{- if not (kindIs "invalid" .disable_default_sink) }}
  disableDefaultSink: {{ .disable_default_sink }}
  {{- end }}
  {{- with .kms_key_name }}
  kmsKeyRef:
    external: {{ . | quote }}
  {{- end }}
  {{- with .storage_location }}
  storageLocation: {{ . | quote }}
  {{- end }}
{{- end }}
