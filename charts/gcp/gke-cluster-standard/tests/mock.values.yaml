# The fake-cloud case (hack/mock-apply.sh): a zonal cluster on the network
# and subnet tests/mock.needs.yaml makes, fabric's defaults, no backup
# objects (their kinds are newer than the fake cloud's CCE_COMMIT).
project_id: mock-project
name: catalog-mock-gks
location: us-central1-a
vpc_config:
  network: projects/mock-project/global/networks/catalog-mock-gks-net
  subnetwork: projects/mock-project/regions/us-central1/subnetworks/catalog-mock-gks-sn
access_config: {private_nodes: false}
deletion_protection: false
# Fields ContainerCluster lacks, set by config-connector-extensions'
# ContainerClusterFields (mockgcp takes the desired* updates, patch 0053).
enable_addons: {stateful_ha: true}
enable_features:
  secret_manager_config: true
  anonymous_authentication: LIMITED
  rbac_binding_config: {enable_insecure_binding_system_unauthenticated: false}
