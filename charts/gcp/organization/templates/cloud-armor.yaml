{{- /*
Copyright 2026 High Five Labs
SPDX-License-Identifier: Apache-2.0
Ported from cloud-foundation-fabric modules/organization/main.tf (v60.0.0),
Copyright 2025 Google LLC, Apache-2.0.

google_compute_organization_security_policy_association.default
(cloud_armor_policy): a ComputeOrganizationSecurityPolicyAssociation
(compute.gcp.hfl.dev/v1beta1, config-connector-extensions) of the
hierarchical Cloud Armor policy with the organization, named
organization-<id> unless named, with its excluded folders (folders/N) and
projects (projects/<number>).
*/ -}}
{{- $v := .Values }}
{{- $abandon := include "kcc.abandon" . }}
{{- with $v.cloud_armor_policy }}
{{- $number := include "organization.number" $ }}
{{- include "organization.context" (list $ "cloud_armor_policy.policy_id" .policy_id) }}
---
apiVersion: compute.gcp.hfl.dev/v1beta1
kind: ComputeOrganizationSecurityPolicyAssociation
metadata:
  {{- include "kcc.metadata" (dict "root" $ "name" (include "kcc.name" (list $.Release.Name "cloud-armor")) "id" "cloud_armor_policy" "abandon" $abandon) | nindent 2 }}
spec:
  resourceID: {{ include "kcc.cloudName" (list $ "Cloud Armor policy association" (.name | default (printf "organization-%s" $number)) 63) | quote }}
  attachmentId: {{ include "organization.id" $ | quote }}
  policyId: {{ .policy_id | quote }}
  {{- with .excluded_folders }}
  excludedFolders: {{ toJson . }}
  {{- end }}
  {{- with .excluded_projects }}
  excludedProjects: {{ toJson . }}
  {{- end }}
{{- end }}
