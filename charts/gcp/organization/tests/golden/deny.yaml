---
# Source: organization/templates/deny-policies.yaml
apiVersion: iam.gcp.hfl.dev/v1beta1
kind: IAMDenyPolicy
metadata:
  name: deny-deny-conditional-key-deny
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "deny"
    app.kubernetes.io/name: organization
    app.kubernetes.io/version: "0.7.0"
  annotations:
    hfl.dev/id: "deny-policy:conditional-key-deny"
spec:
  resourceID: "conditional-key-deny"
  organizationRef:
    external: "organizations/1122334455"
  displayName: "Conditional SA Key Deny"
  rules:
    -
      description: "Deny key creation outside of authorized IPs using a condition."
      denyRule:
        deniedPrincipals: ["principalSet://goog/public:all"]
        deniedPermissions: ["iam.serviceAccountKeys.create"]
        denialCondition:
          expression: "!inIpRange(request.auth.access_levels, 'accessPolicies/123456789/accessLevels/trusted_ips')"
          title: "ip-restriction"
          description: "Restrict access to specific IP ranges"
---
# Source: organization/templates/deny-policies.yaml
apiVersion: iam.gcp.hfl.dev/v1beta1
kind: IAMDenyPolicy
metadata:
  name: deny-deny-prevent-sa-token-creation
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "deny"
    app.kubernetes.io/name: organization
    app.kubernetes.io/version: "0.7.0"
  annotations:
    hfl.dev/id: "deny-policy:prevent-sa-token-creation"
spec:
  resourceID: "prevent-sa-token-creation"
  organizationRef:
    external: "organizations/1122334455"
  displayName: "Prevent SA token creation"
  rules:
    -
      description: "Deny service account token creation to all except the central admin group."
      denyRule:
        deniedPrincipals: ["principalSet://goog/public:all"]
        deniedPermissions: ["iam.serviceAccounts.getAccessToken"]
        exceptionPrincipals: ["principalSet://goog/group/gcp-admins@example.com"]
