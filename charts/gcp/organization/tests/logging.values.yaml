# The module README's log sinks and data access logs examples, less the
# $context destination (Bundt replaces it), plus an intercepting project
# sink and the organization's logging settings (the module README's
# logging_settings example has none; fabric's variable).
organization_id: organizations/1122334455
logging_sinks:
  warnings:
    destination: test-prod-log-audit-0
    filter: severity=WARNING
    type: storage
  info:
    bq_partitioned_table: true
    destination: projects/my-project/datasets/bq_sink
    filter: severity=INFO
    type: bigquery
  notice:
    destination: projects/my-project/topics/pubsub_sink
    filter: severity=NOTICE
    type: pubsub
  debug:
    destination: projects/my-project/locations/global/buckets/my-bucket
    filter: severity=DEBUG
    exclusions:
      no-compute: logName:compute
  audit:
    destination: my-audit-project
    filter: logName:cloudaudit.googleapis.com
    type: project
    intercept_children: true
logging_settings:
  disable_default_sink: true
  kms_key_name: projects/kms-project/locations/europe-west1/keyRings/logging/cryptoKeys/router
  storage_location: europe-west1
logging_exclusions:
  no-gce-instances: resource.type=gce_instance
logging_data_access:
  allServices:
    ADMIN_READ:
      exempted_members: ["group:organization-admins@example.org"]
  storage.googleapis.com:
    DATA_READ: {}
    DATA_WRITE: {}
