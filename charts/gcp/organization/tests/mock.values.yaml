# Applied to the fake cloud by hack/mock-apply.sh. The organization ID is
# fake (mockgcp answers for any). Authoritative and additive IAM, a custom
# role, a custom constraint and an organization policy, a tag key with a
# value, a logging exclusion, an asset feed and a service agent
# (config-connector-extensions' AssetFeed and ServiceIdentity, v1beta1). The org policy is on the organization, an
# external reference, so it does not hit the folder chart's delete-order bug
# (README.md, "Config Connector bugs"). No contact: mockgcp's essential
# contacts take only a project parent.
organization_id: organizations/123450000000
iam:
  roles/viewer: ["group:viewers@example.com"]
iam_bindings_additive:
  browser: {role: roles/browser, member: "user:one@example.com"}
custom_roles:
  catalogMockRole:
    permissions: [compute.instances.list]
org_policy_custom_constraints:
  custom.catalogMockConstraint:
    resource_types: [container.googleapis.com/NodePool]
    method_types: [CREATE]
    condition: resource.management.autoUpgrade == true
    action_type: ALLOW
org_policies:
  compute.disableGuestAttributesAccess:
    rules: [{enforce: true}]
tags:
  catalog-mock-env:
    values:
      dev: {}
# An intercepting sink to the mock project (config-connector-extensions'
# LoggingLogSink), its writer identity granted logging.logWriter there by
# an IAMMember (memberFrom.logSinkRef).
logging_sinks:
  audit:
    destination: mock-project
    type: project
    intercept_children: true
    filter: logName:cloudaudit.googleapis.com
logging_exclusions:
  no-gce: resource.type=gce_instance
asset_feeds:
  catalog-mock-feed:
    billing_project: mock-project
    content_type: RESOURCE
    asset_types: [storage.googleapis.com/Bucket]
    feed_output_config: {pubsub_destination: {topic: projects/mock-project/topics/assets}}
service_agents_config:
  services: [privilegedaccessmanager.googleapis.com]
