# Passwords as references to Kubernetes Secrets (docs/secrets.md): the
# cluster's initial user and a built-in user, beside an IAM user.
project_id: myproject
cluster_name: orders
instance_name: orders
location: europe-west8
network_config: {psa_config: {network: projects/myproject/global/networks/default}}
initial_user:
  password: {secretName: orders-adb, key: postgres}
users:
  app: {password: {secretName: orders-adb, key: app}, roles: [alloydbsuperuser]}
  dev@example.com: {type: ALLOYDB_IAM_USER}
