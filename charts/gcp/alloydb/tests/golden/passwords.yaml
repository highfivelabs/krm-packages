kind: AlloyDBCluster
metadata:
  name: passwords
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "passwords"
    app.kubernetes.io/name: alloydb
    app.kubernetes.io/version: "0.2.0"
