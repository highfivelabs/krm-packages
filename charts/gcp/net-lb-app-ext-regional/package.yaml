#
# The Bundt Package for this chart (see iam-service-account/package.yaml).
# Outputs are fabric's declared outputs, selected (docs/design.md,
# "Outputs"). IDs and names from the rendered objects, as fabric's
# resources compute them; generated IDs from the backend services' status.
# address is the forwarding rule's spec.ipAddress.ip (the address given,
# or the one Config Connector writes back once the rule exists), else
# null: ComputeForwardingRule's status has no address. Not an output:
# fabric's whole forwarding_rule.
apiVersion: hfl.dev/v1
kind: Package
metadata:
  name: gcp-net-lb-app-ext-regional
spec:
  version: 0.1.0
  engine: helm
  providers: [kcc]
  outputs:
    address: >-
      has(resources.forwarding_rule.spec.ipAddress) && has(resources.forwarding_rule.spec.ipAddress.ip)
      ? dyn(resources.forwarding_rule.spec.ipAddress.ip) : null
    backend_service_generated_ids: >-
      resources.transformMapEntry(k, v, v.kind == 'ComputeBackendService',
        {k.substring(16): has(v.status) && has(v.status.generatedId) ? dyn(v.status.generatedId) : null})
    backend_service_ids: >-
      resources.transformMapEntry(k, v, v.kind == 'ComputeBackendService',
        {k.substring(16): 'projects/' + v.metadata.annotations['cnrm.cloud.google.com/project-id']
          + '/regions/' + v.spec.location + '/backendServices/' + v.spec.resourceID})
    backend_service_names: >-
      resources.transformMapEntry(k, v, v.kind == 'ComputeBackendService',
        {k.substring(16): v.spec.resourceID})
    group_ids: >-
      resources.transformMapEntry(k, v, v.kind == 'ComputeInstanceGroup',
        {k.substring(6): 'projects/' + v.metadata.annotations['cnrm.cloud.google.com/project-id']
          + '/zones/' + v.spec.zone + '/instanceGroups/' + v.spec.resourceID})
    health_check_ids: >-
      resources.transformMapEntry(k, v, v.kind == 'ComputeHealthCheck',
        {k.substring(13): 'projects/' + v.metadata.annotations['cnrm.cloud.google.com/project-id']
          + '/regions/' + v.spec.location + '/healthChecks/' + v.spec.resourceID})
    id: >-
      'projects/' + resources.forwarding_rule.metadata.annotations['cnrm.cloud.google.com/project-id']
      + '/regions/' + resources.forwarding_rule.spec.location + '/forwardingRules/' + resources.forwarding_rule.spec.resourceID
    neg_ids: >-
      resources.transformMapEntry(k, v, v.kind == 'ComputeNetworkEndpointGroup' || v.kind == 'ComputeRegionNetworkEndpointGroup',
        {k.substring(k.indexOf(':') + 1): 'projects/' + v.metadata.annotations['cnrm.cloud.google.com/project-id']
          + (v.kind == 'ComputeNetworkEndpointGroup' ? '/zones/' + v.spec.location : '/regions/' + v.spec.region)
          + '/networkEndpointGroups/' + v.spec.resourceID})
    url_map_id: >-
      'projects/' + resources.url_map.metadata.annotations['cnrm.cloud.google.com/project-id']
      + '/regions/' + resources.url_map.spec.location + '/urlMaps/' + resources.url_map.spec.resourceID
