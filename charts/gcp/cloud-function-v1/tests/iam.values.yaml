# fabric's "Controlling HTTP access" example, plus a second role: one
# IAMBinding (config-connector-extensions) per role on the function.
project_id: my-project
region: europe-west1
name: test-cf-http
bucket_name: my-bucket
bundle_config: {path: "gs://my-bucket/bundles/function.zip"}
iam:
  roles/cloudfunctions.invoker: ["allUsers"]
  roles/cloudfunctions.viewer: ["group:viewers@example.org"]
