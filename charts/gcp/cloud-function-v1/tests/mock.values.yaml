# Applied to the fake cloud by hack/mock-apply.sh: an HTTP function (its
# bundle object need not exist in mockgcp), the bucket the chart makes for
# it, and its service account with one project role. No iam: README,
# "Tests".
project_id: mock-project
region: us-central1
name: mock-cf1
bucket_name: catalog-mock-cf1-code
bucket_config: {force_destroy: true}
bundle_config: {path: "gs://catalog-mock-cf1-code/fn.zip"}
service_account_config:
  roles: [roles/logging.logWriter]
labels: {env: test}
