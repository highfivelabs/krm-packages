apiVersion: cloudfunctions.cnrm.cloud.google.com/v1beta1
kind: CloudFunctionsFunction
metadata:
  name: bucket
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "bucket"
    app.kubernetes.io/name: cloud-function-v1
    app.kubernetes.io/version: "0.1.0"
  annotations:
    hfl.dev/id: "function"
    cnrm.cloud.google.com/project-id: "my-project"
spec:
  projectRef:
    external: "my-project"
  region: "europe-west1"
  resourceID: "myprefix-test-cf-http"
  description: "Terraform managed."
  runtime: "python312"
  availableMemoryMb: 256
  maxInstances: 1
  timeout: "180s"
  entryPoint: "main"
  serviceAccountRef:
    name: bucket-sa
  sourceArchiveUrl: "gs://myprefix-my-bucket/bundles/function.zip"
  httpsTrigger:
    securityLevel: "SECURE_ALWAYS"
