---
# Source: cloud-function-v1/templates/main.yaml
apiVersion: cloudfunctions.cnrm.cloud.google.com/v1beta1
kind: CloudFunctionsFunction
metadata:
  name: service-account
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: "service-account"
    app.kubernetes.io/name: cloud-function-v1
    app.kubernetes.io/version: "0.2.0"
  annotations:
    hfl.dev/id: "function"
    cnrm.cloud.google.com/project-id: "my-project"
spec:
  projectRef:
    external: "my-project"
  region: "europe-west1"
  resourceID: "test-cf-http"
  description: "Terraform managed."
  runtime: "python312"
  availableMemoryMb: 256
  maxInstances: 1
  timeout: "180s"
  entryPoint: "main"
  serviceAccountRef:
    external: "existing@my-project.iam.gserviceaccount.com"
  sourceArchiveUrl: "gs://my-bucket/bundles/function.zip"
  httpsTrigger:
    securityLevel: "SECURE_ALWAYS"
