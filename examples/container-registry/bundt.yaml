apiVersion: hfl.dev/v1
kind: Template
metadata:
  name: container-registry
spec:
  version: "1.0.0"
  components:
    - name: container-registry
      package:
        name: gcp-container-registry
        version: "0.2.0"
      inputs:
        project_id: my-project
        location: EU
        iam:
          roles/artifactregistry.reader:
            - user:me@example.com
---
apiVersion: hfl.dev/v1
kind: Stack
metadata:
  name: container-registry
  scope: my-team
spec:
  template: container-registry
---
apiVersion: hfl.dev/v1
kind: Instance
metadata:
  name: container-registry-dev
  scope: my-team/dev
spec:
  stack: container-registry
  version: "1.0.0"
